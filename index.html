function drawParticles(){
  ctx.globalCompositeOperation='lighter';
  for (const p of parts){
    const a = clamp(p.life/p.max,0,1);
    if (p.ring){ ctx.strokeStyle=rgba(p.c,a*.55); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.6-a*1.1),0,TAU); ctx.stroke(); }
    else { ctx.fillStyle=rgba(p.c,a*.95);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a+.4,0,TAU); ctx.fill(); }
  }
  ctx.globalCompositeOperation='source-over';
}
function drawFloats(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of floats){
    ctx.font='500 13px ui-monospace,monospace';
    ctx.fillStyle=rgba(f.col, clamp(f.life/f.max,0,1)*.9);
    ctx.fillText(f.txt,f.x,f.y);
  }
}
function compositeGlow(ox,oy){
  const gw=glowC.width, gh=glowC.height, sxr=gw/W, syr=gh/H;
  gctx.setTransform(1,0,0,1,0,0);
  gctx.clearRect(0,0,gw,gh);
  gctx.globalCompositeOperation='lighter';
  for (const g of glows){
    const img = blob(g.c), r = g.r*2*sxr;
    gctx.globalAlpha = clamp(g.a,0,1);
    gctx.drawImage(img, g.x*sxr-r/2, g.y*syr-r/2, r, r);
  }
  gctx.globalAlpha = 1;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.9;  ctx.drawImage(glowC,ox,oy,W,H);
  ctx.globalAlpha=.45; ctx.drawImage(glowC,ox-6,oy-6,W+12,H+12);
  ctx.restore();
}
function drawVignette(){
  const key = W+'x'+H;
  if (vigKey!==key){
    vigKey = key;
    vignette = ctx.createRadialGradient(W/2,H*.5,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.78);
    vignette.addColorStop(0,'rgba(0,0,0,0)'); vignette.addColorStop(1,'rgba(0,0,0,.55)');
  }
  ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H);
}

let hudSig = '';
function refreshHUD(force){
  elScore.textContent = score.toLocaleString();
  elMult.textContent = '×'+mult;
  elMult.classList.toggle('hot', mult>8);
  elCores.textContent = cores;
  elChain.style.width = clamp((chain%8)/8*100,0,100)+'%';
  const sig = P.lives+'|'+P.bombs+'|'+P.shield+'|'+JSON.stringify(P.mods)+'|'+diff.key;
  if (sig===hudSig && !force) return;
  hudSig = sig;
  let pips='';
  for (let i=0;i<Math.max(P.lives,0);i++) pips += '<div class="pip on"></div>';
  for (let i=Math.max(P.lives,0);i<diff.lives;i++) pips += '<div class="pip"></div>';
  elLife.innerHTML = pips;
  let mods='';
  if (P.shield>0) mods += '<div class="mod">SHD '+P.shield+'</div>';
  for (const k in P.mods) if (P.mods[k]>0) mods += '<div class="mod">'+MODNAME[k]+' '+P.mods[k]+'</div>';
  elMods.innerHTML = mods;
  elPadBomb.innerHTML = '<b>'+P.bombs+'</b>'+(DESKTOP?'L-CLICK':'Bomb');

/* --- reusable option row --- */
function optionRow(host,label,items,current,onPick){
  const wrap = document.createElement('div'); wrap.className='grp';
  const lab = document.createElement('div'); lab.className='grpLabel'; lab.textContent=label;
  const box = document.createElement('div'); box.className='choices';
  items.forEach((it,i)=>{
    const b = document.createElement('button');
    b.className='choice'; b.setAttribute('aria-pressed', i===current);
    b.innerHTML = it.label + (it.note?'<small>'+it.note+'</small>':'');
    b.onclick = ()=>{ [...box.children].forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true'); Sound.init(); Sound.resume(); Sound.pickup(); onPick(i); };
    box.appendChild(b);
  });
  wrap.appendChild(lab); wrap.appendChild(box); host.appendChild(wrap);
}

  optionRow(opts,'Difficulty', Object.values(DIFF).map(d=>({label:d.label,note:d.note})),
    Object.values(DIFF).findIndex(d=>d.key===diff.key), i=>{ diff = Object.values(DIFF)[i]; saveSave(); });
  optionRow(opts,'Game speed', SPEEDS.map(s=>({label:s.label,note:s.note})), speedIdx, i=>{ speedIdx=i; saveSave(); });

  $('go').onclick = ()=>startGame(pickedSector);
  $('help').onclick = screenHelp;
  $('settings').onclick = screenSettings;
}

/* --- settings: legibility, comfort, and performance are the player's to tune --- */
function screenSettings(){
  const toggles = [
    ['colorblind','Colorblind cue','Bolder outlines + white cores on enemy fire'],
    ['safeFlash','Reduce flashes','Softens full-screen flash & whiteout'],
    ['hitbox','Show hitbox','A faint dot marks your true hitbox'],
    ['focusSlow','Focus slows ship','Ease toward the cursor while focusing, for finer aim'],
    ['haptics','Haptics','Vibrate on hits and bombs (mobile)']
  ];
  elVeil.classList.remove('off');
  elVeil.innerHTML = `
    <div class="eyebrow">Comfort &amp; legibility</div>
    <h2>Settings</h2>
    <div id="sopts" style="width:100%;max-width:360px"></div>
    <div class="btnRow"><button class="btn" id="back">Back</button></div>`;
  const host = $('sopts');
  optionRow(host,'Screen shake', [{label:'Off',note:'0%'},{label:'Low',note:'50%'},{label:'Full',note:'100%'}],
    Settings.shake===0?0:Settings.shake<=.5?1:2, i=>{ Settings.shake=[0,.5,1][i]; saveSave(); });
  optionRow(host,'Flash', [{label:'Off',note:'0%'},{label:'Low',note:'50%'},{label:'Full',note:'100%'}],
    Settings.flash===0?0:Settings.flash<=.5?1:2, i=>{ Settings.flash=[0,.5,1][i]; saveSave(); });
  optionRow(host,'Quality', [{label:'Auto',note:'Adaptive'},{label:'High',note:'All effects'},{label:'Low',note:'Fastest'}],
    Settings.quality==='high'?1:Settings.quality==='low'?2:0,
    i=>{ Settings.quality=['auto','high','low'][i]; if(i>0){ qLevel=i===1?2:0; } setQualityPref(); saveSave(); });
  toggles.forEach(([key,label,note])=>{
    optionRow(host,label, [{label:'On'},{label:'Off',note:note}], Settings[key]?0:1,
      i=>{ Settings[key]=(i===0); saveSave(); });
  });
  $('back').onclick = screenTitle;
}

function screenHelp(){
  elVeil.innerHTML = `
    <div class="eyebrow">How to play</div>
    <h2>Flight manual</h2>
    <div class="helpList">
      <div class="grpLabel">Controls</div>
      <p><b>Fly.</b> <em>Touch</em> — drag anywhere; the ship tracks your finger 1:1 with a small offset so your thumb never hides it. <em>Desktop</em> — the ship follows your mouse at all times, no click needed. Your cannon always fires on its own.</p>
      <p><b>Actions.</b> <em>Touch</em> — the BOMB, FORM and FOCUS pads along the bottom. <em>Desktop</em> — left-click bombs, hold right-click to focus, <b>C</b> cycles drone formation, <b>Esc/P</b> pauses; you can also fly with WASD/arrows, focus with Shift/X, bomb with Space/Z. <em>Gamepad</em> — stick or d-pad to fly, A/R bomb, X/L focus, Y formation, Start pause.</p>

      <div class="grpLabel" style="margin-top:18px">The core loop</div>
      <p><b>Your hitbox is tiny.</b> Only a dot at the ship's centre is vulnerable — far smaller than the sprite. A faint marker shows it (toggle in Settings). The whole game is about threading gaps that look impossible.</p>
      <p><b>Read the colour.</b> Every sector recolours, but the rule never changes: <em>your fire is always cool cyan-white; enemy fire is always hot magenta-to-orange.</em> If it's warm and glowing, it can hurt you.</p>
      <p><b>Chain &amp; cores.</b> Every kill spills crystals. Gather eight in a row before the chain timer lapses and your multiplier steps up, to ×8; let it lapse and it drops to ×1. <b>Cores</b> is your running crystal count for the run.</p>

      <div class="grpLabel" style="margin-top:18px">Aggression — risk pays</div>
      <p><b>Graze.</b> Skim enemy fire without being hit. A cool aura lights around you, your multiplier can climb past ×8 all the way to <em>×16</em>, and sustained grazing <em>morphs your cannon</em> wider and heavier for a moment. The closer you fly, the harder and faster you hit.</p>
      <p><b>Break.</b> Grazing and close-range kills fill the BREAK meter (top-right). When it tops out the ship boils over for a few seconds — fire rate and damage surge and every kill spills extra crystals. Taking a hit empties it: Break rewards staying dangerous.</p>
      <p><b>Focus.</b> Hold Focus to tighten your fire into a concentrated single-target stream and reveal your exact hitbox. Grazing still buffs damage, but Focus keeps the shot narrow instead of widening it — wide clear vs. focused melt. Optionally it also slows the ship for pixel aim (Settings).</p>

      <div class="grpLabel" style="margin-top:18px">Tools</div>
      <p><b>Bomb.</b> A shockwave expands from the ship: it sweeps every enemy bullet it passes — turning half into crystals — damages every enemy, boss part and ground target, and leaves you invulnerable ~2s. Save it for when you're cornered or a boss is about to flip phase. Bombs are limited; you find more and earn one each sector cleared.</p>
      <p><b>Shield.</b> A SHIELD pickup (and some relics) orbits your ship and soaks one hit before your lives are touched.</p>
      <p><b>Upgrades.</b> Lettered pickups stack and persist across sectors: <b>PWR</b> damage, <b>SPR</b> extra shots, <b>RPD</b> fire rate, <b>HOM</b> homing missiles, <b>PRC</b> pierce, <b>DRN</b> drones.</p>
      <p><b>Drone formations.</b> With drones out, cycle <em>FWD</em> (tight forward arrow), <em>SIDE</em> (flank guard, wide coverage) and <em>TRACK</em> (orbit and fire at the nearest threat) — FORM pad, C, or gamepad Y.</p>
      <p><b>Wreck recovery.</b> Losing a life sheds just one upgrade — and it drops as a glowing <em>wreck</em>. You're briefly invulnerable on respawn: fly back over it to reclaim the level.</p>
      <p><b>Relics.</b> From sector seven on you're offered a permanent relic between sectors and your weapon caps come off — bigger builds than the early game allows.</p>

      <div class="grpLabel" style="margin-top:18px">The ground below</div>
      <p><b>A second plane.</b> Some sectors have targets on the ground beneath the fight. <em>Bunkers</em> fire hot bullets up at you; <em>pylons</em> project a dome that shields the air enemies inside it until you destroy it.</p>
      <p><b>The reticle.</b> Your air cannon can't reach the ground — a cool <em>reticle</em> ahead of the ship auto-strikes it instead. Aim it by moving the ship (more PWR = harder strikes). You're juggling air dodging and ground lining-up at once.</p>
      <p><b>Point of collection.</b> Fly into the top quarter of the screen and every item on screen vacuums to you at once — dangerous ground to hold, but it sweeps the field.</p>

      <div class="grpLabel" style="margin-top:18px">Enemies, bosses &amp; the beat</div>
      <p><b>Pacing.</b> Waves mix slow zone-control patterns with fast, targeted sniper shots — read the room and keep streaming sideways.</p>
      <p><b>Modular bosses.</b> Blow off a module (<em>MODULE DOWN</em>) to strip the attack it fed; clear them all and the core is exposed. Phase changes snap to the music's downbeat, and later phases fire a fast sniper on the beat — watch the rhythm.</p>
      <p><b>Telegraphs.</b> Dashed lines are charging lances; columns and standing waves warn before they fire. If a pattern leaves a gap, it stays open — find it.</p>

      <div class="grpLabel" style="margin-top:18px">Difficulty &amp; flow</div>
      <p><b>Baseline.</b> Three difficulties — <em>Drift</em> (forgiving), <em>Arcade</em> (as tuned), <em>Void</em> (unkind) — plus a speed slider.</p>
      <p><b>Dynamic rank.</b> A hidden engine watches how you're flying: survive cleanly and aggressively and enemy fire quietly speeds up; take a hit and it eases off. On Void — or once you're flying well — patterns thicken into overlapping curtains rather than turning enemies into sponges. If a gap exists, there is always a way through.</p>

      <div class="grpLabel" style="margin-top:18px">Your run</div>
      <p><b>Twelve sectors,</b> each with its own palette, roster, hazard, mid-boss and warden. A checkpoint sits right after each mid-boss — run out of lives past it and you can resume there.</p>
      <p><b>Daily Drift &amp; saves.</b> The Daily is one shared seed for the day — the same run for everyone, good for score-chasing. Your best scores and all settings are saved automatically.</p>
      <p><b>Comfort.</b> Settings tune screen-shake, flash and a photosensitivity-safe mode, a colorblind cue, the hitbox marker, haptics, Focus-slow and quality. Adjust freely — none of it changes the rules.</p>
    </div>
    <div class="btnRow"><button class="btn" id="back">Back</button></div>`;
  $('back').onclick = screenTitle;
}

function startGame(sector){
  Sound.init(); Sound.resume(); Sound.targetIntensity=.3;
  dailyRun = (gameMode==='daily');
  if (dailyRun) sector = 0;                      /* the daily is always a clean sector-one run */
  seedRun(dailyRun ? dailySeed() : (_origRandom()*4294967296)>>>0);
  Best.launches = (Best.launches||0)+1; saveSave();
  resetRun(sector);
  acc = 0;
  elVeil.classList.add('off');
  elHud.classList.add('on'); elPads.classList.add('on'); elPause.classList.add('on');
  state='playing'; last=performance.now();
  teach('controls','<b>Drag anywhere</b> to fly · your cannon fires itself · hold <b>FOCUS</b> for the tiny hitbox, and graze fire to climb past ×8');
  setTimeout(()=>{ if (state==='playing') teach('bomb','Tap <b>BOMB</b> when you are cornered — it sends out a shockwave that clears enemy fire and hurts everything it touches.'); }, 9000);
}

function gameOver(){
  state='dead';
  elPads.classList.remove('on'); elPause.classList.remove('on');
  Sound.targetIntensity=.1; showBoss(false);
  const isHi = score > Best.hi;
  recordRun(score, levelIdx+1);
  const seedTxt = (dailyRun?'Daily · ':'Seed ') + lastSeed.toString(36);
  elVeil.classList.remove('off');
  elVeil.innerHTML = `
    <div class="eyebrow">Hull lost · sector ${levelIdx+1}${isHi?' · new best':''}</div>
    <h2>The drift takes you</h2>
    <div class="tally">
      <div><span>Score</span><b>${score.toLocaleString()}</b></div>
      <div><span>Best</span><b>${Best.hi.toLocaleString()}</b></div>
      <div><span>Cores</span><b>${cores}</b></div>
      <div><span>Graze</span><b>${graze}</b></div>
    </div>
    <div class="hint">${seedTxt}</div>
    <div class="btnRow">
      ${checkpoint?'<button class="btn" id="resume">Resume at checkpoint</button>':''}
      <button class="btn ${checkpoint?'ghost':''}" id="again">Restart sector ${levelIdx+1}</button>
      <button class="btn ghost" id="menu">Sector select</button>
    </div>`;
  if (checkpoint) $('resume').onclick = ()=>{
    elVeil.classList.add('off'); elPads.classList.add('on'); elPause.classList.add('on');
    loadCheckpoint(); state='playing'; last=performance.now(); Sound.targetIntensity=.4;
  };
  $('again').onclick = ()=>startGame(levelIdx);
  $('menu').onclick = screenTitle;
}

function levelClear(){
  state='clear';
  elPads.classList.remove('on'); elPause.classList.remove('on');
  Sound.targetIntensity=.25;
  recordRun(score, Math.min(LEVELS.length, levelIdx+2));
  const t = Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
  const last6 = levelIdx>=LEVELS.length-1;
  elVeil.classList.remove('off');
  if (last6){
    elVeil.innerHTML = `
      <div class="eyebrow">The centre is quiet</div>
      <h2>All six sectors flown</h2>
      <div class="tally">
        <div><span>Final score</span><b>${score.toLocaleString()}</b></div>
        <div><span>Cores</span><b>${cores}</b></div>
        <div><span>Last sector</span><b>${t}</b></div>
      </div>
      <p class="lede">The Quiet Star is out. Whatever it was holding together out here, it isn't holding it any more.</p>
      <div class="btnRow"><button class="btn" id="menu">Fly again</button></div>`;
    $('menu').onclick = screenTitle;
    return;
  }
  P.bombs = Math.min(5,P.bombs+1);
  P.shield = Math.min(P.shieldMax,P.shield+1);
  const next = LEVELS[levelIdx+1];
  elVeil.innerHTML = `
    <div class="eyebrow">Sector ${levelIdx+1} cleared</div>
    <h2>${LEVELS[levelIdx].name} is quiet</h2>
    <div class="tally">
      <div><span>Score</span><b>${score.toLocaleString()}</b></div>
      <div><span>Cores</span><b>${cores}</b></div>
      <div><span>Time</span><b>${t}</b></div>
    </div>
    <p class="lede">Repairs: <b style="color:var(--jade)">+1 bomb, +1 shield</b>. Your upgrades carry forward.<br><br>
      Ahead — <b style="color:var(--ink)">${next.name}</b>. ${next.sub.split('· ')[1]}.</p>
    <div class="btnRow">
      <button class="btn" id="go">Enter sector ${levelIdx+2}</button>
      <button class="btn ghost" id="menu">Sector select</button>
    </div>`;
  const proceed = ()=>{
    elVeil.classList.add('off'); elPads.classList.add('on'); elPause.classList.add('on');
    startLevelAt(levelIdx+1); state='playing'; last=performance.now(); Sound.targetIntensity=.3;
  };
  $('go').onclick = ()=>{ if (levelIdx+1>=6){ ascend(); offerRelic(proceed); } else proceed(); };
  $('menu').onclick = screenTitle;
}

function togglePause(){
  if (state==='playing'){
    state='paused';
    elVeil.classList.remove('off');
    elVeil.innerHTML = `
      <div class="eyebrow">Holding position</div>
      <h2>Paused</h2>
      <div id="popts" style="width:100%;max-width:360px"></div>
      <div class="btnRow">
        <button class="btn" id="resume">Resume</button>
        <button class="btn ghost" id="quit">Abandon sector</button>
      </div>`;
    optionRow($('popts'),'Game speed', SPEEDS.map(s=>({label:s.label,note:s.note})), speedIdx, i=>{ speedIdx=i; });
    $('resume').onclick = togglePause;
    $('quit').onclick = screenTitle;
  } else if (state==='paused'){
    elVeil.classList.add('off'); state='playing'; last=performance.now();
  }
}

/* ============================================================
   15 · input
   ============================================================ */
let dragId = null;
/* focus can be held from touch, keyboard, mouse, or a gamepad at once — combine them */
let focusTouch=false, focusKey=false, focusPad=false, focusMouse=false;
function updateFocus(){ P.focus = focusTouch || focusKey || focusPad || focusMouse; }
function pointFrom(ev){ const r=cv.getBoundingClientRect(); return { x:ev.clientX-r.left, y:ev.clientY-r.top }; }
cv.addEventListener('pointerdown', ev=>{
  if (state!=='playing') return;
  Sound.resume();
  /* desktop: left button = bomb, right button = hold-to-focus. Movement is hover-only. */
  if (ev.pointerType==='mouse'){
    ev.preventDefault();
    if (ev.button===2){ focusMouse=true; updateFocus(); }
    else if (ev.button===0){ useBomb(); }
    return;
  }
  ev.preventDefault();
  if (dragId===null){
    dragId = ev.pointerId;
    const p = pointFrom(ev);
    P.grabX = P.x-p.x; P.grabY = P.y-p.y;
    if (dist2(p.x,p.y,P.x,P.y) > 90*90){ P.grabX=0; P.grabY=-34; }
    P.tx = p.x+P.grabX; P.ty = p.y+P.grabY;
    cv.setPointerCapture(ev.pointerId);
  }
}, { passive:false });
cv.addEventListener('pointermove', ev=>{
  if (ev.pointerId!==dragId || state!=='playing') return;
  ev.preventDefault();
  const p = pointFrom(ev);
  P.tx = p.x+P.grabX; P.ty = p.y+P.grabY;
}, { passive:false });
const endDrag = ev=>{ if (ev.pointerId===dragId) dragId=null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* desktop: the ship tracks the mouse at all times — no need to hold a button */
if (DESKTOP){
  window.addEventListener('pointermove', ev=>{
    if (state!=='playing' || ev.pointerType==='touch') return;
    const r = cv.getBoundingClientRect();
    P.tx = clamp(ev.clientX - r.left, 14, W-14);
    P.ty = clamp(ev.clientY - r.top, 40, H-30);
  }, { passive:true });
  /* release right-button focus wherever the mouse is when it comes up */
  window.addEventListener('pointerup', ev=>{
    if (ev.pointerType==='mouse' && ev.button===2 && focusMouse){ focusMouse=false; updateFocus(); }
  });
  window.addEventListener('blur', ()=>{ if (focusMouse){ focusMouse=false; updateFocus(); } });
  /* right-click is focus during play, so don't pop the browser menu then */
  window.addEventListener('contextmenu', e=>{ if (state==='playing') e.preventDefault(); });
}

function bindPad(el,onDown,onUp){
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('hot');
    Sound.resume(); if (onDown) onDown(); }, {passive:false});
  const up = e=>{ e.preventDefault(); el.classList.remove('hot'); if (onUp) onUp(); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('pointerleave',up);
}
bindPad(elPadBomb, useBomb);
bindPad(elPadForm, cycleForm);
bindPad(elPadFocus, ()=>{ focusTouch=true; updateFocus(); }, ()=>{ focusTouch=false; updateFocus(); });

elSound.addEventListener('click', ()=>{
  Sound.init(); Sound.setMuted(!Sound.muted); Sound.resume();
  elSound.textContent = Sound.muted?'♪̸':'♪';
  elSound.style.color = Sound.muted?'rgba(124,154,151,.4)':'';
  saveSave();
});
elPause.addEventListener('click', togglePause);

const keys = {};
addEventListener('keydown', e=>{
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key===' ' || e.key.toLowerCase()==='z') useBomb();
  if (e.key.toLowerCase()==='c' && !e.repeat) cycleForm();
  if (e.key==='Escape'||e.key==='p') togglePause();
  if (e.key==='Shift' || e.key.toLowerCase()==='x'){ focusKey = true; updateFocus(); }
  Sound.resume();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false;
  if (e.key==='Shift' || e.key.toLowerCase()==='x'){ focusKey=false; updateFocus(); } });
/* --- gamepad: left stick / d-pad to fly, face + shoulder buttons for the rest --- */
const padPrev = {};
function pollGamepad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null; for (const p of pads){ if (p){ gp = p; break; } }
  if (!gp){ if (focusPad){ focusPad=false; updateFocus(); } return; }
  const b = gp.buttons, ax = gp.axes;
  const down = n => !!(b[n] && b[n].pressed);
  const edge = n => { const p = down(n), was = padPrev[n]; padPrev[n] = p; return p && !was; };
  const fp = down(4) || down(6) || down(2);          /* L1 / L2 / X → focus */
  if (fp !== focusPad){ focusPad = fp; updateFocus(); }
  if (edge(0) || edge(5) || edge(7)) useBomb();       /* A / R1 / R2 → bomb */
  if (edge(3)) cycleForm();                            /* Y → cycle drone formation */
  if (edge(9)) togglePause();                          /* Start → pause */
  Sound.resume();
  if (state==='playing'){
    const sp = (fp?3.4:8.4)*SPEEDS[speedIdx].v;
    let dx=0, dy=0;
    const lx=ax[0]||0, ly=ax[1]||0;
    if (Math.abs(lx)>.22) dx=lx; if (Math.abs(ly)>.22) dy=ly;
    if (down(14)) dx=-1; if (down(15)) dx=1; if (down(12)) dy=-1; if (down(13)) dy=1;
    if (dx||dy){ P.tx=clamp(P.tx+dx*sp*3.2,14,W-14); P.ty=clamp(P.ty+dy*sp*3.2,40,H-30); }
  }
}
setInterval(()=>{
  pollGamepad();
  if (state!=='playing') return;
  const sp = (P.focus?3.4:8.4)*SPEEDS[speedIdx].v;
  let dx=0, dy=0;
  if (keys['arrowleft']||keys['a']) dx--;
  if (keys['arrowright']||keys['d']) dx++;
  if (keys['arrowup']||keys['w']) dy--;
  if (keys['arrowdown']||keys['s']) dy++;
  if (dx||dy){ P.tx=clamp(P.tx+dx*sp,14,W-14); P.ty=clamp(P.ty+dy*sp,40,H-30); }
},16);

document.addEventListener('visibilitychange', ()=>{ if (document.hidden && state==='playing') togglePause(); });

/* ============================================================
   16 · boot
   ============================================================ */
const _pref = loadSave();
if (_pref){
  if (_pref.diff && DIFF[_pref.diff]) diff = DIFF[_pref.diff];
  if (typeof _pref.speed==='number' && SPEEDS[_pref.speed]) speedIdx = _pref.speed;
  if (_pref.muted) Sound.setMuted(true);
}
resize();
setQualityPref();
spawnDebris();
if (Sound.muted){ elSound.textContent='♪̸'; elSound.style.color='rgba(124,154,151,.4)'; }
if (DESKTOP){ const fl=$('focusLbl'); if (fl) fl.textContent='R-CLICK'; }
screenTitle();
refreshHUD(true);
requestAnimationFrame(frame);

/* --- PWA: it's a single self-contained page, so it installs & runs offline --- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} });
}

})();
</script>
