  for (const s of shocks){
    const f = clamp(1 - s.r/s.max, 0, 1);
    ctx.strokeStyle = rgba(PAL.bolt, .55*f + .15);
    ctx.lineWidth = 3 + 16*f;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.stroke();
    ctx.strokeStyle = rgba(PAL.crystal, .5*f);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*.86,0,TAU); ctx.stroke();
    ctx.fillStyle = rgba(PAL.hull, .05*f);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   7 · enemies — a distinct roster per sector
   ============================================================ */
const TYPES = {
  /* sector 1 */
  drifter:{ hp:3,  r:15, score:100, speed:105, home:0, draw:dwDrifter },
  weaver: { hp:4,  r:15, score:150, speed:80,  home:0, draw:dwWeaver  },
  lancer: { hp:3,  r:13, score:180, speed:70,  home:0, draw:dwLancer  },
  turret: { hp:9,  r:20, score:260, speed:60,  home:0, draw:dwTurret  },
  sentry: { hp:16, r:23, score:420, speed:44,  home:0, draw:dwSentry  },
  /* sector 2 — the boneyard runs on salvage */
  hauler: { hp:26, r:30, score:600, speed:34,  home:1, prio:true, shieldR:130, draw:dwHauler  },
  scavver:{ hp:5,  r:14, score:220, speed:0,   home:1, draw:dwScavver },
  /* sector 3 — everything here divides or burns */
  cinder: { hp:6,  r:18, score:240, speed:70,  home:2, draw:dwCinder  },
  ember:  { hp:2,  r:10, score:90,  speed:120, home:2, draw:dwEmber   },
  /* sector 4 — geometry that refuses to be hit honestly */
  blinker:{ hp:6,  r:15, score:280, speed:0,   home:3, draw:dwBlinker },
  prism:  { hp:12, r:20, score:380, speed:52,  home:3, reflect:true, draw:dwPrism   },
  /* sector 5 — things that move together, and things that wait */
  shoal:  { hp:1,  r:9,  score:60,  speed:0,   home:4, draw:dwShoal   },
  angler: { hp:14, r:22, score:520, speed:40,  home:4, draw:dwAngler  }
};

function spawnEnemy(type,x,y,opts){
  const t = TYPES[type];
  const hp = t.hp*diff.hp*eliteScale(t.hp);
  const e = Object.assign({
    type, x, y, r:t.r, hp, maxhp:hp, t:0, fireT:rnd(.6,1.6), salvo:null, alive:true,
    tell:0, tellMax:0, tellKind:0, tellA:0, tellN:0, prio:!!t.prio,
    /* capabilities are gated once, here — a type only gains them a sector after its debut */
    shieldR:(t.shieldR && tierOf(type)>=1) ? t.shieldR : 0,
    reflect:!!t.reflect && tierOf(type)>=1,
    locked:false, refT:0, woke:false,
    vx:0, vy:t.speed, ang:0, flash:0, phase:rnd(0,TAU), drop:null, state:'in', holdY:H*.2
  }, opts||{});
  if (e.shieldR>0) shieldCount++;
  enemies.push(e);
  return e;
}

/* Cadence (#21): every shooter in the game fired one shot on a flat 1.4–3.6s timer. A salvo
   is a burst of n with an optional ramp — `ramp<1` accelerates into a crescendo, `>1` trails
   off — which is the cheapest way to make two enemies with the same payload feel different. */
function salvo(e,n,gap,fn,ramp){ e.salvo = { n, i:0, t:0, gap, fn, ramp:ramp||1 }; }
function nearP(e,r){ return dist2(e.x,e.y,P.x,P.y) < r*r; }

/* ---- enemy tells (#21) -------------------------------------------------------
   Deliberately NOT routed through `warns`. A warn means "a scheduled shot whose payload is a
   deferred fn", which is right for bosses because nothing else owns the shot. A common enemy
   already owns its own clock, so putting its tell in `warns` would duplicate that state — and
   every cap/eviction policy then becomes a way for the copy to disagree with the original.
   A payload-free tell that lives on the enemy has nothing to evict and cancels for free.

   tellKind is a small int, not a string: this is read per enemy per frame. */
/* ---- sector ramp (#21) -------------------------------------------------------
   Sophistication is measured from each type's OWN debut, not from the absolute sector. A raw
   `levelIdx < 2` test would hand `wisp` its full moveset on sector 7 — the very sector meant to
   teach it — while `drifter` gets eased in on sector 1. Relative is the only version that works.

   Strictly orthogonal to the other difficulty engines, and it must stay that way:
     tierOf  → WHICH pattern, how long the tell is, whether a second behaviour exists
     geoTier → density (curtain layers)
     rank/gear/RATE → cadence
     diff/BV → speed and hit points
   Tier must never multiply bullet count on top of geoTier; that is what keeps sector 12 on
   Void at high rank from becoming a particle bomb. */
const TIER = {};
function computeTiers(){
  for (const k in TYPES){ const d = levelIdx - (TYPES[k].home||0);
    TIER[k] = d<=0 ? 0 : d<=2 ? 1 : 2; }
}
function tierOf(t){ return TIER[t]||0; }          /* unknown → 0, the safe failure mode */
function tellDur(T){ return T===0 ? .60 : T===1 ? .48 : .40; }

const TK = { none:0, ring:1, fan:2, line:3, point:4, arc:5, crack:6 };
function tell(e,kind,dur,a,n){ e.tellKind=kind; e.tellMax=dur; e.tell=dur; e.tellA=a||0; e.tellN=n||0; }

function updateEnemy(e,dt){
  e.t += dt; e.flash = Math.max(0,e.flash-dt*5);
  /* raw dt, never dt*RATE: rank and gear shorten the gap between shots, never the warning.
     Sits in the prologue so scavver and shoal — which return early — are covered too. */
  if (e.tell>0){ e.tell -= dt; if (e.tell<0) e.tell = 0; }
  if (e.salvo){
    const s = e.salvo;
    s.t -= dt*RATE;
    if (s.t<=0){
      s.fn(e, s.i); s.i++;
      s.t = s.gap; s.gap *= s.ramp;
      if (s.i >= s.n) e.salvo = null;
    }
  }
  switch (e.type){
    case 'wisp':
      e.y += e.vy*dt*.7; e.x += Math.sin(e.t*.9+e.phase)*90*dt;
      { const Tz = tierOf('wisp');
        if (e.tell<=0 && e.tellKind===TK.point){
          e.tellKind = TK.none;
          fireAt(e.x,e.y,P.x,P.y,105*BV,{hom:Tz===0?.6:.8,r:7});
          if (Tz>=2) fireAt(e.x,e.y,P.x,P.y,118*BV,{hom:.5,curve:.9,r:7});   /* pincer partner */
        }
        e.fireT -= dt*RATE;
        if (e.fireT<=0 && e.y>0){ e.fireT=rnd(2.2,3.2); tell(e,TK.point,tellDur(Tz)); } }
      break;

    case 'polyp':
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.4+e.phase)*30*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(2.4,3.4);
        /* above the cap it simply holds — swapping to a ring taught the wrong lesson about
           what a spawner is */
        if (enemies.length < 26){ const m=spawnEnemy('mote', e.x, e.y+18, {}); m.vy=rnd(120,180); }
      }
      break;

    /* the metronome — every chorister on screen fires on the same downbeat, so five of them
       read as one pattern instead of five overlapping curtains. One gapped ring, not two solid
       ones: the old pair was 72 bullets a volley at full density. */
    case 'chorister': {
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.7+e.phase)*52*dt;
      const Tc = tierOf('chorister');
      if (e.tell>0) break;
      if (e.tellKind===TK.ring){                       /* tell has run out — sing */
        e.tellKind = TK.none;
        gapRing(e.x,e.y, 8+Tc*2, 130*BV, e.tellA, e.tellA+Math.PI, .55-Tc*.11);
        e.beatT = 2;
      }
      e.beatT = (e.beatT===undefined?1:e.beatT) - dt;
      if (beatTick && beatCount%4===0 && e.beatT<=0 && e.y>0)
        tell(e, TK.ring, tellDur(Tc), rnd(0,TAU));
      break; }

    case 'warp':
      /* e.bt was never initialised anywhere, so `undefined - dt` was NaN and `NaN <= 0` is
         false — warps have never blinked or fired since they were written, across sectors 10
         and 12 where warp is the signature enemy. Lazy-init, as blinker already does. */
      e.bt = (e.bt===undefined ? rnd(1.0,1.8) : e.bt) - dt;
      if (e.bt<=0){
        e.bt = 1.4;
        burst(e.x,e.y,8,PAL.foe,140);
        /* it reappears on your flank, not on top of you */
        e.x = clamp(P.x + (Math.random()<.5?-1:1)*rnd(W*.18,W*.34), 30, W-30);
        e.y = clamp(rnd(H*.08,H*.44), 40, H*.52);
        /* blinker scatters from anywhere; warp lays a rail down your flank */
        tell(e, TK.line, tellDur(tierOf('warp')), Math.atan2(P.y-e.y, P.x-e.x));
      }
      if (e.tell<=0 && e.tellKind===TK.line){
        e.tellKind = TK.none;
        const Tr = tierOf('warp');
        fireAng(e.x,e.y,e.tellA,290*BV,Tr>=1?{r:5,acc:1.2}:{r:5});
        if (Tr>=2) salvo(e,1,.22,(en)=>fireAng(en.x,en.y,en.tellA,290*BV,{r:5,acc:1.2}));
      }
      break;

    /* the only enemy with no telegraph, because its body already is one: dwPulsar swells on
       exactly the sin() that fires it. Slow and wide — you walk out of this, you don't thread it. */
    case 'pulsar': {
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.5+e.phase)*40*dt;
      const Tp = tierOf('pulsar');
      const beat = Math.sin(e.t*2.2);
      if (beat > .985 && e.y>0 && (e.beatT||0)<=0){
        e.beatT = .5;
        const off = rnd(0,TAU);
        ring(e.x,e.y,10,118*BV,off);
        if (Tp>=2) ring(e.x,e.y,10,178*BV,off+Math.PI/10);   /* counter-shell, same beat */
      }
      e.beatT = (e.beatT||0) - dt;
      break;
    }

    case 'mote': {
      /* commits once, at spawn, and never corrects — the opposite of ember, which never
         commits. Dodge a mote once and it is beaten for good. */
      if (!e.locked){ const a0 = Math.atan2(P.y-e.y,P.x-e.x);
        e.vx = Math.cos(a0)*190; e.vy = Math.sin(a0)*190; e.locked = true; }
      e.x += e.vx*dt; e.y += e.vy*dt;
      if (fchance(dt*18)) parts.push({x:e.x,y:e.y,vx:0,vy:-20,life:.3,max:.3,r:2,c:PAL.foe,g:0});
      break;
    }

    /* terrain, not threat — past mid-screen it stops weaving and holds a lane, so a row of
       them becomes a wall you route around rather than a shape that drifts into you */
    case 'drifter':
      e.y += e.vy*dt;
      if (tierOf('drifter')===0 || e.y < H*.45) e.x += Math.sin(e.t*1.3+e.phase)*26*dt;
      break;

    case 'weaver':
      e.y += e.vy*dt*.8; e.x += Math.cos(e.t*2+e.phase)*130*dt;
      { const Tw = tierOf('weaver');
        if (e.tell<=0 && e.tellKind===TK.fan){
          e.tellKind = TK.none;
          if (Tw===0) fireAng(e.x,e.y,e.tellA,190*BV);
          else for (let i=-1;i<=1;i+=2) fireAng(e.x,e.y, e.tellA+i*.11, 190*BV, Tw>=2?{acc:.7}:null);
        }
        e.fireT -= dt*RATE;
        if (e.fireT<=0 && e.y>0){
          e.fireT = rnd(1.4,2.3);
          tell(e, TK.fan, tellDur(Tw), Math.atan2(P.y-e.y,P.x-e.x), .26);
        } }
      break;

    case 'lancer':
      if (e.state==='in'){ e.y += 130*dt;
        if (e.y>e.holdY){ e.state='aim'; e.aimT = tierOf('lancer')>=2 ? .5 : .7;
          /* the corridor is committed HERE, not at launch — that is what makes the tell honest */
          tell(e, TK.line, e.aimT, Math.atan2(P.y-e.y,P.x-e.x)); } }
      else if (e.state==='aim'){
        e.aimT -= dt; e.x += Math.sin(e.t*6)*30*dt;
        if (e.aimT<=0){ const a=e.tellA; e.tellKind=TK.none;
          e.vx=Math.cos(a)*430*BV; e.vy=Math.sin(a)*430*BV; e.state='dive'; }
      } else {
        e.x += e.vx*dt; e.y += e.vy*dt;
        if (fchance(dt*30)) parts.push({x:e.x,y:e.y,vx:frnd(-20,20),vy:frnd(-20,20),life:.3,max:.3,r:2.5,c:PAL.foe,g:0});
      }
      break;

    /* the hole where you stand — it skips the centre, so the safe lane is exactly where you
       were when the aim locked. Hold still through the tell, then don't move. */
    case 'turret': {
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.8+e.phase)*40*dt;
      const Tt = tierOf('turret');
      if (e.tell>0) break;
      if (e.tellKind===TK.fan){
        e.tellKind = TK.none;
        const a = e.tellA;                       /* locked at tell start, never re-aimed */
        if (Tt===0){ for (let i=-1;i<=1;i+=2) fireAng(e.x,e.y,a+i*.30,200*BV); }
        else for (const o of [-.34,-.17,.17,.34]) fireAng(e.x,e.y,a+o,200*BV);
      }
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(1.5,2.2);
        tell(e, TK.fan, tellDur(Tt), Math.atan2(P.y-e.y,P.x-e.x), .70);
      }
      break; }

    /* the marked exit — a ring with a gap aimed at you, shown at its true angle before it
       fires. The inverse of chorister's "run outward": here you run TO the mark.
       The angle is locked when the tell starts and never recomputed, or the tell is a lie. */
    case 'sentry': {
      if (e.y<e.holdY) e.y += e.vy*dt;
      e.ang += dt*1.1; e.x += Math.sin(e.t*.6+e.phase)*55*dt;
      const Ts = tierOf('sentry'), gapW = .60 - Ts*.10;
      if (e.tell>0) break;
      if (e.tellKind===TK.arc){
        e.tellKind = TK.none;
        gapRing(e.x,e.y, 8+Ts, 150*BV, e.tellA+.31, e.tellA, gapW);
        if (Ts>=2) salvo(e,1,.35,(en)=>gapRing(en.x,en.y,9,168*BV,en.tellA+1.1,en.tellA+2.1,gapW));
      }
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(2,2.8);
        tell(e, TK.arc, tellDur(Ts), Math.atan2(P.y-e.y, P.x-e.x), gapW*2);
      }
      break; }

    case 'hauler': {
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.5+e.phase)*46*dt;
      e.ang += dt*.4;
      e.fireT -= dt*RATE;
      /* the anchor: it shields what flies with it, so the answer is always "kill the hauler
         first". Its own fire is a slow unaimed drop — it is a wall, not a shooter. */
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(2.2,3.0);
        shotgun(e.x,e.y,e.x,e.y+200, 3, .34, 90, 150, { r:5, life:5 });
      }
      break; }

    case 'scavver': {
      /* comes in from a side, dashes across, snipes on the way */
      e.x += e.dir*260*dt*(1+Math.sin(e.t*3)*.35);
      e.y += Math.sin(e.t*2.6+e.phase)*70*dt;
      /* one decision per pass: it crosses once and throws a single spread, telegraphed.
         (Not a lance — lance() fires Sound.alarm() unconditionally and twenty of these would
         be a siren.) */
      { const Tv = tierOf('scavver');
        if (e.tell<=0 && e.tellKind===TK.fan){
          e.tellKind = TK.none;
          shotgun(e.x,e.y,P.x,P.y, Tv===0?3:4, .30, 180, 300, {r:5});
          if (Tv>=2 && !e.salvo) salvo(e,1,.5,(en)=>shotgun(en.x,en.y,P.x,P.y,3,.34,180,290,{r:5}));
        }
        e.fireT -= dt*RATE;
        if (e.fireT<=0 && e.x>40 && e.x<W-40){
          e.fireT = 99;                                    /* one pass, one decision */
          tell(e, TK.fan, tellDur(Tv), Math.atan2(P.y-e.y,P.x-e.x), .60);
        } }
      if ((e.dir>0 && e.x>W+50)||(e.dir<0 && e.x<-50)) return false;
      return true; }

    /* the thing that divides — no periodic ring any more, because the split is the point and
       a ring on top of it just made another sentry. Its tell is a STATE, not a timer: below
       40% hull it visibly cracks, i.e. "this one is about to become two". */
    case 'cinder':
      e.y += e.vy*dt; e.x += Math.sin(e.t*1.1+e.phase)*44*dt; e.ang += dt*1.6;
      if (e.hp <= e.maxhp*.4){ if (e.tellKind!==TK.crack) tell(e,TK.crack,99); e.tell = 1; }
      break;

    case 'ember': {
      /* drawn to you, slowly — a heat-seeking nuisance */
      const a = Math.atan2(P.y-e.y,P.x-e.x);
      const ke = 1-Math.pow(1-.02, dt*60);           /* was frame-rate dependent */
      e.vx = lerp(e.vx, Math.cos(a)*130*BV, ke);
      e.vy = lerp(e.vy, Math.sin(a)*130*BV, ke);
      e.x += e.vx*dt; e.y += e.vy*dt;
      if (fchance(dt*24)) parts.push({x:e.x,y:e.y,vx:frnd(-14,14),vy:frnd(-30,-8),life:.4,max:.4,r:2.2,c:PAL.foe,g:0});
      break; }

    case 'blinker':
      if (e.y<e.holdY){ e.y += 150*dt; break; }
      e.blinkT = (e.blinkT===undefined? rnd(.8,1.6) : e.blinkT) - dt;
      e.fade = clamp((e.blinkT<.25? e.blinkT/.25 : 1),0,1);
      if (e.tell<=0 && e.tellKind===TK.point){
        e.tellKind = TK.none;
        const Tb = tierOf('blinker'), a0 = Math.atan2(P.y-e.y, P.x-e.x);
        if (Tb===0) fireAng(e.x,e.y,a0,235*BV,{r:5});
        else for (let i=-1;i<=1;i+=2) fireAng(e.x,e.y, a0 + i*.13, 235*BV, {r:5});
        if (Tb>=2) fireAng(e.x,e.y,a0,235*BV,{r:5});
      }
      if (e.blinkT<=0){
        e.blinkT = rnd(1.3,2.0);
        e.x = rnd(W*.12,W*.88); e.y = rnd(H*.08,H*.42);
        spark(e.x,e.y,PAL.foe);
        tell(e, TK.point, tellDur(tierOf('blinker')));   /* it announces, then shoots */
      }
      break;

    case 'prism':
      if (e.y<e.holdY) e.y += e.vy*dt;
      e.x += Math.sin(e.t*.7+e.phase)*60*dt;
      /* the shield faces where it last looked — flank it */
      /* the shield sweeps on its own — wait for it to turn away, then shoot */
      e.sa = (e.sa===undefined? Math.atan2(P.y-e.y,P.x-e.x) : e.sa + dt*1.15);
      e.fireT -= dt*RATE;
      if (e.refT>0) e.refT -= dt;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(1.8,2.6);
        for (let i=-2;i<=2;i++) fireAng(e.x,e.y, e.sa + i*.16, 190*BV);
      }
      break;

    case 'shoal': {
      const g = e.grp;
      e.x = g.x + e.ox + Math.sin(e.t*3+e.phase)*7;
      e.y = g.y + e.oy + Math.cos(e.t*2.4+e.phase)*7;
      if (e.y>H+40) return false;
      return true; }

    case 'angler': {
      if (e.y<e.holdY) e.y += e.vy*dt;
      e.x += Math.sin(e.t*.4+e.phase)*40*dt;
      e.lure = .5 + Math.sin(e.t*(e.woke?7:2))*.5;   /* the lure races once it has seen you */
      const near = nearP(e,240);
      e.woke = e.woke || near;
      const Tg = tierOf('angler');
      if (near && !e.woke){                       /* waking was completely unannounced before */
        tell(e, TK.ring, tellDur(Tg)+.2);
        Sound.tick(6);
      }
      if (e.woke){
        if (e.tell<=0 && e.tellKind===TK.ring){
          e.tellKind = TK.none;
          const base = Math.atan2(P.y-e.y,P.x-e.x);
          if (Tg===0){ for (let i=-2;i<=2;i++) fireAng(e.x,e.y, base+i*.2, 175*BV, {r:7}); }
          else {
            /* three volleys, each narrower — walk out of the cone before it closes. Floored
               at .12 and capped at three so it can never seal you against a wall. */
            let k = 0;
            salvo(e, 3, .34, (en)=>{ const sp = [.28,.20,.12][k++] || .12;
              const b2 = Math.atan2(P.y-en.y,P.x-en.x);
              for (let i=-2;i<=2;i++) fireAng(en.x,en.y, b2+i*sp, 175*BV, {r:7}); });
          }
        }
        e.fireT -= dt*RATE;
        if (e.fireT<=0 && !e.salvo){ e.fireT = rnd(2.4,3.2); tell(e,TK.ring,tellDur(Tg)); }
      }
      break; }
  }
  e.x = clamp(e.x,18,W-18);
  if (e.y>H+80 || e.y<-300) return false;
  return true;
}

/* --- bullet emitters shared by enemies and bosses --- */
/* Bullet kinetics (#21): hom/curve/acc were authored at seven call sites and silently
   discarded for the life of the game — fireAng only ever read r/life/big. Every field is
   written unconditionally so the record stays monomorphic, and `k` lets the hot loop skip
   the whole kinetics branch for the ~95% of bullets that fly straight. */
function fireAng(x,y,a,sp,o){
  if (ebullets.length>720) swapDel(ebullets,0);
  const hom=(o&&o.hom)||0, curve=(o&&o.curve)||0, acc=(o&&o.acc)||0;
  ebullets.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:(o&&o.r)||6, life:(o&&o.life)||8,
                  t:0, big:(o&&o.big)||false, hom, curve, acc, refl:!!(o&&o.refl),
                  k:!!(hom||curve||acc) });
}
/* Homing always decays, so a bullet you've beaten stays beaten — the turn rate is capped and
   the tracking bleeds off within about a second. Curve composes with the global curveField
   rather than replacing it, so quietstar's phase-4 twist still applies on top. */
const HOM_TURN = 3.2;
function bulletKinetics(b,dt){
  if (b.hom && P.alive){
    const cur = Math.atan2(b.vy,b.vx), want = Math.atan2(P.y-b.y, P.x-b.x);
    let d = want-cur;
    while (d>Math.PI) d-=TAU;
    while (d<-Math.PI) d+=TAU;
    const step = clamp(d, -HOM_TURN*b.hom*dt, HOM_TURN*b.hom*dt);
    const a = cur+step, sp = Math.hypot(b.vx,b.vy);
    b.vx = Math.cos(a)*sp; b.vy = Math.sin(a)*sp;
    b.hom *= Math.pow(.3, dt);
    if (b.hom < .02) b.hom = 0;
  }
  const tw = b.curve + curveField;
  if (tw){
    const a = Math.atan2(b.vy,b.vx) + tw*dt, sp = Math.hypot(b.vx,b.vy);
    b.vx = Math.cos(a)*sp; b.vy = Math.sin(a)*sp;
  }
  if (b.acc){ const f = 1 + b.acc*dt; b.vx *= f; b.vy *= f; }
  if (!b.hom && !b.curve && !b.acc) b.k = false;
}
function fireAt(x,y,tx,ty,sp,o){ fireAng(x,y,Math.atan2(ty-y,tx-x),sp,o); }
/* #7: harder = denser geometry, not more HP. Void adds a tier; sustained high rank
   adds another; so does a heavy loadout — the curtain thickens to meet your guns
   instead of the boss growing hit points. Capped at the two layers the patterns
   are authored for. Layers are deterministic (fixed offsets), preserving any safe
   lane a pattern leaves. */
function geoTier(){
  return Math.min(2, (diff.key==='void'?1:0) + (rank>0.6?1:0) + (gear>0.45?1:0) + rageTier);
}
function ring(x,y,n,sp,off,o){
  const g = geoTier();
  for (let i=0;i<n;i++) fireAng(x,y,off+i/n*TAU,sp,o);
  if (g>=1) for (let i=0;i<n;i++) fireAng(x,y, off+(i+.5)/n*TAU, sp*1.28, o);   /* faster interleaved curtain */
  if (g>=2) for (let i=0;i<n;i++) fireAng(x,y, off+i/n*TAU, sp*.74, o);          /* slower trailing curtain */
}
function gapRing(x,y,n,sp,off,gapAt,gapW,o){
  const g = geoTier();
  const emit = (a,s)=>{ const d=Math.abs(((a-gapAt+Math.PI*3)%TAU)-Math.PI); if (d<gapW) return; fireAng(x,y,a,s,o); };
  for (let i=0;i<n;i++) emit(off+i/n*TAU, sp);
  if (g>=1) for (let i=0;i<n;i++) emit(off+(i+.5)/n*TAU, sp*1.28);   /* denser, but the gap stays open */
}
function shotgun(x,y,tx,ty,n,spread,sp1,sp2,o){
  const base = Math.atan2(ty-y,tx-x);
  const N = n + geoTier()*2;
  for (let i=0;i<N;i++) fireAng(x,y, base+rnd(-spread,spread), rnd(sp1,sp2), o);
}
function lance(x,y,a,warn,live,quiet){ lasers.push({ x,y,a, warn, live, w:0 });
  /* alarm() already marks boss spawn, phase flip and Break — a boss with several lances
     turns the one cue that should mean "something changed" into background noise */
  if (!quiet) Sound.alarm(); }
/* ---- telegraphs (#21) -------------------------------------------------------
   Until now `lance`'s warn was the only wind-up in the game, and it was laser-shaped:
   rings, walls and rain simply appeared. A tell is what turns a punishing pattern into a
   learnable one, so it gets a primitive of its own.
     · Ticks on raw dt, never dt*RATE — rank and gear speed up cadence, they never shorten
       the warning. That distinction is the whole difference between hard and unfair.
     · Drawn dashed and translucent, under live fire, never solid and never bullet-shaped,
       so a warning can't be misread as a projectile.
     · `cancel` voids the tell if its owner dies, so killing a shooter mid-wind-up stops
       the shot — the reward for engaging with the threat rather than dodging it. */
const WARN_MAX = 48;
function telegraph(kind,x,y,a,dur,o){
  if (warns.length >= WARN_MAX){
    /* Firing a scheduled shot early is a fairness bug; dropping a decorative outline is not.
       So evict a payload-free warn if one exists, and only fall back to evict-and-fire when
       every entry owns a shot. In practice that makes premature fire unreachable. */
    let idx = -1;
    for (let i=0;i<warns.length;i++) if (!warns[i].fn){ idx = i; break; }
    if (idx >= 0) swapDel(warns, idx);
    else { const w = warns.shift(); if (w.fn) w.fn(); }
  }
  warns.push({ kind, x, y, a, t:0, dur:dur||.5, r:(o&&o.r)||34, n:(o&&o.n)||0,
               fn:(o&&o.fn)||null, src:(o&&o.src)||null,
               follow:!!(o&&o.follow), cancel:!!(o&&o.cancel) });
}
function warnDead(w){
  const s = w.src;
  if (!s) return false;
  if (s === boss) return !boss || !!boss.dying;
  if (s.alive === false) return true;
  return s.hp !== undefined && s.hp <= 0;
}
function updateWarns(dt){
  for (let i=warns.length-1;i>=0;i--){
    const w = warns[i];
    if (w.cancel && warnDead(w)){ swapDel(warns,i); continue; }
    if (w.follow && w.src){ w.x = w.src.x; w.y = w.src.y; }
    w.t += dt;                                   /* deliberately not dt*RATE */
    if (w.t >= w.dur){ const fn = w.fn; swapDel(warns,i); if (fn) fn(); }
  }
}
/* Shortest distance from the ship to a line segment — the shared hitbox behind tethers,
   link cages, rotating bars and arena walls. Returns true if it connected. */
function hurtOnSegment(x0,y0,x1,y1,w){
  if (!P.alive || P.inv>0) return false;
  const dx=x1-x0, dy=y1-y0, L2=dx*dx+dy*dy||1;
  const t = clamp(((P.x-x0)*dx+(P.y-y0)*dy)/L2, 0, 1);
  const px=x0+dx*t, py=y0+dy*t, r=w+P.r;
  if (dist2(px,py,P.x,P.y) < r*r){ hurtPlayer(); return true; }
  return false;
}

/* Reflect (#21). This cannot live in damageEnemy — that function never sees the bullet, which
   is also why the old arc test used the PLAYER's bearing and so deflected shots that arrived
   from somewhere else entirely (a drone bolt from the flank). Impact bearing is the honest test.

   Legibility here is structural, not a recolour: the player bullet is deleted and a NEW enemy
   bullet is pushed the same frame, so from its first rendered frame it is drawn by
   drawEnemyBullets in the hot band. There is no path by which an enemy-owned projectile can
   render in a player colour, because the two arrays have separate draw functions.
   Consumes no RNG — the reflect angle IS the impact angle — so it adds nothing to the seeded
   stream. The cooldown and speed cap are not optional: without them a rapid+spread build parked
   on the shield converts its own DPS into incoming fire inside its own approach lane. */
function prismReflect(e,b){
  if (!e.reflect || e.refT>0) return false;
  const a = Math.atan2(b.y-e.y, b.x-e.x);
  if (Math.abs(((a-e.sa+Math.PI*3)%TAU)-Math.PI) >= .7) return false;
  const sp = Math.min(340, Math.hypot(b.vx,b.vy)*.85);
  fireAng(e.x+Math.cos(a)*e.r, e.y+Math.sin(a)*e.r, a, sp*BV, { r:6 });
  e.refT = .08; e.flash = .5; spark(b.x,b.y,PAL.elaser);
  return true;
}
function damageEnemy(e,dmg,silent){
  if (e.type==='prism' && !e.reflect && !silent){
    /* tier 0 nullifies; from tier 1 the arc reflects instead, handled at the hit site */
    const a = Math.atan2(P.y-e.y,P.x-e.x);
    let d = Math.abs(((a-e.sa+Math.PI*3)%TAU)-Math.PI);
    if (d < .7){ e.flash=.4; return false; }
  }
  if (!silent && enemyShielded(e)){                     /* a pylon or an escort anchor (#3) */
    dmg *= ground.length ? .2 : .35;
    if (rand()<.05) floatText(e.x,e.y-e.r,'SHIELDED',PAL.boss);
  }
  e.hp -= dmg; e.flash = 1;
  if (e.hp<=0){ killEnemy(e,silent); return true; }
  return false;
}
function killEnemy(e,silent){
  e.alive = false;
  if (e.shieldR>0) shieldCount--;                     /* so a tell owned by this enemy cancels rather than fires */
  const i = enemies.indexOf(e);
  if (i>=0) enemies.splice(i,1);
  const T = TYPES[e.type];
  burst(e.x,e.y, 22+T.r, PAL.foe, 200+T.r*4);
  if (!silent) Sound.boom(.55+T.r/60);
  addScore(T.score,e.x,e.y);
  if (e.type==='cinder'){                 /* splits — killing it isn't the end of it */
    for (let k=0;k<2;k++){
      const f = spawnEnemy('ember', e.x+(k?16:-16), e.y, {});
      f.vx = (k?1:-1)*90; f.vy = 40;
    }
  }
  /* Break (#9): a close kill charges the meter; while in Break, kills spill extra gold */
  if (P.alive && P.odT<=0 && dist2(e.x,e.y,P.x,P.y) < 150*150) P.od = Math.min(1,(P.od||0)+.05);
  let n = e.type==='shoal' ? 1 : rint(2,4);
  if (P.odT>0) n += 2;
  for (let k=0;k<n;k++) dropPickup(e.x+rnd(-14,14), e.y+rnd(-10,10), 'crystal');
  if (e.drop) dropPickup(e.x,e.y,e.drop);
  else if (Math.random() < (T.r>18?.16:.06)) dropPickup(e.x,e.y,rollMod());
  shake = Math.max(shake, 4+T.r*.14);
  /* the big ones land: a sliver of hitstop and a tap, never on trash (it feels mushy) */
  if (T.r>18 && !silent){ hitstop = Math.max(hitstop, .05); haptic(6); }
}
function rollMod(){ return pick(['power','power','spread','rapid','homing','pierce','drones','shield','bomb']); }

/* ============================================================
   7b · the ground plane (#3) — a second targetable layer below the air fight.
   Air fire can't touch it; only the ground-strike reticle (#4) can. Ground fire is
   still hot; the reticle and its impacts are player-cool. Legibility rule holds.
   ============================================================ */
const GROUND = {
  bunker: { hp:14, r:22, score:400 },
  pylon:  { hp:22, r:24, score:640, shieldR:150 }   /* shields air enemies within range */
};
const GSCROLL = 72, GS_AHEAD = 120;
let groundActive = false, groundReveal = 0, scrollGround = 0, groundHold = 0;   /* the visible ground surface */
const STEEL = [150,175,195], GRID = [110,150,175];
function spawnGround(type,x,opts){
  const t = GROUND[type];
  const g = Object.assign({ type, x:clamp(x,30,W-30), y:-50, r:t.r, hp:t.hp*diff.hp, maxhp:t.hp*diff.hp,
                            fireT:rnd(1.2,2.8), t:0, flash:0 }, opts||{});
  ground.push(g);
  groundActive = true; groundHold = 6;     /* a hold so the floor doesn't blink between ground waves */
  teach('ground','A <b>surface passes below</b> — those are ground targets. Your cool <b>strike reticle</b> auto-hits them; line it up by moving.');
  return g;
}
function groundLine(type,n){ for (let i=0;i<n;i++) spawnGround(type, W*(i+1)/(n+1) + rnd(-24,24)); }
function updateGround(dt){
  scrollGround += GSCROLL*dt;                     /* keep the grid locked to the installations */
  for (let i=ground.length-1;i>=0;i--){
    const g = ground[i]; g.t += dt; g.y += GSCROLL*dt; g.flash = Math.max(0,g.flash-dt*5);
    if (g.y > H+70){ swapDel(ground,i); continue; }
    if (g.type==='bunker' && g.y>16 && g.y<H-30){
      g.fireT -= dt*RATE;
      if (g.fireT<=0){ g.fireT = rnd(1.9,3.0); fireAt(g.x,g.y,P.x,P.y,175*BV,{r:6}); }
    }
  }
}
/* Generalised from ground-pylon-only: any enemy carrying a shieldR now protects what flies with
   it. `s !== e` matters — a shielder never shields itself, which is what keeps the answer "kill

   because you can actually reach the source. Guarded by shieldCount so the common case, with no
   hauler and no pylon alive, is a single integer test in a per-hit path. */
let shieldCount = 0;
function enemyShielded(e){
  if (!ground.length && !shieldCount) return false;
  for (const g of ground) if (g.type==='pylon' && dist2(g.x,g.y,e.x,e.y) < GROUND.pylon.shieldR*GROUND.pylon.shieldR) return true;
  if (shieldCount) for (const s of enemies)
    if (s!==e && s.shieldR>0 && s.hp>0 && dist2(s.x,s.y,e.x,e.y) < s.shieldR*s.shieldR) return true;

}
function damageGround(g,dmg){
  g.hp -= dmg; g.flash = 1;
  if (g.hp>0) return;
  const i = ground.indexOf(g); if (i>=0) swapDel(ground,i);
  const T = GROUND[g.type];
  burst(g.x,g.y,26,PAL.foe,240); Sound.boom(.8); shake = Math.max(shake,8);
  addScore(T.score,g.x,g.y);
  for (let k=0;k<rint(2,4);k++) dropPickup(g.x+rnd(-14,14),g.y,'crystal');
  if (rand()<.4) dropPickup(g.x,g.y,rollMod());

}
function groundStrike(x,y,dmg){
  let hit = false;
  for (let i=ground.length-1;i>=0;i--){ const g=ground[i];
    if (dist2(g.x,g.y,x,y) < (44+g.r)*(44+g.r)){ damageGround(g,dmg); hit = true; } }
  groundFx.push({ x, y, t:0, hit });
  for (let k=0;k<(hit?7:3);k++){ const a=frnd(0,TAU), s=frnd(40,150);
    pPart({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:frnd(.15,.35), r:frnd(1,2.4), c:PAL.bolt, g:0 }); }
}
/* --- the ground plane, drawn below the air combat --- */
/* a scrolling structural grid so the second layer reads as a real floor with the
   installations locked to it (matched to GSCROLL) — fades in when ground appears */
function drawGroundPlane(dt){
  /* was set true on the first spawn and only ever reset by resetRun, so the floor grid never
     faded back out for the rest of the run */
  if (groundHold>0) groundHold -= dt;
  groundActive = ground.length>0 || groundHold>0;
  groundReveal = lerp(groundReveal, groundActive?1:0, 1-Math.pow(1-.05, dt*60));
  if (groundReveal < .01) return;
  const a = groundReveal, cell = 72;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineWidth = 1;
  const oy = ((scrollGround % cell) + cell) % cell;
  for (let y=oy; y<=H; y+=cell){
    const depth = .3 + .7*(y/H);                  /* brighter toward the bottom = closer */
    ctx.strokeStyle = rgba(GRID, .06*a*depth);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  for (let x=cell/2; x<W; x+=cell){
    ctx.strokeStyle = rgba(GRID, .04*a);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  ctx.restore();
}
function drawGround(){
  for (const g of ground){
    if (g.type==='pylon'){                        /* the shielded zone — a faint hot dome */
      ctx.strokeStyle=rgba(PAL.boss,.2+Math.sin(g.t*3)*.06); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(g.x,g.y,GROUND.pylon.shieldR,0,TAU); ctx.stroke();
    }
    ctx.fillStyle=hullFill(.4);               /* shadow lifts it off the floor */
    ctx.beginPath(); ctx.ellipse(g.x, g.y+g.r*.6, g.r*1.15, g.r*.5, 0,0,TAU); ctx.fill();
    ctx.save(); ctx.translate(g.x,g.y);
    if (g.type==='bunker') dwBunker(g); else dwPylon(g);
    ctx.restore();
    drawGroundBracket(g);                          /* a steel bracket marks it as a ground target */
  }
}
function drawGroundBracket(g){
  const s = g.r+13, o = 8;
  ctx.strokeStyle=rgba(STEEL,.4); ctx.lineWidth=1.4;
  for (const c of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    ctx.beginPath();
    ctx.moveTo(g.x+c[0]*s, g.y+c[1]*s - c[1]*o); ctx.lineTo(g.x+c[0]*s, g.y+c[1]*s); ctx.lineTo(g.x+c[0]*s - c[0]*o, g.y+c[1]*s);
    ctx.stroke();
  }
}
function dwBunker(g){                              /* a squat steel gun emplacement */
  ctx.save(); ctx.scale(1,.62);                   /* squashed base → lying on the ground */
  ctx.beginPath();
  for (let i=0;i<8;i++){ const a=i/8*TAU+Math.PI/8, x=Math.cos(a)*(g.r+3), y=Math.sin(a)*(g.r+3); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }

  ctx.strokeStyle=rgba(STEEL,.6); ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(0,-2,g.r*.55,0,TAU);   /* turret dome */
  ctx.fillStyle=g.flash>0?flashFill(.75):hullFill(.98); ctx.fill();
  ctx.strokeStyle=rgba(STEEL,.85); ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=rgba(PAL.ebullet,.9); ctx.fillRect(-3,-g.r*1.15,6,g.r*.8);   /* hot barrel, up */
  ctx.beginPath(); ctx.arc(0,-2,5+Math.sin(g.t*4)*1.5,0,TAU); ctx.fillStyle=rgba(PAL.ebullet,.95); ctx.fill();
  ctx.strokeStyle=rgba(PAL.foe,.5); ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(0,0,g.r+7,-Math.PI/2,-Math.PI/2+TAU*(g.hp/g.maxhp)); ctx.stroke();
  addGlow(g.x,g.y,g.r*1.5,PAL.ebullet,.28+g.flash*.4); addGlow(g.x,g.y,g.r*1.2,STEEL,.14);

function dwPylon(g){                              /* a tripod shield generator */
  ctx.save(); ctx.scale(1,.62);
  shellPath(3,g.r+3); ctx.fillStyle=hullFill(.96); ctx.fill();
  ctx.strokeStyle=rgba(STEEL,.5); ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
  ctx.strokeStyle=rgba(STEEL,.75); ctx.lineWidth=3;
  for (let i=0;i<3;i++){ const a=i/3*TAU+g.t*.3; ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(Math.cos(a)*g.r, Math.sin(a)*g.r*.6+2); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0,-6,8+Math.sin(g.t*4)*2,0,TAU);
  ctx.fillStyle=g.flash>0?flashFill(.75):rgba(PAL.crystal,.92); ctx.fill();
  ctx.strokeStyle=rgba(PAL.boss,.8); ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle=rgba(PAL.foe,.5); ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(0,0,g.r+7,-Math.PI/2,-Math.PI/2+TAU*(g.hp/g.maxhp)); ctx.stroke();
  addGlow(g.x,g.y,g.r*1.6,PAL.boss,.3+g.flash*.4);

function drawReticle(){
  if (!ground.length || !P.alive) return;
  const rx = P.x, ry = clamp(P.y-GS_AHEAD,30,H-40);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=rgba(PAL.bolt,.7); ctx.lineWidth=1.6;
  const s=13, o=6;
  for (const c of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    ctx.beginPath();
    ctx.moveTo(rx+c[0]*s, ry+c[1]*s - c[1]*o); ctx.lineTo(rx+c[0]*s, ry+c[1]*s); ctx.lineTo(rx+c[0]*s - c[0]*o, ry+c[1]*s);
    ctx.stroke();
  }

function drawGroundFx(dt){
  ctx.globalCompositeOperation='lighter';
  for (let i=groundFx.length-1;i>=0;i--){
    const f = groundFx[i]; f.t += dt;
    const k = clamp(f.t/.3,0,1);
    ctx.strokeStyle=rgba(PAL.bolt,(1-k)*.7); ctx.lineWidth=2;

/* ============================================================
   8 · boss framework
   ============================================================ */
function spawnBoss(def){
  /* the fight is built to last: hull is set against the loadout that arrives (#20) */
  const scale = diff.hp * BOSS_HP_MUL * Math.pow(loadoutPower(), BOSS_HP_EXP);
  const parts = (def.parts ? def.parts() : []).map((p,i) =>
    Object.assign({ id:i, alive:true, r:24, x:W/2, y:-100, fireT:rnd(.5,2) }, p,
                  { hp:p.hp*scale, max:p.hp*scale }));
  boss = {
    def, x:W/2, y:-170, tx:W/2, ty:(def.y||.2)*H, r:def.r, t:0, flash:0, phase:1, phaseT:0,
    gates: def.phaseAt || DEFAULT_PHASES,
    hp:def.hp*scale, max:def.hp*scale, spin:0, timers:{}, vars:{}, parts
  };
  gradeReset();                 /* the fight is scored from the moment it starts */
  if (def.init) def.init(boss);
  bossMaxHP = boss.max + parts.reduce((s,p)=>s+p.max,0);
  showBoss(true, def.label);
  Sound.alarm(); Sound.targetIntensity = 1;
}
function partPos(b,p){
  if (p.rad !== undefined){ const a = p.a + (p.fixed?0:b.spin); p.x = b.x+Math.cos(a)*p.rad; p.y = b.y+Math.sin(a)*p.rad; }
  else { p.x = b.x+(p.ox||0); p.y = b.y+(p.oy||0); }
}
function bossTotalHP(){
  if (!boss) return 0;
  let h = Math.max(0,boss.hp);
  for (const p of boss.parts) if (p.alive) h += Math.max(0,p.hp);
  return h;
}
function updateBoss(dt){
  const b = boss, d = b.def;
  b.t += dt; b.flash = Math.max(0,b.flash-dt*5);
  /* dying: no phases, no sniper, no attacks — just the body coming apart */
  if (b.dying){ updateBossDeath(b,dt); return; }
  b.spin += dt*(d.spin||0);
  if (d.move) d.move(b,dt);
  b.x = lerp(b.x,b.tx,1-Math.pow(.94,dt*60));
  b.y = lerp(b.y,b.ty,1-Math.pow(.96,dt*60));
  if (d.layout) d.layout(b,dt); else for (const p of b.parts) partPos(b,p);

  /* phase gates — the flip snaps to the next musical beat (#10) so transitions land on the downbeat.
     A phase also has to hold for PHASE_MIN before it can hand over, so no amount of
     damage lets you skip a boss's choreography (#20). */
  b.phaseT += dt;
  if (b.phase <= b.gates.length){
    /* hand over one phase at a time: the gate has to be reached *and* the phase
       has to have had its say, then the flip lands on the downbeat */
    if (b.hp/b.max <= b.gates[b.phase-1] + 1e-6 && b.phaseT >= PHASE_MIN && beatTick){
      b.phase++; b.phaseT = 0; flash=.35; Sound.alarm(); if (d.onPhase) d.onPhase(b,b.phase);
    }
  }
  /* beat-locked sniper accent (#8/#10) — a fast aimed shot on the bar cuts through slow curtains.
     It used to fire for all 24 bosses with no opt-out and no wind-up, which meant a boss built
     as a pure curtain wore a bolted-on aimed shot it was never designed around. `sniper:null`
     turns it off; an object overrides the beat, speed and phase. */
  const sn = d.sniper === undefined ? BOSS_SNIPER : d.sniper;
  if (sn && beatTick && beatCount%(sn.beat||4)===0 && b.phase>=(sn.from||2) && P.alive)
    fireAt(b.x,b.y,P.x,P.y, (sn.sp||430)*BV, {r:5});
  /* ---- desperation (#21) ------------------------------------------------------
     Deliberately NOT an enrage timer. A timer punishes a low-damage build for something it
     cannot control and reads as arbitrary — you lose to a stopwatch rather than to the boss.
     Instead the pressure escalates on its own once the hull is nearly gone: this boss's own
     timers accelerate (never the global RATE, so nothing else on screen is affected) and the
     curtain thickens one layer at a time. The thickening feeds geoTier, so it can never
     exceed the layers the patterns were authored for — denser geometry, not more hit points.
     Self-limiting, deterministic, and the entry is unmissable. */
  if (d.rage && !b.raged && b.hp/b.max < .12){
    b.raged = true; b.rageT = 0; b.rateMul = 1.35;
    whiteout = Math.max(whiteout,.5); shake = Math.max(shake,20);
    showBanner('Desperation', d.rageLabel || 'it stops holding back');
    Sound.alarm(); Sound.hold(1.15, 3); haptic([0,50,40,50,40,90]);
    floatText(b.x,b.y-58,'DESPERATION',PAL.bolt);
    if (typeof d.rage === 'function') d.rage(b);
  }
  if (b.raged){
    b.rageT += dt;
    /* one more layer every eight seconds, capped by geoTier itself */
    rageTier = Math.min(2, 1 + Math.floor(b.rageT/8));
    b.rateMul = Math.min(1.7, 1.35 + b.rageT*.02);
  }

  for (const at of d.attacks){
    if (at.phase && at.phase.indexOf(b.phase)<0) continue;
    if (at.needParts === 0 && b.parts.some(p=>p.alive)) continue;
    if (at.needParts === 1 && !b.parts.some(p=>p.alive)) continue;
    const k = at.k;
    if (b.timers[k] === undefined) b.timers[k] = at.first!==undefined ? at.first : at.every;
    b.timers[k] -= dt*RATE*(b.rateMul||1);   /* this boss only — never the global RATE */
    if (b.timers[k] <= 0){
      if (at.gate && !at.gate(b)) continue;   /* holds the timer until the condition lands */
      b.timers[k] = typeof at.every==='function' ? at.every(b) : at.every;

         telegraph, which ticks on raw dt so rank and gear can shorten the gap between
         attacks but never the warning. `cancel` means a boss that dies mid-wind-up doesn't
         get a free parting shot. */
      if (at.warn) telegraph(at.warn, b.x, b.y, at.wa ? at.wa(b) : 0, bossTell(at.wd),
                             { fn:()=>at.fn(b), src:b, follow:true, cancel:true,

function damageBoss(dmg,part,ang){
  const b = boss; if (!b || b.dying) return;   /* a corpse takes no more hits */
  if (part && part.alive){
    /* a part can face-check the hit: armour that only opens from one side */
    if (b.def.hitArc && ang!==undefined && !b.def.hitArc(b,part,ang)){
      b.flash = .3;
      if (Math.random()<.2) floatText(part.x,part.y-12,'SEALED',PAL.ebullet);
      updateBossBar(); return;
    }
    part.hp -= dmg; b.flash = .6;
    if (part.hp<=0){
      part.alive = false;
      burst(part.x,part.y,34,PAL.boss,300); Sound.boom(1); shake=16; hitstop=.09;
      addScore(600,part.x,part.y);
      for (let k=0;k<4;k++) dropPickup(part.x+rnd(-16,16),part.y,'crystal');
      dropPickup(part.x,part.y,rollMod());
      /* #15: make the modular design readable — the vector this part fed is now gone */
      floatText(part.x,part.y-10,'MODULE DOWN',PAL.crystal);
      if (!b.parts.some(p=>p.alive)){
        if (b.def.coreGuard) floatText(b.x,b.y-46,'CORE EXPOSED',PAL.bolt);
        teach('subsys','Blow off a boss’s <b>modules</b> to strip its attacks — and expose the core.');
      }
      if (b.def.onPartDeath) b.def.onPartDeath(b,part);
    }
  } else {
    /* the impact bearing is passed through so a boss can have a seam that only opens from
       one side; every existing coreGuard ignores the extra arg, so this stays compatible */
    const guard = b.def.coreGuard ? b.def.coreGuard(b, ang) : 0;
    if (guard >= 1){ b.flash=.3; if (Math.random()<.3) floatText(b.x,b.y-40,'SHIELDED',PAL.ebullet); updateBossBar(); return; }
    b.hp -= dmg*(1-guard); b.flash = 1;
    /* a phase holds until it has played out — burst damage banks against the gate
       rather than tearing through it (#20). The last phase has no gate below it,
       so it holds on the clock alone. */
    const gate = b.phase <= b.gates.length ? b.max*b.gates[b.phase-1]
               : (b.phaseT < PHASE_MIN ? 1 : 0);
    if (b.hp < gate){
      b.hp = gate;
      if (Math.random()<.15) floatText(b.x,b.y-40,'ARMOURED',PAL.ebullet);
    }
  }
  updateBossBar();
  if (b.hp<=0) beginBossDeath();
}
/* ---- the kill ceremony (#21) -------------------------------------------------
   The old killBoss nulled the boss and *then* fired nine setTimeout explosions, so the
   death played out over empty space, on wall-clock time — ignoring pause, hitstop and all
   five game-speed settings — and a boss death carried no hitstop at all, less punctuation
   than blowing off one of its own pods. It also read the same for a 4,000-point warden and
   the 60,000-point Aperture.

   Now the boss stays on screen and visibly comes apart, driven from update(dt) so the whole
   sequence inherits pause, hitstop and game speed for free, and keeps its randomness on the
   fx stream. `boss` stays non-null until the end, which also means runLevelScript's
   {clear:true} waits out the sequence with no extra plumbing. */
/* Wind-up length scales with the sector: sector 1 is the tutorial and gets the most
   generous warning, sector 12 the tightest. Floors at .34s so a tell is always readable. */
function bossTell(base){
  const b0 = base || .55;
  return Math.max(.34, b0 - levelIdx*.016);
}
const BOSS_SNIPER = { beat:4, from:2, sp:430 };
const DEATH_DUR = [1.2, 2.0, 3.0];         /* mid-boss · sector final · campaign final */
const DEATH_POPS = [7, 12, 18];
function bossTier(def){
  if (def.final) return (def.reward||0) >= 30000 ? 2 : 1;
  return (def.reward||0) >= 20000 ? 1 : 0;
}
/* The grade lines are the reason to watch the death sequence: each one arrives on its own
   beat, with a rising chime, and the final whiteout reveals the letter. */
function buildGradeLines(def){
  const gi = gradeIndex(), base = def.reward||4000, lines = [];
  if (grade.hits===0)  lines.push(['NO DAMAGE', Math.round(base*.5)]);
  if (grade.bombs===0) lines.push(['NO BOMB',   Math.round(base*.25)]);
  /* par derives from the boss's own choreography rather than a hand-tuned table: a fight can
     never finish faster than one PHASE_MIN per phase, so par is a generous multiple of that
     floor and stays correct if a boss gains or loses a phase. `def.par` overrides. */
  const phases = ((def.phaseAt||DEFAULT_PHASES).length + 1);
  const took = elapsed - grade.t0, par = def.par || phases*PHASE_MIN*1.9;
  if (took <= par) lines.push([Math.round(took)+'s · UNDER PAR', Math.round(base*.3)]);
  const gz = graze - grade.graze0;
  if (gz >= 40) lines.push(['GRAZE ×'+gz, Math.round(base*.2)]);
  lines.push(['RANK ' + GRADES[gi], 0]);
  sectorGrade = Math.max(sectorGrade, gi);      /* the sector is only as good as its worst fight */
  return { lines, gi };
}
function beginBossDeath(){
  const b = boss, def = b.def, tier = bossTier(def);
  const g = buildGradeLines(def);
  b.dying = { t:0, dur:DEATH_DUR[tier], tier, pop:0, pops:DEATH_POPS[tier],
              lines:g.lines, li:0, gi:g.gi };
  b.hp = 0;

  /* an S is worth something you can spend, not just something you can read */
  if (g.gi === 0){ P.shield = Math.min(P.shieldMax, P.shield+1); refreshHUD(true); }

  /* the reward reads like a reward: big, bloomed, and counting up */
  const reward = Math.round((def.reward||4000)*mult);
  score += reward; refreshHUD();
  floatUp(b.x, b.y-10, reward, PAL.star, { size:34, hold:1.8, prefix:'+' });

  /* first beat: the impact */
  hitstop = Math.max(hitstop, [.18,.28,.45][tier]);
  shake = Math.max(shake, 22+tier*8);
  whiteout = Math.max(whiteout, .22+tier*.1);
  Sound.boom(1.4); haptic([0,30,40,90]);
  Sound.hold(0, .5);                       /* silence, then the sting — see Sound.hold */

  /* the arena clears itself: a harmless sweep that turns live fire into crystals */
  const s = { x:b.x, y:b.y, r:20, max:Math.hypot(W,H)*1.05,
              hitB:new Set(), hitE:new Set(), hitG:new Set(), harmless:true };
  s.hitB.add(b);                           /* never re-enter damageBoss on the corpse */
  shocks.push(s);

  curveField = 0; pullField = 0; arena = null; bossDark = 0; rageTier = 0;

  /* loot, magnetised so the biggest payout in the game can't be missed */
  const nCry = 16 + tier*6;
  for (let k=0;k<nCry;k++){
    dropPickup(b.x+rnd(-70,70), b.y+rnd(-30,30), 'crystal');
    pickups[pickups.length-1].mag = true;
  }
  dropPickup(b.x-34,b.y,rollMod()); dropPickup(b.x+34,b.y,rollMod()); dropPickup(b.x,b.y+26,'shield');
  if (def.final) dropPickup(b.x,b.y-20,'bomb');

}
function updateBossDeath(b,dt){
  const d = b.dying;
  d.t += dt;
  const k = clamp(d.t/d.dur, 0, 1);

  /* the hull drifts, lists and sinks as it goes */
  b.x += Math.sin(d.t*2.2)*14*dt;
  b.y += (26 + 40*k)*dt;
  b.spin += dt*(1.4 + k*3.2);

  /* staggered detonations across the body, on the sim clock rather than wall-clock */
  const stagger = d.dur/d.pops;
  while (d.pop < d.pops && d.t > d.pop*stagger){
    const a = frnd(0,TAU), rr = frnd(.2,1)*b.r*1.5;
    burst(b.x+Math.cos(a)*rr, b.y+Math.sin(a)*rr, 26+d.tier*6,
          (d.pop%2) ? PAL.boss : PAL.crystal, 300+d.tier*60);
    Sound.boom(1+d.tier*.15);
    shake = Math.max(shake, 14+d.tier*4);
    d.pop++;
  }

  /* the tally, one line per beat, each a step higher than the last */
  const lineGap = d.dur/(d.lines.length+1);
  while (d.li < d.lines.length && d.t > (d.li+1)*lineGap){
    const [txt,val] = d.lines[d.li];
    const isRank = d.li === d.lines.length-1;
    const y = b.y + 34 + d.li*22;
    if (val){
      score += Math.round(val*mult); refreshHUD();
      floatUp(W/2, y, Math.round(val*mult), PAL.crystal,
              { size:15, hold:1.5, prefix:txt+'  +', count:false });
      const f = floats[floats.length-1];
      f.txt = txt + '  +' + Math.round(val*mult).toLocaleString();
    } else {
      floatUp(W/2, y, 0, isRank?PAL.star:PAL.crystal, { size:isRank?26:15, hold:2, count:false });
      floats[floats.length-1].txt = txt;
    }
    Sound.chime(clamp(3 + d.li*2, 0, 11));
    d.li++;
  }

  if (d.t >= d.dur){
    /* the last beat: everything at once, then the sting */
    burst(b.x, b.y, 40+d.tier*14, PAL.crystal, 420+d.tier*80);
    burst(b.x, b.y, 30+d.tier*10, PAL.boss, 300);
    whiteout = Math.max(whiteout, .55+d.tier*.15);
    shake = Math.max(shake, 30+d.tier*6);
    hitstop = Math.max(hitstop, .12);
    Sound.boom(1.6); haptic([0,50,50,120]);
    Sound.fanfare(d.tier);
    Sound.hold(.62, 2.2);                  /* resolve upward instead of deflating */
    boss = null;
  }
}

let hazard = null;

/* A skin may restyle a hazard, but only its two DRAW hooks are overridable — `update` holds the
   collision, the shoves and the bullet deflection, and it is structurally out of a skin's reach.
   "A skin changes nothing about gameplay" is enforced here by the shape of the override rather
   than by remembering to be careful. A hazard with no art for the current skin keeps its
   original drawing in that skin's colours, exactly as entities do.

   The original hooks are stashed on first skinning, so switching skin mid-fight re-points the
   drawing without rebuilding the hazard — a rebuild would reset the columns' phase and the
   coral's growth, which is state the player is reading. */
function skinHazard(h){
  if (!h) return h;
  if (!h._draw0) h._draw0 = { back:h.drawBack, front:h.drawFront };
  const a = art('hazard', h._key);
  h.drawBack  = (a && a.drawBack)  || h._draw0.back;
  h.drawFront = (a && a.drawFront) || h._draw0.front;
  return h;
}
function makeHazard(key){
  if (!key) return null;
  const h = HAZARDS[key]();
  h._key = key;
  return skinHazard(h);
}

const RELICS = [
  { k:'tempo',   n:'Quickening',   d:'Your cannon cycles a fifth faster.' },
  { k:'lens',    n:'Burning Lens', d:'Focused fire hits far harder.' },
  { k:'bulwark', n:'Bulwark',      d:'A shield rebuilds itself every twenty seconds.' },
  { k:'well',    n:'Gravity Well', d:'Crystals fall toward you from anywhere on screen.' },
  { k:'twin', warn:'ring', wd:0.55, n:'Twin Chorus',  d:'Two more drones, past the usual limit.' },
  { k:'bore',    n:'Wide Bore',    d:'Heavier shots that punch through one more hull.' },
  { k:'surge',   n:'Overcharge',   d:'Overdrive builds twice as fast and runs longer.' },
  { k:'spite',   n:'Spite',        d:'Every kill splashes damage into whatever stands nearest.' }
];
let dmgMul = 1, pierceBonus = 0;
function relicName(k){ const r=RELICS.find(x=>x.k===k); return r?r.n:k; }
function ascend(){
  MODMAX.power=6; MODMAX.spread=3; MODMAX.rapid=3; MODMAX.homing=4; MODMAX.pierce=4; MODMAX.drones=4;
}
function relicTick(dt){
  const R = P.relics||{};
  /* Quickening — extra cannon cycling rather than a rewritten fire rate */
  if (R.tempo) P.fireT -= dt*.22;
  /* Bulwark — slow shield regrowth */
  if (R.bulwark){
    P.bulwarkT = (P.bulwarkT||0) + dt;
    if (P.bulwarkT >= 20){ P.bulwarkT = 0;
      if (P.shield < P.shieldMax){ P.shield++; floatText(P.x,P.y-26,'BULWARK',PAL.hull); refreshHUD(true); } }
  }
  /* Break (#9) — graze and close kills charge the meter; when full, the ship boils over
     into a screen-melting overdrive. Charging happens in onGraze / killEnemy. */
  if (P.odT > 0){
    P.odT -= dt;
    P.fireT -= dt*1.6;                                 /* far faster fire while broken */
    if (fchance(dt*95))
      pPart({ x:P.x+frnd(-18,18), y:P.y+frnd(-16,16), vx:frnd(-50,50), vy:frnd(70,200),
              life:.45, r:frnd(1.6,4.2), c:PAL.bolt, g:0 });
    if (P.odT <= 0) floatText(P.x,P.y-30,'BREAK OUT',PAL.hull);
  } else if (P.od >= 1){
    P.od = 0; P.odT = R.surge?8:6;
    whiteout = Math.max(whiteout,.2); shake = Math.max(shake,12);
    floatText(P.x,P.y-34,'BREAK',PAL.bolt); Sound.alarm(); haptic([0,45,30,70]);
  } else P.od = Math.max(0,(P.od||0) - dt*.05);         /* slow bleed if you stop pressing the aggression */

  dmgMul = 1 + (P.odT>0?.8:0) + (R.lens && P.focus ? .4 : 0) + (R.bore?.15:0);
  pierceBonus = (R.bore?1:0) + (P.odT>0?1:0);

  if (elBreakFill){
    elBreakFill.style.width = (P.odT>0 ? 100 : (P.od||0)*100) + '%';
    elBreakBar.classList.toggle('full', P.odT>0);
  }
}

/* ============================================================
   10 · six sectors
   ============================================================ */
function row(type,n,opts){
  const pad = W/(n+1), jit = rnd(-18,18);
  /* stagger fireT as well as phase: without this a row of five fires five volleys inside one
     second, which reads as a wall rather than a rhythm. Net easier, and every sector benefits. */
  for (let i=0;i<n;i++){ const e=spawnEnemy(type, pad*(i+1)+jit, -40-i*rnd(10,40), opts);
    e.phase=i*.7; e.fireT += i*rnd(.18,.34); }
}
function vee(type,n,opts){
  const cx = rnd(W*.3,W*.7);
  for (let i=0;i<n;i++){ const s=i%2?1:-1, k=Math.floor(i/2)+1;
    spawnEnemy(type, clamp(cx+s*k*46,26,W-26), -40-k*36, opts); }
}
function arcRow(type,n,opts){
  for (let i=0;i<n;i++){ const t=(i+1)/(n+1);
    spawnEnemy(type, W*(.14+t*.72), -50-Math.sin(t*Math.PI)*70, opts); }
}
function lancers(n,opts){
  for (let i=0;i<n;i++) spawnEnemy('lancer', rnd(W*.15,W*.85), -50-i*30, Object.assign({ holdY:rnd(H*.12,H*.32) },opts||{}));
}
function scavvers(n){
  for (let i=0;i<n;i++){
    const dir = Math.random()<.5?1:-1;
    spawnEnemy('scavver', dir>0?-40:W+40, rnd(H*.12,H*.45), { dir, phase:i });
  }
}
const B = k => () => spawnBoss(BOSS[k]);

/* --- relics are offered on the way into each of the last six sectors --- */
function offerRelic(proceed,n){
  const owned = P.relics||{};
  const pool = RELICS.filter(r=>!owned[r.k]);
  if (!pool.length){ proceed(); return; }
  const want = n||3;                 /* a well-flown sector widens the choice (#21) */
  const pickThree = [];
  while (pickThree.length<Math.min(want,pool.length)){
    const r = pick(pool);
    if (pickThree.indexOf(r)<0) pickThree.push(r);
  }
  elVeil.classList.remove('off');
  elVeil.innerHTML = '<div class="eyebrow">Salvage from the wreck</div><h2>Take one</h2>'+
    '<p class="lede">Relics are permanent for the rest of the run, and the caps on your weapon have come off.</p>'+
    '<div id="relicBox" style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px"></div>';
  const box = $('relicBox');
  pickThree.forEach(r=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.style.textAlign = 'left'; b.style.padding = '13px 15px';
    b.innerHTML = r.n + '<small>' + r.d + '</small>';
    b.onclick = ()=>{
      P.relics[r.k] = 1;
      if (r.k==='twin') syncDrones();
      Sound.pickup();
      proceed();
    };
    box.appendChild(b);
  });
}

let step=0, waitTime=0, waitClear=false;
/* ---- encounter gates (#21) ---------------------------------------------------
   `{clear:true}` is binary: one stray drifter drifting down the far edge stalls the whole
   sector. Two softer gates turn a timed spawn list into encounters that pose a question.
     {until:{type:'polyp'}}  hold until every one of a type is dead — makes a priority target
                             an actual gate, so you cannot simply turtle past it
     {threat:n}              hold until the field thins to n — pace, without the full stall
     {mark:'name'}           grading segment boundary (stage 3)
   Every gate carries a timeout. A gate that can never open is a soft-locked run, and the ways
   to reach one are real: a bomb clears the gating type, or it drifts off the bottom of the
   screen before you ever see it. */
let gateType = null, gateN = -1, gateT = 0;
const GATE_MAX = 26;
function gateOpen(dt){
  gateT += dt;
  if (gateT > GATE_MAX) return true;              /* never let a run soft-lock on a gate */
  if (gateType){
    for (const e of enemies) if (e.type === gateType) return false;
    return true;
  }
  if (gateN >= 0) return enemies.length <= gateN && !boss;
  return true;
}
function runLevelScript(dt){
  const SCRIPT = LEVELS[levelIdx].script;
  if (waitTime>0){ waitTime -= dt; return; }
  if (waitClear){ if (enemies.length || boss) return; waitClear = false; }
  if (gateType || gateN>=0){
    if (!gateOpen(dt)) return;
    gateType = null; gateN = -1;
  }
  while (step < SCRIPT.length){
    const s = SCRIPT[step++];
    if (s.wait !== undefined){ waitTime = s.wait; return; }
    if (s.clear){ waitClear = true; return; }
    if (s.until){ gateType = s.until.type; gateT = 0; return; }
    if (s.threat !== undefined){ gateN = s.threat; gateT = 0; return; }
    if (s.mark){ gradeReset(); continue; }
    if (s.banner){ showBanner(s.banner.t, s.banner.s); continue; }
    if (s.spawn){ s.spawn(); continue; }
    if (s.checkpoint){ saveCheckpoint(); continue; }
    if (s.end){ levelClear(); return; }
  }
}
/* The post-checkpoint relief drop was copy-pasted identically twelve times. One helper, and it
   now reads the room: a sector you are struggling through hands you more, a sector you are
   dismantling hands you less. That closes the grading loop into moment-to-moment resources
   instead of leaving the grade as a letter on a screen. */
function reliefDrop(){
  const struggling = sectorGrade >= 2 || P.lives <= 1;
  const cruising   = sectorGrade === 0 && P.lives >= 3;
  dropPickup(W/2,  H*.4, 'shield');
  dropPickup(W*.32,H*.4, 'bomb');
  dropPickup(W*.68,H*.4, cruising ? rollMod() : 'power');
  if (struggling){
    dropPickup(W*.5, H*.46, 'shield');
    dropPickup(W*.2, H*.44, rollMod());
  }
}
function saveCheckpoint(){
  checkpoint = { level:levelIdx, step, score, cores, lives:P.lives, bombs:P.bombs, shield:P.shield,
                 mods:Object.assign({},P.mods) };
  showBanner('Checkpoint','Progress secured');
}
function loadCheckpoint(){
  const c = checkpoint;
  levelIdx = c.level;
  clearField(); showBoss(false);
  applyPalette(levelIdx); computeTiers(); Sound.setMode(levelIdx);
  hazard = makeHazard(LEVELS[levelIdx].hazard);
  step = c.step; waitTime = 1.2; waitClear = false; gateType = null; gateN = -1; gateT = 0;
  score = c.score; cores = c.cores;
  P.lives = Math.max(1,c.lives); P.bombs = Math.max(1,c.bombs); P.shield = c.shield;
  P.mods = Object.assign({},c.mods); P.alive = true; P.inv = 2.4;
  P.x=W/2; P.y=H*.78; P.tx=P.x; P.ty=P.y;
  chain=0; mult=1; grazeStreak=0; grazeMult=0; grazeTimer=0; rank=0;
  lastBeat=-1; beatCount=0;
  syncDrones(); refreshHUD(true);
}
