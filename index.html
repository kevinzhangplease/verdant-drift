<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#04070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verdant Drift">
<title>Verdant Drift — Six Sectors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04070f; --ink:#e8f6f2; --dim:#7c9a97;
    --jade:#6ffbc0; --rose:#ff5aa8; --amber:#ffc978;
    --edge:rgba(120,240,210,.22);
    --display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--display)}
  body{position:fixed;inset:0;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #game{display:block;position:absolute;inset:0}

  #hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
       display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .stat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1;text-shadow:0 0 14px rgba(142,242,255,.4)}
  .val.small{font-size:15px}
  #multWrap{text-align:right}
  #mult{font-size:26px;color:var(--jade);text-shadow:0 0 18px rgba(111,251,192,.6);transition:transform .12s}
  #mult.pop{transform:scale(1.22)}
  #mult.hot{color:var(--amber);text-shadow:0 0 22px rgba(255,201,120,.75)}
  #chainBar{width:104px;height:3px;background:rgba(255,255,255,.12);margin-left:auto;margin-top:5px;border-radius:2px;overflow:hidden}
  #chainFill{height:100%;width:0;background:var(--jade);box-shadow:0 0 10px var(--jade)}
  #breakBar{width:104px;height:4px;background:rgba(255,255,255,.12);margin-left:auto;margin-top:5px;border-radius:2px;overflow:hidden}
  #breakFill{height:100%;width:0;background:linear-gradient(90deg,var(--jade),#a8f6ff);box-shadow:0 0 10px var(--jade);transition:width .08s}
  #breakBar.full{box-shadow:0 0 16px rgba(142,255,232,.85)}
  #breakBar.full #breakFill{background:#eafffb;animation:breakpulse .5s infinite}
  @keyframes breakpulse{0%,100%{opacity:1}50%{opacity:.55}}
  #lifeRow{display:flex;gap:6px;margin-top:4px}
  .pip{width:9px;height:9px;border:1px solid var(--jade);transform:rotate(45deg);opacity:.35}
  .pip.on{background:var(--jade);opacity:1;box-shadow:0 0 10px var(--jade)}
  #mods{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-width:190px}
  .mod{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 7px;border:1px solid var(--edge);
       border-radius:2px;color:var(--jade);background:rgba(111,251,192,.07)}
  #sectorTag{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:9px}

  #bossWrap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 96px);padding:0 18px;opacity:0;
            transition:opacity .35s;pointer-events:none}
  #bossWrap.on{opacity:1}
  #bossName{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);
            margin-bottom:5px;text-align:center}
  #bossBar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
  #bossFill{height:100%;width:100%;background:linear-gradient(90deg,var(--rose),var(--amber));
            box-shadow:0 0 16px rgba(255,90,168,.7);transition:width .12s linear}

  #banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          pointer-events:none;opacity:0;transition:opacity .5s}
  #banner.on{opacity:1}
  #bTitle{font-size:clamp(30px,9vw,56px);font-weight:700;letter-spacing:-.02em;line-height:1;text-align:center;
          text-shadow:0 0 40px rgba(111,251,192,.5)}
  #bSub{font-family:var(--mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--jade);
        margin-top:12px;text-align:center;padding:0 24px}

  /* teaching line — appears once, when a mechanic first matters */
  #teach{position:absolute;left:0;right:0;bottom:150px;text-align:center;pointer-events:none;opacity:0;
         transition:opacity .45s;padding:0 26px}
  #teach.on{opacity:1}
  #teach span{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;line-height:1.7;
              color:var(--ink);background:rgba(4,12,18,.72);border:1px solid var(--edge);border-radius:3px;
              padding:9px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #teach b{color:var(--amber);font-weight:500}

  #pads{position:absolute;left:0;right:0;bottom:0;height:132px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);
        display:flex;align-items:flex-end;justify-content:space-between;opacity:0;transition:opacity .4s;pointer-events:none}
  #pads.on{opacity:1}
  .pad{pointer-events:auto;width:80px;height:80px;border-radius:50%;border:1px solid var(--edge);
       background:rgba(8,22,26,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;
       flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--mono);font-size:9px;
       letter-spacing:.18em;color:var(--dim);transition:transform .08s,background .12s,border-color .12s}
  .pad b{font-size:18px;font-weight:500;color:var(--ink);letter-spacing:0}
  .pad.hot{background:rgba(111,251,192,.16);border-color:var(--jade);color:var(--jade);transform:scale(.94)}
  .pad.empty{opacity:.32}
  .pad.deny{animation:deny .3s}
  @keyframes deny{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #padForm{width:60px;height:60px;display:none}
  #padForm.show{display:flex}
  #padForm b{font-size:12px;letter-spacing:.04em}
  .pad.ready{box-shadow:0 0 0 0 rgba(255,201,120,.55);animation:ready 1.8s infinite}
  @keyframes ready{0%{box-shadow:0 0 0 0 rgba(255,201,120,.45)}70%{box-shadow:0 0 0 14px rgba(255,201,120,0)}100%{box-shadow:0 0 0 0 rgba(255,201,120,0)}}

  #veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:30px 22px calc(env(safe-area-inset-bottom) + 22px);text-align:center;overflow-y:auto;
        background:radial-gradient(ellipse at 50% 40%,rgba(6,24,26,.5),rgba(4,7,15,.93) 70%);
        backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #veil.off{display:none}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--jade);margin-bottom:14px}
  h1{font-size:clamp(38px,13vw,76px);font-weight:700;letter-spacing:-.035em;line-height:.92;margin-bottom:4px}
  h1 em{font-style:normal;display:block;color:var(--jade);text-shadow:0 0 46px rgba(111,251,192,.45)}
  h2{font-size:clamp(26px,8vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.04;margin-bottom:10px}
  .lede{max-width:340px;font-size:13.5px;line-height:1.6;color:var(--dim);margin-bottom:20px}
  .grp{margin-bottom:18px;width:100%;max-width:360px}
  .grpLabel{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .choices{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .choice{padding:10px 13px;border:1px solid var(--edge);border-radius:3px;background:rgba(8,22,26,.5);
          font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
          cursor:pointer;transition:.14s}
  .choice small{display:block;font-family:var(--display);font-size:10px;letter-spacing:0;text-transform:none;
                color:rgba(124,154,151,.7);margin-top:3px}
  .choice[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:rgba(111,251,192,.12);
          box-shadow:0 0 24px rgba(111,251,192,.16)}
  .secGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:360px}
  .sec{padding:9px 6px;border:1px solid var(--edge);border-radius:3px;background:rgba(8,22,26,.5);cursor:pointer;
       transition:.14s;text-align:center}
  .sec i{display:block;font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--dim)}
  .sec span{display:block;font-size:11.5px;margin-top:3px;color:var(--ink);line-height:1.25}
  .sec[aria-pressed="true"]{border-color:var(--jade);background:rgba(111,251,192,.12)}
  .sec[aria-pressed="true"] i{color:var(--jade)}
  .btn{padding:15px 40px;border:1px solid var(--jade);border-radius:3px;background:rgba(111,251,192,.12);
       color:var(--jade);font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
       cursor:pointer;transition:.14s;box-shadow:0 0 30px rgba(111,251,192,.16)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{border-color:var(--edge);color:var(--dim);background:transparent;box-shadow:none}
  .btnRow{display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:4px}
  .tally{display:flex;gap:22px;margin-bottom:20px;font-family:var(--mono);flex-wrap:wrap;justify-content:center}
  .tally div{text-align:center}
  .tally span{display:block;font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
  .tally b{font-size:24px;font-weight:500;color:var(--ink)}
  .hint{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(124,154,151,.65);margin-top:18px;line-height:1.9}
  .helpList{text-align:left;max-width:360px;font-size:13px;line-height:1.65;color:var(--dim)}
  .helpList b{color:var(--ink);font-weight:500}
  .helpList p{margin-bottom:13px}
  .helpList em{font-style:normal;color:var(--amber)}
  #sound,#pause{position:absolute;top:calc(env(safe-area-inset-top) + 10px);width:34px;height:34px;border:1px solid var(--edge);
         border-radius:50%;background:rgba(8,22,26,.5);color:var(--dim);font-size:13px;display:flex;align-items:center;
         justify-content:center;cursor:pointer;z-index:5}
  #sound{right:12px} #pause{right:52px;display:none;font-family:var(--mono);font-size:11px}
  #pause.on{display:flex}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div>
      <div class="stat">Score</div>
      <div class="val" id="score">0</div>
      <div id="lifeRow"></div>
      <div id="mods"></div>
      <div id="sectorTag"></div>
    </div>
    <div id="multWrap">
      <div class="stat">Chain</div>
      <div class="val" id="mult">×1</div>
      <div id="chainBar"><div id="chainFill"></div></div>
      <div class="stat" style="margin-top:10px">Cores</div>
      <div class="val small" id="cores">0</div>
      <div class="stat" style="margin-top:10px">Break</div>
      <div id="breakBar"><div id="breakFill"></div></div>
    </div>
  </div>
</div>

<div id="bossWrap"><div id="bossName"></div><div id="bossBar"><div id="bossFill"></div></div></div>
<div id="banner"><div id="bTitle"></div><div id="bSub"></div></div>
<div id="teach"><span></span></div>

<div id="pads">
  <div class="pad" id="padBomb"><b>2</b>Bomb</div>
  <div class="pad" id="padForm"><b>FWD</b>Form</div>
  <div class="pad" id="padFocus"><b>◎</b><span id="focusLbl">Focus</span></div>
</div>

<button id="pause" aria-label="Pause">||</button>
<button id="sound" aria-label="Toggle sound">♪</button>
<div id="veil"></div>

<script>
(() => {
'use strict';

/* ============================================================
   0 · helpers
   ============================================================ */
const TAU = Math.PI*2;
const DESKTOP = (()=>{ try { return !!(window.matchMedia && window.matchMedia('(pointer:fine)').matches); } catch(e){ return false; } })();

/* --- seeded RNG: every run is reproducible; the daily run shares a seed --- */
const _origRandom = Math.random;
let _rng = _origRandom;
const rand = () => _rng();
let lastSeed = 0, seededMode = false, dailyRun = false;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedRun(s){ lastSeed = s>>>0; const g = mulberry32(lastSeed); _rng = g; Math.random = g; seededMode = true; }
function dailyKey(){ const d = new Date(); return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate(); }
function dailySeed(){ const s = dailyKey(); let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }

/* Cosmetic randomness draws from its own generator (#21). Particle counts are clamped by
   qParts(), which the adaptive-quality monitor lowers based on measured frame time — so
   letting sparks draw from the seeded stream made the number of draws depend on wall-clock
   performance, and the simulation diverged from itself. Daily Drift was never actually
   reproducible. Keeping decoration on a separate stream is what makes the seed mean something. */
let _fxRng = mulberry32(0x9E3779B9);
function seedFx(s){ _fxRng = mulberry32((s>>>0) ^ 0x9E3779B9); }
const frnd = (a,b) => a + _fxRng()*(b-a);
const fchance = p => _fxRng() < p;

const rnd  = (a,b) => a + rand()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(rand()*a.length)];
const clamp= (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rgba = (c,a) => 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
const dist2= (ax,ay,bx,by) => { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };
const $ = id => document.getElementById(id);

/* --- swap-remove: O(1) deletion for the hot per-frame arrays (order-free) --- */
function swapDel(a,i){ const last=a.length-1; if(i!==last) a[i]=a[last]; a.pop(); }
/* --- particle pool: recycle objects so the GC doesn't stutter on mobile --- */
const partPool = [];
function pPart(o){ const p = partPool.length ? partPool.pop() : {};
  p.x=o.x; p.y=o.y; p.vx=o.vx||0; p.vy=o.vy||0; p.life=o.life; p.max=o.max||o.life;
  p.r=o.r; p.c=o.c; p.g=o.g||0; p.ring=o.ring||false; parts.push(p); return p; }

/* --- player settings + saved progress (localStorage) --- */
const Settings = { shake:1, flash:1, safeFlash:false, colorblind:false, haptics:true, hitbox:true, focusSlow:false, quality:'auto' };
let Best = { hi:0, furthest:1, sectors:{}, daily:{}, launches:0, grades:{} };
const SAVE_KEY = 'verdantDrift.v1';
function loadSave(){
  try{ const d = JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if (d){ if (d.settings) Object.assign(Settings,d.settings);
            if (d.best) Object.assign(Best,d.best);
            if (!Best.grades) Best.grades = {};      /* older saves predate grading */
            return d.pref||null; }
  }catch(e){}
  return null;
}
function saveSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    settings:Settings, best:Best,
    pref:{ diff:diff.key, speed:speedIdx, muted:Sound.muted, skin:skinKey }
  })); }catch(e){}
}
function recordSectorGrade(levelIndex, gi){
  if (gi < 0) return;
  const k = 's'+(levelIndex+1), prev = Best.grades[k];
  if (prev === undefined || gi < prev) Best.grades[k] = gi;   /* lower index = better */
  saveSave();
}
function recordRun(finalScore, sectorReached){
  Best.hi = Math.max(Best.hi, finalScore);
  Best.furthest = Math.max(Best.furthest, sectorReached);
  const sk = 's'+sectorReached; Best.sectors[sk] = Math.max(Best.sectors[sk]||0, finalScore);
  if (dailyRun){ const dk = dailyKey(); Best.daily[dk] = Math.max(Best.daily[dk]||0, finalScore); }
  saveSave();
}
/* --- haptics: a short buzz on the moments that matter --- */
function haptic(p){ if (Settings.haptics && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

/* ============================================================
   1 · canvas + bloom buffer
   ============================================================ */
const cv = $('game'), ctx = cv.getContext('2d', { alpha:false });
const glowC = document.createElement('canvas'), gctx = glowC.getContext('2d');
const nebC  = document.createElement('canvas'), nctx = nebC.getContext('2d');
let W=0, H=0, DPR=1;
let GLOW_SCALE = 0.28;

/* --- adaptive quality: keep 60fps on low-end phones by shedding detail --- */
let qLevel = 2;                 /* 2 high · 1 medium · 0 low */
let frameEMA = 16, qCooldown = 0;
function qStar(){ return qLevel>=2 ? 1 : qLevel===1 ? .7 : .48; }
function qParts(){ return qLevel>=2 ? 60 : qLevel===1 ? 42 : 26; }
function applyQuality(){
  GLOW_SCALE = qLevel>=2 ? 0.28 : qLevel===1 ? 0.22 : 0.16;
  resizeGlow(); buildStars();
}
function setQualityPref(){
  if (Settings.quality==='high') qLevel = 2;
  else if (Settings.quality==='low') qLevel = 0;
  /* 'auto' leaves qLevel where the monitor put it */
  applyQuality();
}
function resizeGlow(){
  glowC.width  = Math.max(2, Math.round(W*GLOW_SCALE));
  glowC.height = Math.max(2, Math.round(H*GLOW_SCALE));
}
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  resizeGlow();
  vigKey = '';
  buildStars(); buildNebula(); debris.length = 0;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize,150));

const blobCache = new Map();
function blob(col){
  const key = col.join(',');
  let c = blobCache.get(key);
  if (c) return c;
  const s = 96;
  c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0, rgba(col,1)); g.addColorStop(.25, rgba(col,.55));
  g.addColorStop(.6, rgba(col,.14)); g.addColorStop(1, rgba(col,0));
  x.fillStyle = g; x.fillRect(0,0,s,s);
  blobCache.set(key,c); return c;
}

/* ============================================================
   2 · palettes — one identity per sector
   ============================================================ */
const PALETTES = [
  { key:'verdant', neb:[[26,96,88],[14,44,86],[70,32,96]], star:[190,255,244], foe:[110,246,186],
    foeDark:[10,38,44], ebullet:[255,90,168], elaser:[255,140,110], boss:[255,120,180], dust:.85 },
  { key:'ashfall', neb:[[96,46,22],[54,26,30],[28,26,36]], star:[255,214,180], foe:[255,158,96],
    foeDark:[34,18,14], ebullet:[255,86,64], elaser:[255,150,80], boss:[255,186,96], dust:1.05 },
  { key:'ember',   neb:[[132,32,20],[150,78,12],[64,10,52]], star:[255,232,192], foe:[255,132,64],
    foeDark:[42,12,10], ebullet:[255,70,124], elaser:[255,200,90], boss:[255,222,124], dust:1.15 },
  { key:'lattice', neb:[[38,30,96],[18,62,116],[86,20,118]], star:[232,236,255], foe:[168,182,255],
    foeDark:[12,14,40], ebullet:[255,72,152], elaser:[190,140,255], boss:[190,170,255], dust:.6 },
  { key:'shoal',   neb:[[6,42,72],[10,20,62],[32,8,64]], star:[180,232,255], foe:[92,222,255],
    foeDark:[4,16,30], ebullet:[255,112,88], elaser:[255,150,120], boss:[140,255,232], dust:.7 },
  { key:'quiet',   neb:[[96,84,58],[74,62,94],[118,104,78]], star:[255,250,232], foe:[255,232,182],
    foeDark:[28,24,18], ebullet:[255,88,110], elaser:[255,210,140], boss:[255,242,206], dust:.95 }
];
/* ---- skins (#22) -------------------------------------------------------------
   A skin changes only how the game looks and sounds. Nothing about movement, hitboxes,
   damage, spawn tables, timing or scoring may differ between skins.

   The legibility rule used to be "player fire is cool, enemy fire is hot", enforced
   structurally: applyPalette copied only the enemy keys, so player colours were physically
   unreachable by a swap. That rule's real purpose is knowing instantly whose projectile is
   whose — not the specific hue — so it generalises to BANDS: the player band and the enemy
   band never overlap, and each skin declares which hues they are. Picnic deliberately
   inverts them (warm ketchup shots, cool enemy fire) and is still legible for exactly the
   same reason space is. bandOf() below makes that testable rather than conventional. */

let skinKey = 'space';
function skin(){ return SKIN[skinKey]; }

const PAL = Object.assign({}, SKIN.space.pal);

/* Which band a colour belongs to. Used by the verification pass to prove no player-owned
   draw borrows an enemy colour or vice versa — the failure Phase 5 had to clean up. */
function bandOf(c){
  if (!c) return 'neutral';
  for (const k of PLAYER_KEYS) if (PAL[k]===c) return 'player';
  for (const k of ENEMY_KEYS)  if (PAL[k]===c) return 'enemy';
  return 'neutral';
}
/* Semantic fills, so a skin can restyle every hull and every hit-flash at once instead of
   the ~50 hardcoded literals these replace. */
function hullFill(a){ const c=PAL.foeDark; return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function flashFill(a){ const c=PAL.flash; return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

/* The HUD, veils and buttons are DOM, driven by CSS custom properties — so a skin restyles
   the whole chrome by setting them, with no markup changes. */
const SKIN_CSS = {
  space:  { void:'#04070f', ink:'#e8f6f2', dim:'#7c9a97',
            jade:'#6ffbc0', rose:'#ff5aa8', amber:'#ffc978' },
  picnic: { void:'#8eb27e', ink:'#3d2b1f', dim:'#6b5442',
            jade:'#ff8f6b', rose:'#7ec4d6', amber:'#ffd45c' }
};
/* ---- the art layer (#22) ------------------------------------------------------
   Skins swap SHAPES, not just colours — a ketchup bottle is not a recoloured arrow. ART holds
   per-skin overrides; anything a skin hasn't drawn yet falls back to the space art, which is
   what lets the food land in batches while the game stays playable throughout. */
const ART = { space:{}, picnic:{} };
function art(kind,key){
  const a = ART[skinKey] && ART[skinKey][kind];
  if (!a) return null;
  return key===undefined ? a : (a[key] || null);   /* 'ship' is a fn; 'enemy' is a table */
}
function artFn(kind,key,fallback){ return art(kind,key) || fallback; }

/* Semi-3D on a 2D canvas: one light from the top-left, a soft drop shadow, a body gradient
   and a rim gloss. Doing that per entity per frame would not hold 60fps on mobile — 30+
   entities each building gradients every frame is exactly the cost the quality scaler exists
   to shed — so a picnic entity is rendered ONCE into an offscreen canvas and blitted after. */
const spriteCache = new Map();
function sprite(key, w, h, paint){
  const ck = skinKey+':'+key+':'+w+'x'+h+':'+qLevel;
  let c = spriteCache.get(ck);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = Math.ceil(w*DPR); c.height = Math.ceil(h*DPR);
  const g = c.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  g.translate(w/2, h/2);
  paint(g, w, h);
  spriteCache.set(ck, c);
  return c;
}
function blitSprite(c, x, y, w, h, rot){
  /* force source-over: several draw paths set 'lighter' for their own glow effects, and an
     additively-blended sprite blows straight out to white */
  ctx.save(); ctx.globalCompositeOperation='source-over';
  ctx.translate(x,y); if (rot) ctx.rotate(rot);
  ctx.drawImage(c, -w/2, -h/2, w, h);
  ctx.restore();
}
/* the shared look, so 65 draw functions agree instead of each inventing a style */
function softShadow(g, r){
  if (qLevel < 1) return;                       /* first thing to go on a weak device */
  g.save();
  g.fillStyle = 'rgba(40,30,20,.22)';
  g.beginPath(); g.ellipse(r*.16, r*.30, r*.92, r*.42, 0, 0, TAU); g.fill();
  g.restore();
}
function roundBody(g, r, col, dark){
  const grd = g.createRadialGradient(-r*.34,-r*.40,r*.10, 0,0,r*1.12);
  grd.addColorStop(0, rgba(col,1));
  grd.addColorStop(.62, rgba(col,1));
  grd.addColorStop(1, rgba(dark||col,1));
  g.fillStyle = grd;
}
function gloss(g, r, a){
  if (qLevel < 2) return;                       /* the rim highlight is the cheapest thing to drop */
  g.save(); g.globalCompositeOperation='lighter';
  const grd = g.createRadialGradient(-r*.38,-r*.46,0, -r*.38,-r*.46, r*.72);
  grd.addColorStop(0,'rgba(255,255,255,'+(a||.5)+')'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.beginPath(); g.ellipse(-r*.30,-r*.38,r*.56,r*.40,-.5,0,TAU); g.fill();
  g.restore();
}
function outline(g, a){ g.strokeStyle='rgba(74,52,38,'+(a||.55)+')'; g.lineWidth=2; g.stroke(); }

/* ---- picnic: the player ------------------------------------------------------ */
ART.picnic.ship = function(){
  const blink = P.inv>0 && Math.floor(P.inv*14)%2===0;
  if (!blink){
    /* the bottle squeezes as it fires: fireT counts down to the next shot, so it is nearly
       zero at the moment of the squeeze */
    const sq = clamp(1 - P.fireT/0.12, 0, 1);
    const w = 34*(1+sq*.10), h = 52*(1-sq*.07);
    const c = sprite('ketchup', 46, 62, (g)=>{
      softShadow(g, 20);
      /* cap */
      g.beginPath(); g.roundRect(-7,-30,14,9,3); g.fillStyle=rgba(PAL.crystal,1); g.fill(); outline(g,.45);
      /* neck */
      g.beginPath(); g.moveTo(-6,-22); g.lineTo(6,-22); g.lineTo(8,-13); g.lineTo(-8,-13); g.closePath();
      g.fillStyle=rgba(PAL.hull,1); g.fill(); outline(g,.35);
      /* body */
      g.beginPath(); g.moveTo(-13,-13); g.quadraticCurveTo(-17,-4,-16,12);
      g.quadraticCurveTo(-15,25,0,25); g.quadraticCurveTo(15,25,16,12);
      g.quadraticCurveTo(17,-4,13,-13); g.closePath();
      roundBody(g, 18, PAL.hull, [214,196,178]); g.fill(); outline(g,.5);
      /* label */
      g.beginPath(); g.roundRect(-11,-2,22,15,4); g.fillStyle=rgba(PAL.bolt,1); g.fill();
      g.beginPath(); g.roundRect(-7,2,14,3,1.5); g.fillStyle='rgba(255,255,255,.75)'; g.fill();
      gloss(g, 18, .55);
    });
    blitSprite(c, P.x, P.y, w*1.35, h*1.19, P.tilt*.35);
    addGlow(P.x, P.y-6, 16, PAL.bolt, .2);
  }
};
/* ketchup blobs: round, wobbling, with a highlight — never the cool bolt of the space skin */
ART.picnic.pbullet = function(b){
  const r = b.r*1.9;
  const c = sprite(b.homing?'mayo':'blob', 18, 18, (g)=>{
    const col = b.homing ? PAL.missile : PAL.bolt;
    g.beginPath(); g.ellipse(0,0,6.6,6.0,0,0,TAU);
    roundBody(g, 7, col, b.homing?[214,168,60]:[186,44,36]); g.fill();
    gloss(g, 7, .7);
  });
  blitSprite(c, b.x, b.y, r*1.5, r*1.5, b.t*3);
  addGlow(b.x, b.y, r*1.1, b.homing?PAL.missile:PAL.bolt, .22);
};
ART.picnic.drone = function(d){
  const c = sprite('mustard', 22, 22, (g)=>{
    softShadow(g, 8);
    g.beginPath(); g.ellipse(0,0,8,7,0,0,TAU);
    roundBody(g, 8, PAL.drone, [206,150,40]); g.fill(); outline(g,.4);
    gloss(g, 8, .6);
  });
  blitSprite(c, d.x, d.y, 20, 20, d.drawA+Math.PI/2);
  addGlow(d.x,d.y,11,PAL.drone,.22);
};
/* sprinkles, not crystals */
ART.picnic.crystal = function(p,pulse){
  const c = sprite('sprinkle', 16, 16, (g)=>{
    g.beginPath(); g.roundRect(-5,-2,10,4,2);
    g.fillStyle=rgba(PAL.crystal,1); g.fill(); outline(g,.35);
    gloss(g, 5, .5);
  });
  blitSprite(c, p.x, p.y, 13*pulse, 13*pulse, p.t*2.6);
  addGlow(p.x,p.y,9,PAL.crystal,.3);
};

/* ---- picnic: the world ---------------------------------------------------------
   The blanket is one tile painted once and repeated, scrolled on the same scrollY the
   starfield used — so it costs a single pattern fill per frame rather than a grid of rects. */
let blanketPat = null;
function blanketPattern(){
  if (blanketPat) return blanketPat;
  const T = 96, c = document.createElement('canvas');
  c.width = c.height = T;
  const g = c.getContext('2d');
  const base = PAL.void, band = PAL.neb[0], band2 = PAL.neb[1];
  g.fillStyle = rgba(base,1); g.fillRect(0,0,T,T);
  /* gingham: two translucent bands crossing, so the overlap reads darker on its own */
  g.fillStyle = rgba(band,.55); g.fillRect(0,0,T/2,T);
  g.fillStyle = rgba(band2,.45); g.fillRect(0,0,T,T/2);
  /* weave texture */
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1;
  for (let i=0;i<T;i+=6){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,T); g.stroke(); }
  blanketPat = ctx.createPattern(c,'repeat');
  return blanketPat;
}
let sunPat = null, sunW = 0, sunH = 0;
ART.picnic.background = function(dt){
  const pat = blanketPattern();
  ctx.save();
  ctx.translate(0, (scrollY*.5) % 96);
  ctx.fillStyle = pat;
  /* the offset is always inside [0,96), so starting one tile high and painting H+120 covers
     the viewport with margin to spare. The original H+192 from -96 painted about 1.4 screens
     of cloth per frame, most of it off the bottom edge and invisible. */
  ctx.fillRect(0, -96, W, H+120);
  ctx.restore();
  /* a soft sunlit falloff so the blanket has some depth rather than reading flat.
     It depends only on the viewport, so building it per frame was pure waste — a full-screen
     radial gradient rebuilt 60 times a second was most of picnic's background cost. */
  if (!sunPat || sunW !== W || sunH !== H){
    sunW = W; sunH = H;
    sunPat = ctx.createRadialGradient(W*.5,H*.18,0, W*.5,H*.18, Math.max(W,H)*.9);
    sunPat.addColorStop(0,'rgba(255,248,214,.20)'); sunPat.addColorStop(1,'rgba(60,80,50,.22)');
  }
  ctx.fillStyle=sunPat; ctx.fillRect(0,0,W,H);
};
/* crumbs and ants instead of stars — same data, different read */
ART.picnic.stars = function(dt){
  const spd = state==='playing' ? 1 : .35;
  /* Two colours over a few hundred motes, so this batches: advance everything in one pass,
     then lay down two paths and two fills. Per-mote fillStyle + beginPath meant a colour
     string built and a path object allocated several hundred times a frame. */
  ctx.beginPath();
  for (let l=0;l<3;l++) for (const st of stars[l]){
    st.y += st.s*dt*spd; if (st.y>H){ st.y=-4; st.x=frnd(0,W); }
    if (st.r>1.0) continue;
    ctx.moveTo(st.x+st.r*.8, st.y);
    ctx.arc(st.x,st.y,st.r*.8,0,TAU);
  }
  ctx.fillStyle = rgba(PAL.star,.5); ctx.fill();

  ctx.beginPath();
  for (let l=0;l<3;l++) for (const st of stars[l]){
    if (st.r<=1.0) continue;
    /* moveTo first: ellipse() joins to the current point, which would web the crumbs together */
    ctx.moveTo(st.x+Math.cos(st.tw)*st.r*1.5, st.y+Math.sin(st.tw)*st.r*1.5);
    ctx.ellipse(st.x,st.y,st.r*1.5,st.r*1.1,st.tw,0,TAU);
  }
  ctx.fillStyle = 'rgba(122,86,54,.55)'; ctx.fill();
};

/* ---- picnic: the hazards ------------------------------------------------------
   Each of these reads exactly the state its space counterpart reads and draws the same
   silhouette in the same place, so the tell, the timing and the safe gap are unchanged —
   only the noun differs. Nothing here may mutate simulation state or draw from the seeded
   stream: these run on the render path. */
ART.picnic.hazard = {

  /* 2 · paper plates and pie crusts, tumbling. The scalloped edge follows the same points the
     space wreck used, so the shape you learn to dodge is the shape that hits you. */
  wrecks:{ drawBack(){
    for (const k of this.items){
      ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.rot);
      ctx.beginPath(); ctx.moveTo(k.pts[0][0],k.pts[0][1]);
      for (let i=1;i<k.pts.length;i++) ctx.lineTo(k.pts[i][0],k.pts[i][1]);
      ctx.closePath();
      const g = ctx.createRadialGradient(-k.sc*.3,-k.sc*.35,k.sc*.1, 0,0,k.sc*1.1);
      g.addColorStop(0,'rgba(252,246,232,1)'); g.addColorStop(.68,'rgba(238,224,196,1)');
      g.addColorStop(1,rgba(PAL.foeDark,1));
      ctx.fillStyle=g; ctx.fill();
      ctx.strokeStyle=rgba(PAL.foe,.7); ctx.lineWidth=2.5; ctx.stroke();
      /* the well of the plate */
      ctx.beginPath(); ctx.arc(0,0,k.sc*.52,0,TAU);
      ctx.fillStyle='rgba(214,196,166,.5)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.restore();
      addGlow(k.x,k.y,k.sc*.5,PAL.foe,.10);
    }
  }},

  /* 3 · shaken fizzy drinks. Dashed bubbles while it builds, a hard spray column when it goes. */
  columns:{ drawFront(){
    for (const c of this.cols){
      if (c.phase==='warn'){
        const a = .30+Math.sin(c.t*40)*.2;
        ctx.strokeStyle=rgba(PAL.elaser,a); ctx.lineWidth=2; ctx.setLineDash([4,12]);
        ctx.beginPath(); ctx.moveTo(c.x,0); ctx.lineTo(c.x,H); ctx.stroke(); ctx.setLineDash([]);
        /* bubbles gathering — decoration, so it is the first thing to go on a weak device */
        if (qLevel >= 1){
          ctx.fillStyle=rgba(PAL.elaser,a*.9);
          for (let i=0;i<7;i++){ const y=(c.t*220+i*97)%H;
            ctx.beginPath(); ctx.arc(c.x+Math.sin(y*.05+i)*7, y, 1.5+ (i%3), 0, TAU); ctx.fill(); }
        }
      } else if (c.phase==='fire'){
        const g = ctx.createLinearGradient(c.x-30,0,c.x+30,0);
        g.addColorStop(0,rgba(PAL.elaser,0)); g.addColorStop(.5,rgba(PAL.elaser,.8)); g.addColorStop(1,rgba(PAL.elaser,0));
        ctx.fillStyle=g; ctx.fillRect(c.x-30,0,60,H);
        ctx.fillStyle='rgba(255,255,255,.78)'; ctx.fillRect(c.x-4,0,8,H);
        /* froth riding the jet — the column itself is the tell, so this thins rather than
           disappears: the player must still read the jet at every quality level */
        const n = qLevel>=2 ? 14 : qLevel===1 ? 7 : 0;
        ctx.fillStyle='rgba(255,255,255,.5)';
        for (let i=0;i<n;i++){ const y=(c.t*760+i*61)%H, r=2+((i*7)%4);
          ctx.beginPath(); ctx.arc(c.x+Math.sin(y*.09+i)*14, y, r, 0, TAU); ctx.fill(); }
        addGlow(c.x,H*.5,80,PAL.elaser,.45);
      }
    }
  }},

  /* 4 · striped paper straws spinning between two cups */
  beams:{ drawBack(){
    for (const b of this.bars){
      const cx=W/2, cy=b.y, dx=Math.cos(b.a)*b.len, dy=Math.sin(b.a)*b.len;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(b.a);
      ctx.lineCap='round';
      ctx.strokeStyle=rgba(PAL.foeDark,.5); ctx.lineWidth=9;
      ctx.beginPath(); ctx.moveTo(-b.len,2.5); ctx.lineTo(b.len,2.5); ctx.stroke();
      ctx.strokeStyle='rgba(252,248,240,.96)'; ctx.lineWidth=8;
      ctx.beginPath(); ctx.moveTo(-b.len,0); ctx.lineTo(b.len,0); ctx.stroke();
      /* the stripes — the wrap is what makes it read as a straw rather than a rod */
      ctx.strokeStyle=rgba(PAL.elaser,.95); ctx.lineWidth=4;
      for (let x=-b.len; x<b.len; x+=16){
        ctx.beginPath(); ctx.moveTo(x,-4); ctx.lineTo(x+7,4); ctx.stroke();
      }
      ctx.lineCap='butt'; ctx.restore();
      /* the cups it is strung between */
      for (const s of [-1,1]){
        const ex=cx+dx*s, ey=cy+dy*s;
        ctx.save(); ctx.translate(ex,ey);
        ctx.beginPath(); ctx.moveTo(-11,-11); ctx.lineTo(9,-11); ctx.lineTo(6,11); ctx.lineTo(-8,11); ctx.closePath();
        const g=ctx.createLinearGradient(-11,0,9,0);
        g.addColorStop(0,rgba(PAL.foe,1)); g.addColorStop(1,rgba(PAL.foeDark,1));
        ctx.fillStyle=g; ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.30)'; ctx.fillRect(-9,-9,4,18);
        ctx.restore();
        addGlow(ex,ey,18,PAL.elaser,.4);
      }
    }
  }},

  /* 5 · dusk falls on the picnic and the bottle becomes the only lantern */
  dark:{
    drawBack(){
      for (const m of this.motes){
        /* pollen drifting in the last light */
        ctx.fillStyle=rgba(PAL.star,.18+Math.sin(m.tw)*.14);
        ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill();
      }
    },
    drawFront(){
      const lit = 138 + P.mods.power*9 + (P.shield>0?26:0);
      const g = ctx.createRadialGradient(P.x,P.y,lit*.42,P.x,P.y,lit*2.5);
      /* warm dusk rather than cold void — the shape and radius are identical */
      g.addColorStop(0,'rgba(28,20,14,0)');
      g.addColorStop(.55,'rgba(30,22,16,.70)');
      g.addColorStop(1,'rgba(22,16,12,.93)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      /* the lantern's own warm pool, so the light reads as coming from the bottle */
      if (qLevel >= 1){
        const w = ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,lit*.9);
        w.addColorStop(0,'rgba(255,214,150,.16)'); w.addColorStop(1,'rgba(255,214,150,0)');
        ctx.fillStyle=w; ctx.fillRect(0,0,W,H);
      }
    }
  },

  /* 7 · a gust takes the napkins and the dandelion fluff with it */
  ashwind:{ drawFront(){
    const gu = this.gust;
    for (const m of this.motes){
      if (m.r > 2.1){
        /* a napkin: it streaks with the gust, which is the tell for which way you're being shoved */
        ctx.fillStyle='rgba(252,246,236,'+(.16+gu*.5)+')';
        ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(this.dir*gu*.7);
        ctx.fillRect(0,0,m.r*(1+gu*5), m.r*2.2);
        ctx.restore();
      } else {
        ctx.fillStyle=rgba(PAL.star,.20+gu*.4);
        ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill();
      }
    }
    if (gu>.02){
      /* dust kicked off the blanket, warm not smoky */
      ctx.fillStyle='rgba(190,168,132,'+(gu*.26)+')'; ctx.fillRect(0,0,W,H);
    }
  }},

  /* 8 · celery and asparagus growing in from both edges */
  coral:{ drawBack(){
    for (const sp of this.spurs){
      const x0 = sp.side? W : 0, dir = sp.side? -1 : 1;
      ctx.save(); ctx.translate(x0,sp.y);
      ctx.beginPath(); ctx.moveTo(0,-13);
      ctx.quadraticCurveTo(dir*sp.len*.6,-9, dir*sp.len,0);
      ctx.quadraticCurveTo(dir*sp.len*.6,9, 0,13); ctx.closePath();
      const g = ctx.createLinearGradient(0,-13,0,13);
      g.addColorStop(0,rgba(PAL.foe,1)); g.addColorStop(.5,'rgba(206,226,180,1)'); g.addColorStop(1,rgba(PAL.foeDark,1));
      ctx.fillStyle=g; ctx.fill();
      ctx.strokeStyle=rgba(PAL.foeDark,.7); ctx.lineWidth=2; ctx.stroke();
      /* the ribs of the stalk */
      ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1.5;
      for (const o of [-6,0,6]){
        ctx.beginPath(); ctx.moveTo(dir*4,o); ctx.lineTo(dir*(sp.len-4),o*.35); ctx.stroke();
      }
      /* the tip, where the bud is */
      ctx.beginPath(); ctx.ellipse(dir*sp.len,0,7,9,0,0,TAU);
      ctx.fillStyle=rgba(PAL.elaser,.9); ctx.fill();
      ctx.restore();
      addGlow(x0+dir*sp.len,sp.y,24,PAL.foe,.4);
    }
  }},

  /* 9 · waves of spilled lemonade rolling down, one dry gap in each */
  resonance:{ drawFront(){
    for (const w of this.waves){
      for (const seg of [[0,w.gap-w.gw],[w.gap+w.gw,W]]){
        const x0=seg[0], x1=seg[1];
        if (x1<=x0) continue;
        const g = ctx.createLinearGradient(0,w.y-9,0,w.y+9);
        g.addColorStop(0,rgba(PAL.elaser,0)); g.addColorStop(.5,rgba(PAL.elaser,.8)); g.addColorStop(1,rgba(PAL.elaser,0));
        ctx.fillStyle=g; ctx.fillRect(x0,w.y-9,x1-x0,18);
        /* the leading edge, foamed — this is the line you actually read */
        ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2;
        ctx.beginPath();
        for (let x=x0; x<=x1; x+=12) ctx.lineTo(x, w.y-3+Math.sin(x*.09+w.y*.05)*2.2);
        ctx.stroke();
      }
      addGlow(w.gap-w.gw,w.y,28,PAL.elaser,.45); addGlow(w.gap+w.gw,w.y,28,PAL.elaser,.45);
    }
  }},

  /* 10 · syrup spreading on the cloth, and it pulls */
  wells:{ drawBack(){
    for (const w of this.items){
      ctx.save();
      /* the puddle body — darkest at the centre, which is where the pull is strongest */
      const g = ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.r);
      g.addColorStop(0,rgba(PAL.boss,.42)); g.addColorStop(.6,rgba(PAL.boss,.16)); g.addColorStop(1,rgba(PAL.boss,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,TAU); ctx.fill();
      /* spreading rims */
      for (let i=1;i<=4;i++){
        ctx.strokeStyle=rgba(PAL.elaser,.10*i);
        ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(w.x,w.y,w.r*i/4 + Math.sin(w.p*3+i)*4,0,TAU); ctx.stroke();
      }
      /* the swirl, turning the way the well turns */
      ctx.strokeStyle=rgba(PAL.boss,.35); ctx.lineWidth=3; ctx.beginPath();
      for (let t=0;t<7;t+=.12){
        const a=t*1.4 + w.p*w.s*2, rr=t*w.r*.055;
        const x=w.x+Math.cos(a)*rr, y=w.y+Math.sin(a)*rr;
        t?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
      ctx.restore();
      addGlow(w.x,w.y,50,PAL.boss,.22);
    }
  }},

  /* 11 · the hamper lid closing on you from both sides */
  systole:{ drawFront(){
    const band = (this.squeeze||0) * W*.3;
    if (band<1) return;
    for (const s of [0,1]){
      ctx.save();
      if (s){ ctx.translate(W,0); ctx.scale(-1,1); }
      const g = ctx.createLinearGradient(0,0,band,0);
      g.addColorStop(0,rgba(PAL.foeDark,.95)); g.addColorStop(.72,rgba(PAL.ebullet,.5)); g.addColorStop(1,rgba(PAL.ebullet,0));
      ctx.fillStyle=g; ctx.fillRect(0,0,band,H);
      /* wicker weave on the advancing wall, so the squeeze reads as a lid and not a fog */
      ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2;
      for (let y=0;y<H;y+=18){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(band,y+6); ctx.stroke(); }
      /* the hard edge — the thing that actually hurts */
      ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(band-2,0,2,H);
      ctx.restore();
    }
  }},

  /* 12 · cutlery, and it bounces whatever hits it */
  shards:{ drawBack(){
    for (const k of this.items){
      ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.a);
      const L=k.len*.5;
      /* handle */
      ctx.beginPath(); ctx.roundRect(-L,-3.5,L*.7,7,3);
      ctx.fillStyle=rgba(PAL.foeDark,1); ctx.fill();
      /* blade */
      ctx.beginPath();
      ctx.moveTo(-L*.3,-4.5); ctx.lineTo(L*.85,-3.2);
      ctx.quadraticCurveTo(L,0, L*.85,3.8); ctx.lineTo(-L*.3,4.5); ctx.closePath();
      const g = ctx.createLinearGradient(0,-5,0,5);
      g.addColorStop(0,rgba(PAL.elaser,1)); g.addColorStop(.45,'rgba(255,255,255,1)'); g.addColorStop(1,rgba(PAL.foe,1));
      ctx.fillStyle=g; ctx.fill();
      /* the specular travelling along the blade — the cue that this thing reflects */
      if (qLevel >= 1){
        const t = (k.a*3)%1;
        ctx.fillStyle='rgba(255,255,255,.8)';
        ctx.fillRect(-L*.3 + t*L*1.1, -4, 5, 8);
      }
      ctx.strokeStyle=rgba(PAL.foeDark,.45); ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
      addGlow(k.x,k.y,k.len*.4,PAL.elaser,.22);
    }
  }}
};

function applySkin(key){
  if (!SKIN[key]) key = 'space';
  skinKey = key;
  Object.assign(PAL, SKIN[key].pal);
  applyPalette(typeof levelIdx==='number' ? levelIdx : 0);   /* re-layer the sector variant */
  const css = SKIN_CSS[key], root = document.documentElement;
  for (const k in css) root.style.setProperty('--'+k, css[k]);
  spriteCache.clear(); blanketPat = null;   /* both are baked per skin */
  skinHazard(hazard);                        /* re-point the drawing, keep the hazard's state */
  /* applyPalette above already rebuilt the nebula and starfield, and nothing else here
     is baked at boot — so this is safe to call mid-fight */
}
function applyPalette(i){
  /* sector variants belong to the skin: space has twelve, and a skin with none simply keeps
     its own base palette rather than borrowing space's greens */
  const sk = SKIN[skinKey];
  const p = (sk.sectors && sk.sectors[i]) || (skinKey==='space' ? PALETTES[i] : sk.pal);
  PAL.neb=p.neb; PAL.star=p.star; PAL.foe=p.foe; PAL.foeDark=p.foeDark;
  PAL.ebullet=p.ebullet; PAL.elaser=p.elaser; PAL.boss=p.boss; PAL.dust=p.dust;
  /* `void` is optional and background-only — space's twelve don't set it, picnic's twelve do,
     because the cloth is where picnic carries its sector identity. */
  if (p.void) PAL.void = p.void; else PAL.void = sk.pal.void;
  buildNebula(); buildStars();
  /* Both of these bake the palette in, and until now only applySkin cleared them — so every
     sector after the first kept sector one's cloth and sector one's sprite shading. Harmless
     while the cache held one ship; wrong the moment 21 enemies land in it. Sector changes
     happen twelve times a run, so rebuilding is free. */
  blanketPat = null; spriteCache.clear();
}

const MODES = [
  { roots:[110,87.31,130.81,98],     chords:[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,392]],
    scale:[440,523.25,587.33,659.25,783.99], swing:1,  drums:1 },

    scale:[293.66,349.23,392,466.16,523.25], swing:1.2, drums:1.15 },
  { roots:[82.41,103.83,87.31,61.74],chords:[[164.81,196,246.94],[207.65,261.63,311.13],[174.61,220,277.18],[123.47,155.56,196]],
    scale:[329.63,392,415.3,493.88,587.33], swing:.9, drums:1.3 },
  { roots:[65.41,73.42,98,87.31],    chords:[[130.81,146.83,196],[146.83,164.81,220],[196,220,293.66],[174.61,196,261.63]],
    scale:[523.25,587.33,659.25,739.99,880], swing:1, drums:.8 },
  { roots:[87.31,69.3,103.83,77.78], chords:[[174.61,207.65,261.63],[138.59,164.81,207.65],[207.65,246.94,311.13],[155.56,185,233.08]],
    scale:[349.23,415.3,466.16,554.37,622.25], swing:1.5, drums:.5 },
  { roots:[130.81,98,110,87.31],     chords:[[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63]],
    scale:[523.25,659.25,783.99,880,1046.5], swing:.85, drums:1.2 }

const Sound = {
  ac:null, master:null, mGain:null, sGain:null, ready:false, muted:false,
  intensity:0, targetIntensity:0, beat:0, next:0, mode:0,
  init(){
    if (this.ready) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = this.muted?0:.9; this.master.connect(this.ac.destination);
    this.mGain = this.ac.createGain(); this.mGain.gain.value = .32; this.mGain.connect(this.master);
    this.sGain = this.ac.createGain(); this.sGain.gain.value = .55; this.sGain.connect(this.master);
    this.ready = true; this.next = this.ac.currentTime + .1;
    setInterval(()=>this.schedule(), 25);
  },
  resume(){ if (this.ac && this.ac.state==='suspended') this.ac.resume(); },
  setMuted(m){ this.muted=m; if (this.master) this.master.gain.value = m?0:.9; },
  /* PALETTES was extended to twelve sectors but MODES never was, so setMode(6..11) left
     MODES[this.mode] undefined and schedule() threw every 25ms — the whole second campaign
     has been playing in silence. Wrap until campaign two gets its own six modes. */
  setMode(i){ this.mode = i % MODES.length; },
  schedule(){
    if (!this.ready) return;
    const M = MODES[this.mode], spb = 60/96/2*M.swing;
    this.intensity += (this.targetIntensity - this.intensity)*.04;
    while (this.next < this.ac.currentTime + .15){
      const b = this.beat, bar = Math.floor(b/8)%4, t = this.next;
      if (b%8===0) this.pad(M.chords[bar], t, spb*8);
      if (b%2===0) this.bass(M.roots[bar], t);
      if (b%4===0 && M.drums>.6) this.kick(t);
      if (this.intensity>.25 && b%2===1) this.hat(t, .05*this.intensity*M.drums);
      if (this.intensity>.4) this.arp(M.scale[(b*3)%M.scale.length]*(b%16<8?1:1.5), t, .085*this.intensity);
      this.next += spb; this.beat++;
    }
  },
  pad(freqs,t,dur){
    const g=this.ac.createGain(), f=this.ac.createBiquadFilter();
    g.gain.value=0; f.type='lowpass'; f.frequency.value=680+this.intensity*950;
    g.connect(f); f.connect(this.mGain);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.9); g.gain.linearRampToValueAtTime(0,t+dur);
    freqs.forEach((fr,i)=>[-4,4].forEach(d=>{
      const o=this.ac.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.detune.value=d+i*2;
      o.connect(g); o.start(t); o.stop(t+dur+.05);
    }));
  },
  bass(fr,t){ const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='triangle'; o.frequency.value=fr; o.connect(g); g.connect(this.mGain);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.start(t); o.stop(t+.35); },
  arp(fr,t,v){ const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='triangle'; o.frequency.value=fr; o.connect(g); g.connect(this.mGain);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.start(t); o.stop(t+.2); },
  kick(t){ const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(38,t+.11);
    g.gain.setValueAtTime(.48,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(g); g.connect(this.mGain); o.start(t); o.stop(t+.26); },
  hat(t,v){ const s=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    s.buffer=this.noiseBuf(); f.type='highpass'; f.frequency.value=7000;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
    s.connect(f); f.connect(g); g.connect(this.mGain); s.start(t); s.stop(t+.06); },
  _nb:null,
  noiseBuf(){ if (this._nb) return this._nb;
    const len=this.ac.sampleRate, b=this.ac.createBuffer(1,len,this.ac.sampleRate), d=b.getChannelData(0);
    /* _origRandom, not the seeded stream: this buffer is built lazily on the first explosion
       — i.e. whenever async audio init happens to finish — and it draws a full second of
       samples. Feeding it from the run's RNG shifted the seeded sequence by ~48k draws at a
       wall-clock-dependent moment, which desynchronised Daily Drift the instant anything
       exploded. Noise never needs to be reproducible. */
    for (let i=0;i<len;i++) d[i]=_origRandom()*2-1;
    this._nb=b; return b; },
  _lastShot:0,
  shot(){ if (!this.ready) return; const t=this.ac.currentTime;
    if (t-this._lastShot<.05) return; this._lastShot=t;
    const o=this.ac.createOscillator(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    o.type='square'; o.frequency.setValueAtTime(1250,t); o.frequency.exponentialRampToValueAtTime(420,t+.07);
    f.type='bandpass'; f.frequency.value=1500; f.Q.value=1.2;
    g.gain.setValueAtTime(.085,t); g.gain.exponentialRampToValueAtTime(.001,t+.08);
    o.connect(f); f.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.09); },
  boom(size){ if (!this.ready) return; const t=this.ac.currentTime;
    const s=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    s.buffer=this.noiseBuf(); f.type='lowpass';
    f.frequency.setValueAtTime(2400*size,t); f.frequency.exponentialRampToValueAtTime(120,t+.4*size);
    g.gain.setValueAtTime(.32*size,t); g.gain.exponentialRampToValueAtTime(.001,t+.5*size);
    s.connect(f); f.connect(g); g.connect(this.sGain); s.start(t); s.stop(t+.55*size); },
  pickup(){ if (!this.ready) return; const t=this.ac.currentTime;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(660,t); o.frequency.exponentialRampToValueAtTime(1320,t+.11);
    g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.18); },
  chime(n){ if (!this.ready) return; const t=this.ac.currentTime;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='triangle'; o.frequency.value=520*Math.pow(1.0595,n*2);
    g.gain.setValueAtTime(.11,t); g.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.26); },
  hurt(){ if (!this.ready) return; const t=this.ac.currentTime;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(60,t+.4);
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.45);
    o.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.46); },
  bombFx(){ if (!this.ready) return; const t=this.ac.currentTime;
    const s=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    s.buffer=this.noiseBuf(); f.type='lowpass';
    f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(6000,t+.25);
    f.frequency.exponentialRampToValueAtTime(200,t+.9);
    g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.001,t+1);
    s.connect(f); f.connect(g); g.connect(this.sGain); s.start(t); s.stop(t+1.05); },
  alarm(){ if (!this.ready) return; const t=this.ac.currentTime;
    for (let i=0;i<3;i++){ const o=this.ac.createOscillator(),g=this.ac.createGain();
      o.type='square'; o.frequency.value=220; const tt=t+i*.22;
      g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(.1,tt+.02); g.gain.exponentialRampToValueAtTime(.001,tt+.18);
      o.connect(g); g.connect(this.sGain); o.start(tt); o.stop(tt+.2); } },
  /* pin the music intensity for a while — used to cut to silence on a boss kill and then
     resolve upward, instead of the old deflate from 1 to .55 */
  holdT:0,
  hold(v,secs){ this.targetIntensity = v; this.holdT = secs; },
  /* a very quiet, rate-limited pip — grazing fires this constantly, so it has to sit under
     the mix rather than on top of it */
  _lastTick:0,
  tick(n){ if (!this.ready) return; const t=this.ac.currentTime;
    if (t-this._lastTick<.055) return; this._lastTick=t;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type='sine'; o.frequency.value=880*Math.pow(1.0595,n);
    g.gain.setValueAtTime(.035,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);
    o.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.08); },
  /* the victory sting: a rising run through the sector's own scale, so it resolves in key */
  fanfare(tier){ if (!this.ready) return;
    const t=this.ac.currentTime+.06, M=MODES[this.mode], sc=M.scale;
    const steps = tier>=2 ? 6 : tier>=1 ? 5 : 4, gap = .085;
    for (let i=0;i<steps;i++){
      const fr = sc[i%sc.length]*(i>=sc.length?2:1)*(i>=sc.length*2?2:1);
      const tt = t+i*gap;
      const o=this.ac.createOscillator(), g=this.ac.createGain();
      o.type='triangle'; o.frequency.value=fr*2;
      g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(.15,tt+.012);
      g.gain.exponentialRampToValueAtTime(.001,tt+.42);
      o.connect(g); g.connect(this.sGain); o.start(tt); o.stop(tt+.44);
    }
    /* a pad underneath the last note so the run lands on something */
    const tt=t+steps*gap;
    this.pad(M.chords[0].map(f=>f*2), tt, 1.6+tier*.4);
  }
};

/* ============================================================
   4 · background
   ============================================================ */
let stars = [[],[],[]];
function buildStars(){
  stars = [[],[],[]];
  const qf = qStar();
  const counts = [Math.round(W*H/9000*qf), Math.round(W*H/16000*qf), Math.round(W*H/30000*qf)];
  for (let l=0;l<3;l++)
    for (let i=0;i<counts[l];i++)
      /* frnd, not rnd: the starfield is pure decoration, and a skin switch rebuilds it
         mid-run — drawing from the seeded stream here would desync the simulation, which is
         exactly the promise a skin must never break */
      stars[l].push({ x:frnd(0,W), y:frnd(0,H), r:frnd(.4,1.1)+l*.35, s:(l+1)*(l+1)*7+10, tw:frnd(0,TAU) });
}
function buildNebula(){
  const s = 420;

/* ---- the power band (#20) ------------------------------------------------
   A fresh ship used to do ~7 DPS and a maxed one ~230 — a 30× swing against
   enemies whose HP never moved, so bosses evaporated before their first
   pattern. Three levers keep the band tight:
     · a strong base cannon, so a stripped ship is still a ship;
     · diminishing returns per mod level, so stacking curves off instead of

     · spread trades per-bullet damage for width rather than adding free DPS.
   Fresh ≈ 30 DPS, maxed Arcade ≈ 220 — a ~7× band instead of ~30×. */
const BASE_DMG = 3.0, BASE_RATE = 0.10, SPREAD_TAPER = 0.25, DRONE_DMG = 2.2;
/* each further level of a mod is worth `decay`× the one before it */
function modCurve(lv, first, decay){
  let total = 0, step = first;
  for (let i=0;i<lv;i++){ total += step; step *= decay; }

}
const powerBonus  = lv => modCurve(lv, .30, .68);
const rapidBonus  = lv => modCurve(lv, .22, .62);
/* shots fired per volley, and what each one is worth once the arc widens */
const volleyShots = (m,morShots) => 1 + m.spread + morShots;
const volleyShare = n => 1/(1 + SPREAD_TAPER*(n-1));

/* An estimate of the ship's damage output relative to a fresh hull — the input
   to elite/boss HP scaling below. Mirrors the cannon maths in updatePlayer. */
function loadoutPower(){
  const m = P.mods;
  const dmg = BASE_DMG*(1+powerBonus(m.power))*dmgPotential();
  const n = volleyShots(m,0);
  let perVolley = dmg*volleyShare(n)*n;                 /* main arc, all shots landing */
  if (m.power>=4) perVolley += dmg*.45*2;               /* the outboard pair */
  const rate = BASE_RATE/(1+rapidBonus(m.rapid));
  let dps = perVolley/rate;
  dps += drones.length*DRONE_DMG/.3;                    /* escorts chip in too */
  return Math.max(1, dps/(BASE_DMG/BASE_RATE));

/* 0..1 — how heavily kitted the ship is, on a log scale so the first pickups

}

  }

    const px = P.tx, py = P.ty;
    P.tx = clamp(P.tx, arena.x0, arena.x1); P.ty = clamp(P.ty, arena.y0, arena.y1);

  }

  P.fireT -= dt;

    P.fireT = rate;

    const morShots = P.focus ? 0 : Math.round(mor*2);  /* ...and wider — but Focus keeps it a tight stream (#12) */
    const n = volleyShots(m,morShots);

/* --- the bomb: a visible shockwave that sweeps the screen --- */
