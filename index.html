function dropPickup(x,y,kind){
  pickups.push({ x, y, vx:rnd(-40,40), vy:rnd(-70,-20), kind, t:0, r:kind==='crystal'?9:15, mag:false });
}
function spawnWreck(x,y,mod){
  pickups.push({ x, y, vx:rnd(-30,30), vy:rnd(-40,-10), kind:'wreck', mod, t:0, r:16, mag:false });
}
/* A running total for rapid crystal collection (#21). Individually each crystal scored
   quietly, so hoovering a boss's 16-crystal payout — the largest in the game — produced no
   number at all. Consecutive pickups now accumulate into one float that keeps climbing. */
let payoutF = null, payoutT = 0;
function bankPayout(v){
  payoutT = .9;
  if (payoutF && payoutF.life > 0){
    payoutF.to += v; payoutF.life = payoutF.max = Math.max(payoutF.life, .75);
    payoutF.x = P.x; payoutF.y = P.y - 34;
    return;
  }
  floatUp(P.x, P.y-34, v, PAL.crystal, { size:19, hold:.75, prefix:'+', count:false });
  payoutF = floats[floats.length-1];
  payoutF.num = v; payoutF.txt = '+' + v.toLocaleString();
  payoutF.cu = 0;
}
function updatePayout(dt){
  if (payoutT>0){ payoutT -= dt; if (payoutT<=0) payoutF = null; }
  if (payoutF){
    payoutF.x = lerp(payoutF.x, P.x, 1-Math.pow(.001,dt));
    payoutF.y = lerp(payoutF.y, P.y-34, 1-Math.pow(.001,dt));
    payoutF.num = payoutF.to;
    payoutF.txt = '+' + payoutF.to.toLocaleString();
  }
}
function collectPickup(p){
  if (p.kind==='crystal'){
    chain++; chainTimer = 2.6;
    recalcMult();
    cores++; addScore(25,p.x,p.y,true);
    Sound.chime(clamp(chain%12,0,11)); popMult();
    bankPayout(Math.round(25*mult));
  } else if (p.kind==='shield'){
    P.shield = Math.min(P.shieldMax,P.shield+1);
    floatText(p.x,p.y,'SHIELD',PAL.hull); Sound.pickup();
  } else if (p.kind==='bomb'){
    P.bombs = Math.min(5,P.bombs+1);
    floatText(p.x,p.y,'BOMB',PAL.missile); Sound.pickup();
    teach('bomb','You have bombs. Tap <b>BOMB</b> for a shockwave that wipes enemy fire into crystals.');
  } else if (p.kind==='wreck'){
    /* reclaim the upgrade you shed when you were hit (#19), plus a little Break back */
    if (p.mod && P.mods[p.mod] < MODMAX[p.mod]){ P.mods[p.mod]++; if (p.mod==='drones') syncDrones(); }
    P.od = Math.min(1,(P.od||0)+.3);
    floatText(p.x,p.y,'RECLAIMED',PAL.missile); Sound.pickup(); haptic(20); refreshHUD(true);
  } else {
    const m = P.mods;
    if (m[p.kind] < MODMAX[p.kind]){
      m[p.kind]++;
      floatText(p.x,p.y, MODNAME[p.kind]+' '+m[p.kind], PAL.pickup);
      if (p.kind==='drones'){ syncDrones();
        teach('form', DESKTOP?'Drones online — press <b>C</b> to change their formation.'
                             :'Drones online — tap <b>FORM</b> to change their formation.'); }
    } else { addScore(500,p.x,p.y); floatText(p.x,p.y,'+500',PAL.crystal); }
    Sound.pickup();
  }
  spark(p.x,p.y,PAL.crystal);
  refreshHUD();
}
function recalcMult(){ mult = Math.min(16, clamp(1+Math.floor(chain/8),1,8) + grazeMult);
  if (mult>peakMult) peakMult = mult; }
function onGraze(b){
  graze++; grazeStreak++; grazeTimer = 1.5;
  grazeMult = clamp(Math.floor(grazeStreak/10), 0, 8);
  if (grazeStreak>peakStreak) peakStreak = grazeStreak;
  recalcMult();
  score += 2*mult;
  /* proximity aura (#11): active grazing morphs the cannon wider & heavier */
  P.morphT = Math.min(1.2, (P.morphT||0) + .5);
  /* Break (#9): graze charges the meter (Overcharge relic fills faster) */
  if (P.odT<=0) P.od = Math.min(1, (P.od||0) + ((P.relics&&P.relics.surge)?.03:.015));
  spark(b.x,b.y,PAL.crystal);
  /* the highest-skill mechanic in the game used to be its quietest: nine grazes in ten made
     no sound at all. Every one now ticks, quietly, rising with the streak. */
  Sound.tick(clamp(grazeStreak%12,0,11));
  if (grazeStreak % 10 === 0){ Sound.chime(clamp(grazeStreak/10+3,0,11));
    floatText(P.x,P.y-30,'GRAZE ×'+grazeMult,PAL.crystal); popMult(); haptic(8); refreshHUD(); }
}
function addScore(v,x,y,quiet){
  score += Math.round(v*mult);
  if (!quiet && v>=100) floatText(x,y,'+'+Math.round(v*mult),PAL.star);
  refreshHUD();
}
function floatText(x,y,txt,col){
  floats.push({ x,y,txt,col,life:.9,max:.9,size:13,num:0,from:0,to:0,cu:0,prefix:'' });
}
/* A number that looks like what it's worth: scaled, held, and counting up. The old float was
   a fixed 13px, so a 60,000-point boss kill rendered exactly like a +500 pickup bonus. */
function floatUp(x,y,value,col,o){
  const hold=(o&&o.hold)||1.2;
  floats.push({ x,y, txt:'', col, life:hold, max:hold,
                size:(o&&o.size)||13, num:0, from:0, to:value,
                cu:(o&&o.count===false)?0:Math.min(.8,hold*.5), prefix:(o&&o.prefix)||'' });
}
function burst(x,y,n,col,sp){
  n = Math.min(n, qParts());
  for (let i=0;i<n;i++){ const a=frnd(0,TAU), s=frnd(sp*.16,sp);
    pPart({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:frnd(.25,.8), max:.8, r:frnd(1.4,4.4), c:col, g:60 }); }
  pPart({ x,y, vx:0, vy:0, life:.3, max:.3, r:n*1.1, c:col, g:0, ring:true });
}
function spark(x,y,col){
  for (let i=0;i<6;i++){ const a=frnd(0,TAU), s=frnd(30,170);
    pPart({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:frnd(.12,.3), max:.3, r:frnd(1,2.4), c:col, g:0 }); }
}

/* ============================================================
   12 · loop
   ============================================================ */
let last = 0, acc = 0;
const FIXED = 1/120;   /* the sim always advances in fixed steps → patterns are frame-rate independent */
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let real = clamp((ts-last)/1000, 0, 0.1);
  last = ts;

  /* adaptive quality — if the frame time creeps up, shed detail to hold the rate */
  frameEMA += ((real*1000) - frameEMA) * 0.05;
  if (qCooldown>0) qCooldown -= real;
  if (Settings.quality==='auto' && qCooldown<=0 && qLevel>0 && frameEMA>26){
    qLevel--; applyQuality(); frameEMA = 16; qCooldown = 3;
  }

  const sv = SPEEDS[speedIdx].v;
  if (state==='playing'){
    acc += real*sv;
    let steps = 0;
    while (acc >= FIXED && steps < 8){
      let dt = FIXED;
      if (hitstop>0){ hitstop -= dt; dt *= .12; }
      elapsed += dt; update(dt);
      acc -= FIXED; steps++;
    }
    if (steps>=8) acc = 0;   /* fell behind — drop the backlog rather than spiral */
    render(real*sv);
  } else {
    acc = 0;
    updateAmbient(real*sv);
    render(real*sv);
  }
}
function updateAmbient(dt){
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.g||0)*dt;
    if (p.life<=0){ partPool.push(p); swapDel(parts,i); }
  }
  shake *= Math.pow(.02,dt); flash *= Math.pow(.02,dt); whiteout *= Math.pow(.01,dt);
}

function update(dt){
  /* ---- Director: rank, effective velocity/cadence, beat clock (all deterministic) ---- */
  if (P.alive) rank = clamp(rank + dt*(0.008 + clamp(mult/16,0,1)*0.02), 0, 1);
  /* gear answers the build, rank answers the flying; a stripped ship gets relief
     that fades as the loadout fills, so the opening breathes and the late run bites */
  gear = gearPressure();
  const green = (1-gear)*GREEN_RELIEF;
  BV   = diff.bv   * (1 + rank*RANK_BV   + gear*GEAR_BV   - green);
  RATE = diff.rate * (1 + rank*RANK_RATE + gear*GEAR_RATE - green);
  { const nb = Math.floor(elapsed/BEAT_SEC); beatTick = (nb !== lastBeat); if (beatTick){ lastBeat = nb; beatCount++; } }

  runLevelScript(dt);
  updatePlayer(dt);
  updateShocks(dt);
  updateGroups(dt);
  updateGround(dt);
  if (hazard) hazard.update(dt);

  if (chain>0){ chainTimer -= dt; if (chainTimer<=0){ chain=0; recalcMult(); refreshHUD(); } }

  /* the off-screen despawn is not a death, but a tell owned by a gone enemy must still cancel */
  for (let i=enemies.length-1;i>=0;i--)
    if (!updateEnemy(enemies[i],dt)){ const e=enemies[i]; e.alive=false;
      if (e.shieldR>0) shieldCount--; enemies.splice(i,1); }
  if (boss) updateBoss(dt);

  /* player bullets */
  for (let i=pbullets.length-1;i>=0;i--){
    const b = pbullets[i];
    b.life -= dt;
    if (b.homing){
      let best=null, bd=1e9;
      for (const e of enemies){ const d=dist2(b.x,b.y,e.x,e.y); if (d<bd){ bd=d; best=e; } }
      if (boss && !boss.dying){ const d=dist2(b.x,b.y,boss.x,boss.y)*.6; if (d<bd){ bd=d; best=boss; } }
      if (best){
        const want=Math.atan2(best.y-b.y,best.x-b.x), cur=Math.atan2(b.vy,b.vx);
        let da=((want-cur+Math.PI*3)%TAU)-Math.PI;
        const na=cur+clamp(da,-4*dt,4*dt), sp=Math.min(560,Math.hypot(b.vx,b.vy)+520*dt);
        b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
      }
      b.trail -= dt;
      if (b.trail<=0){ b.trail=.02; parts.push({x:b.x,y:b.y,vx:0,vy:40,life:.28,max:.28,r:2.6,c:PAL.missile,g:0}); }
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.y<-30||b.y>H+30||b.x<-30||b.x>W+30||b.life<=0){ swapDel(pbullets,i); continue; }

    let gone = false;
    for (let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if (dist2(b.x,b.y,e.x,e.y) < (e.r+b.r)*(e.r+b.r)){
        /* the shield sends it back before anything else gets to look at it */
        if (e.type==='prism' && prismReflect(e,b)){ gone = true; break; }
        spark(b.x,b.y,PAL.bolt);
        damageEnemy(e, b.dmg*diff.dmg);
        if (b.pierce>0) b.pierce--; else gone = true;
        break;
      }
    }
    if (gone){ swapDel(pbullets,i); continue; }

    if (boss && !boss.dying){
      let hitPart = null, hit = false;
      for (const p of boss.parts){
        if (!p.alive) continue;
        if (dist2(b.x,b.y,p.x,p.y) < p.r*p.r){ hitPart = p; hit = true; break; }
      }
      if (!hit && dist2(b.x,b.y,boss.x,boss.y) < boss.r*boss.r) hit = true;
      if (hit){
        spark(b.x,b.y,PAL.crystal);
        damageBoss(b.dmg*diff.dmg, hitPart, Math.atan2(b.y-boss.y, b.x-boss.x));
        if (b.pierce>0) b.pierce--; else swapDel(pbullets,i);
      }
    }
  }

  /* enemy bullets */
  for (let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    /* hurtPlayer() clears every bullet within 180px when a life is lost, and it is called
       from inside this loop — so the array can shrink under us and leave i past the end. */
    if (!b) continue;
    b.t += dt; b.life -= dt;
    if (b.k || curveField) bulletKinetics(b,dt);
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.x<-50||b.x>W+50||b.y<-50||b.y>H+60||b.life<=0){ swapDel(ebullets,i); continue; }
    if (P.alive && P.inv<=0){
      const d2 = dist2(b.x,b.y,P.x,P.y), hitR = b.r*.7+P.r;
      if (d2 < hitR*hitR){ swapDel(ebullets,i); hurtPlayer(); continue; }
      const gr = b.r+P.r+GRAZE_R;
      if (!b.grazed && d2 < gr*gr){ b.grazed = true; onGraze(b); }
    }
  }
  if (grazeTimer>0){ grazeTimer -= dt; if (grazeTimer<=0){ grazeStreak=0; grazeMult=0; recalcMult(); } }

  updateWarns(dt);

  /* lances */
  for (let i=lasers.length-1;i>=0;i--){
    const l = lasers[i];
    if (l.warn>0){ l.warn -= dt; l.a += dt*.25; if (l.warn<=0) Sound.boom(.9); }
    else {
      l.live -= dt; l.a += dt*.55; l.w = Math.min(16,l.w+dt*70);
      if (P.alive && P.inv<=0){
        const dx=P.x-l.x, dy=P.y-l.y, proj=dx*Math.cos(l.a)+dy*Math.sin(l.a);
        if (proj>0 && Math.abs(-dx*Math.sin(l.a)+dy*Math.cos(l.a)) < l.w*.6+P.r) hurtPlayer();
      }
      if (l.live<=0) lasers.splice(i,1);
    }
  }

  /* bodies */
  if (P.alive && P.inv<=0){
    for (const e of enemies)
      if (dist2(e.x,e.y,P.x,P.y) < (e.r*.8+P.r)*(e.r*.8+P.r)){ damageEnemy(e,3); hurtPlayer(); break; }
    if (boss && !boss.dying){    /* a dying hull is scenery, not a hazard */
      if (dist2(boss.x,boss.y,P.x,P.y) < (boss.r*.85+P.r)*(boss.r*.85+P.r)) hurtPlayer();
      else for (const p of boss.parts)
        if (p.alive && dist2(p.x,p.y,P.x,P.y) < (p.r*.8+P.r)*(p.r*.8+P.r)){ hurtPlayer(); break; }
    }
  }

  /* pickups */
  const poc = P.alive && P.y < H*0.25;          /* point-of-collection (#18): the top vacuums everything */
  if (poc) teach('poc','The <b>top of the screen</b> vacuums every crystal — dive up to sweep them in.');
  const magnetR = (P.relics&&P.relics.well) ? Math.hypot(W,H) : 120 + chain*2;
  for (let i=pickups.length-1;i>=0;i--){
    const p = pickups[i]; p.t += dt;
    if (P.alive && (poc || dist2(p.x,p.y,P.x,P.y) < magnetR*magnetR)) p.mag = true;
    if (p.mag && P.alive){
      const a=Math.atan2(P.y-p.y,P.x-p.x), sp=260+p.t*160;
      p.vx=lerp(p.vx,Math.cos(a)*sp,.3); p.vy=lerp(p.vy,Math.sin(a)*sp,.3);
    } else { p.vy += 90*dt; p.vy = Math.min(p.vy,130); p.vx *= .98; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.y>H+40){ pickups.splice(i,1); continue; }
    if (P.alive && dist2(p.x,p.y,P.x,P.y) < (p.r+P.r+10)*(p.r+P.r+10)){ collectPickup(p); pickups.splice(i,1); }
  }

  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .985; p.vy = p.vy*.985 + (p.g||0)*dt;
    if (p.life<=0){ partPool.push(p); swapDel(parts,i); }
  }
  updatePayout(dt);
  for (let i=floats.length-1;i>=0;i--){ const f=floats[i];
    f.life -= dt; f.y -= dt*(f.size>20?14:38);        /* big numbers hang rather than fly off */
    if (f.cu){ const el=f.max-f.life;
      f.num = el>=f.cu ? f.to : Math.round(f.to*(el/f.cu));
      f.txt = f.prefix + f.num.toLocaleString(); }
    if (f.life<=0) swapDel(floats,i); }

  shake *= Math.pow(.02,dt); flash *= Math.pow(.02,dt); whiteout *= Math.pow(.005,dt);

  if (P.alive && fchance(dt*90))
    parts.push({ x:P.x+frnd(-4,4), y:P.y+13, vx:frnd(-16,16), vy:frnd(120,220), life:.3, max:.3, r:frnd(1.6,3.4), c:PAL.bolt, g:0 });

  /* a held value (the boss-death silence, then the resolve) outranks the per-frame recompute */
  if (Sound.holdT > 0) Sound.holdT -= dt;
  else Sound.targetIntensity = (boss && !boss.dying) ? 1 : clamp(.2+enemies.length*.09+chain*.01,.15,.9);
}

/* ============================================================
   13 · render
   ============================================================ */
let glows = [], scrollY = 0, vigKey = '', vignette = null;
function addGlow(x,y,r,c,a){ glows.push({x,y,r,c,a:a===undefined?1:a}); }

function render(dt){
  glows.length = 0;
  scrollY += dt*(state==='playing'?46:16);
  const shk = shake * Settings.shake;
  const sx = shk>.2 ? rnd(-shk,shk)*.5 : 0;
  const sy = shk>.2 ? rnd(-shk,shk)*.5 : 0;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = rgba(PAL.void,1); ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(sx,sy);

  const bg = art('background'), st = art('stars');
  if (bg) bg(dt); else drawNebula();
  if (st) st(dt); else drawStars(dt);
  drawDebrisLayer(dt);
  if (hazard && state!=='title') hazard.drawBack();

  if (state !== 'title'){
    drawGroundPlane(dt);
    drawGround();
    drawPickups(); drawParticles(); drawEnemies();
    if (boss){ drawPullField(); drawArena(); drawBoss(); }
    drawWarns(); drawLasers(); drawShocks(); drawPlayerBullets(); drawEnemyBullets();
    if (P.alive) drawShip();
    drawGroundFx(dt); drawReticle();
    drawFloats();
    if (hazard) hazard.drawFront();
    drawBossDark();
  } else { drawParticles(); drawTitleShip(); }

  ctx.restore();
  compositeGlow(sx,sy);

  if (flash>.01){ const fa=flash*.34*Settings.flash*(Settings.safeFlash?.4:1); ctx.fillStyle='rgba(255,80,140,'+fa+')'; ctx.fillRect(0,0,W,H); }
  if (whiteout>.01){ const wa=whiteout*.8*Settings.flash*(Settings.safeFlash?.3:1); ctx.fillStyle='rgba(220,255,245,'+wa+')'; ctx.fillRect(0,0,W,H); }
  if (state==='playing' && P.alive && P.y < H*0.25){   /* point-of-collection cue (#18) */
    const g = ctx.createLinearGradient(0,0,0,H*0.25);
    g.addColorStop(0,rgba(PAL.bolt,.12)); g.addColorStop(1,rgba(PAL.bolt,0));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.25);
  }
  drawVignette();
}

function drawNebula(){
  const s=420, scale=Math.max(W,H)/s*1.5, w=s*scale, h=s*scale;
  ctx.globalAlpha = .85;
  const off = (scrollY*.06)%h;
  ctx.drawImage(nebC,(W-w)/2,off-h,w,h); ctx.drawImage(nebC,(W-w)/2,off,w,h);
  if (qLevel>0){
    ctx.globalAlpha = .5;
    const w2=w*.65, h2=h*.65, off2=(scrollY*.14)%h2, dx=Math.sin(scrollY*.001)*30;
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(nebC,(W-w2)/2+dx,off2-h2,w2,h2); ctx.drawImage(nebC,(W-w2)/2+dx,off2,w2,h2);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha = 1;
}
function drawStars(dt){
  ctx.globalCompositeOperation='lighter';
  for (let l=0;l<3;l++) for (const st of stars[l]){
    st.y += st.s*dt*(state==='playing'?1:.35);
    /* frnd: drawStars runs on the RENDER path, so a seeded draw here made the simulation's
       RNG stream depend on how many frames the device happened to paint */
    if (st.y>H+2){ st.y=-2; st.x=frnd(0,W); }
    st.tw += dt*3;
    ctx.fillStyle = rgba(PAL.star, .35+Math.sin(st.tw)*.25+l*.12);
    ctx.fillRect(st.x,st.y,st.r,st.r*(1+l*.6));
  }
  ctx.globalCompositeOperation='source-over';
}
function drawDebrisLayer(dt){
  if (!debris.length) spawnDebris();
  for (const d of debris){
    d.y += d.v*dt*(state==='playing'?1:.4); d.rot += d.spin*dt;
    if (d.y-d.sc>H){ d.y=-d.sc*2; d.x=frnd(0,W); }   /* recycle, still cosmetic-stream only */
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot);
    ctx.beginPath(); ctx.moveTo(d.pts[0][0],d.pts[0][1]);
    for (let i=1;i<d.pts.length;i++) ctx.lineTo(d.pts[i][0],d.pts[i][1]);
    ctx.closePath();
    ctx.fillStyle=hullFill(.86); ctx.fill();
    ctx.strokeStyle=rgba(PAL.neb[0],.5); ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }
}
function shellPath(n,r){
  ctx.beginPath();
  for (let i=0;i<n;i++){ const a=i/n*TAU-Math.PI/2, x=Math.cos(a)*r, y=Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
}
function foeShade(e){ return e.flash>0 ? 'rgba(255,255,255,'+(.35+e.flash*.5)+')' : null; }

/* --- ship --- */
function shipPath(c){
  c.beginPath();
  c.moveTo(0,-20); c.lineTo(6,-6); c.lineTo(15,4); c.lineTo(9,7); c.lineTo(4,4);
  c.lineTo(3,13); c.lineTo(-3,13); c.lineTo(-4,4); c.lineTo(-9,7); c.lineTo(-15,4); c.lineTo(-6,-6);
  c.closePath();
}
function drawShip(){
  const skinShip = art('ship');
  if (skinShip){ skinShip(); drawShipAura(); return; }
  const blink = P.inv>0 && Math.floor(P.inv*14)%2===0;
  ctx.save(); ctx.translate(P.x,P.y); ctx.rotate(P.tilt*.35);
  if (!blink){
    const pl = 16+Math.sin(P.thrust*.9)*4+(P.focus?-5:0);
    const g = ctx.createLinearGradient(0,10,0,10+pl);
    g.addColorStop(0,rgba(PAL.bolt,.9)); g.addColorStop(1,rgba(PAL.bolt,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-4,10); ctx.lineTo(4,10); ctx.lineTo(0,10+pl); ctx.closePath(); ctx.fill();
    shipPath(ctx);
    const hull = ctx.createLinearGradient(0,-20,0,14);
    hull.addColorStop(0,rgba(PAL.hull,.95)); hull.addColorStop(.55,hullFill(.95)); hull.addColorStop(1,hullFill(.95));
    ctx.fillStyle=hull; ctx.fill();
    ctx.strokeStyle=rgba(PAL.hull,.9); ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(2.6,-2); ctx.lineTo(-2.6,-2); ctx.closePath();
    ctx.fillStyle=rgba(PAL.bolt,.95); ctx.fill();
    addGlow(P.x,P.y+16,26,PAL.bolt,.7); addGlow(P.x,P.y-6,20,PAL.hull,.5);
  }
  ctx.restore();
  drawShipAura();
}
function drawShipAura(){
  const blink = P.inv>0 && Math.floor(P.inv*14)%2===0;   /* was scoped to drawShip before the split */
  if (P.shield>0){
    const pulse = 1+Math.sin(elapsed*4)*.03;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=rgba(PAL.hull,.32+P.shield*.12); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(P.x,P.y,26*pulse,0,TAU); ctx.stroke();
    for (let i=0;i<P.shield;i++){ const a=elapsed*1.6+i/P.shield*TAU;
      ctx.fillStyle=rgba(PAL.hull,.9);
      ctx.beginPath(); ctx.arc(P.x+Math.cos(a)*26*pulse,P.y+Math.sin(a)*26*pulse,2.6,0,TAU); ctx.fill(); }
    ctx.restore(); addGlow(P.x,P.y,44,PAL.hull,.25);
  }
  if ((P.morphT||0)>0){
    /* proximity aura (#11) — grazing lights a cool ring; the wider the morph, the brighter */
    const a = clamp(P.morphT,0,1);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=rgba(PAL.bolt,.12+a*.24); ctx.lineWidth=1.4+a*1.8;
    ctx.beginPath(); ctx.arc(P.x,P.y,GRAZE_R+P.r+2+Math.sin(elapsed*10)*1.5,0,TAU); ctx.stroke();
    ctx.restore(); addGlow(P.x,P.y,GRAZE_R+10,PAL.bolt,.2+a*.3);
  }
  if (P.focus){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=rgba(PAL.crystal,.95); ctx.beginPath(); ctx.arc(P.x,P.y,P.r,0,TAU); ctx.fill();
    ctx.strokeStyle=rgba(PAL.crystal,.5); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(P.x,P.y,P.r+6+Math.sin(elapsed*8)*2,0,TAU); ctx.stroke();
    ctx.restore(); addGlow(P.x,P.y,14,PAL.crystal,.6);
  } else if (Settings.hitbox && !blink){
    /* a quiet dot so new pilots learn where their true hitbox actually is */
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=rgba(PAL.crystal,.3); ctx.beginPath(); ctx.arc(P.x,P.y,P.r*.8,0,TAU); ctx.fill();
    ctx.restore();
  }
  const skinD = art('drone');
  for (const d of drones){
    if (skinD){ skinD(d); continue; }
    const dx=d.x, dy=d.y, ang=(d.drawA===undefined?-Math.PI/2:d.drawA);
    ctx.save(); ctx.translate(dx,dy); ctx.rotate(ang);
    ctx.fillStyle=rgba(PAL.drone,.9);
    ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,4); ctx.lineTo(-2,0); ctx.lineTo(-4,-4); ctx.closePath(); ctx.fill();
    ctx.restore(); addGlow(dx,dy,14,PAL.drone,.6);
  }
}
function drawTitleShip(){
  P.x = W/2; P.y = H*.62+Math.sin(elapsed*1.2)*8; elapsed += 1/60;
  ctx.save(); ctx.translate(P.x,P.y);
  const pl = 18+Math.sin(elapsed*6)*4;
  const g = ctx.createLinearGradient(0,10,0,10+pl);
  g.addColorStop(0,rgba(PAL.bolt,.9)); g.addColorStop(1,rgba(PAL.bolt,0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-4,10); ctx.lineTo(4,10); ctx.lineTo(0,10+pl); ctx.closePath(); ctx.fill();
  shipPath(ctx);
  const hull = ctx.createLinearGradient(0,-20,0,14);
  hull.addColorStop(0,rgba(PAL.hull,.95)); hull.addColorStop(1,hullFill(.95));
  ctx.fillStyle=hull; ctx.fill();
  ctx.strokeStyle=rgba(PAL.hull,.8); ctx.lineWidth=1.2; ctx.stroke();
  ctx.restore(); addGlow(P.x,P.y+16,30,PAL.bolt,.6);

/* --- enemy art --- */
function drawEnemies(){
  for (const e of enemies){ ctx.save(); ctx.translate(e.x,e.y); TYPES[e.type].draw(e); ctx.restore(); }
  drawTells();
}
/* A second pass rather than a call inside each of the 19 draw fns: a tell occluded by a
   later-drawn sprite is worse than no tell, and one pass batches the whole thing into a single
   state block. Like drawWarns, low quality drops the dash and the glow, never the tell. */
function drawTells(){
  const lo = qLevel < 1;
  let open = false;
  for (const e of enemies){
    if (!e.tellKind && !e.prio) continue;
    if (!open){ ctx.save(); ctx.lineWidth = 2; open = true; }

    if (e.tellKind){
      const k = 1 - clamp(e.tell/(e.tellMax||1),0,1);          /* 0 at start → 1 at fire */
      const a = .22 + k*.5 + Math.sin(e.t*30)*.07;
      ctx.strokeStyle = rgba(PAL.elaser, lo ? a+.15 : a);
      ctx.lineWidth = 1.6 + k*1.6;
      if (!lo) ctx.setLineDash([8 - k*4, 7 - k*3]);
      ctx.beginPath();
      if (e.tellKind===TK.ring){
        ctx.arc(e.x, e.y, (e.tellN||e.r*2.4)*(1.5-k*.5), 0, TAU);
      } else if (e.tellKind===TK.arc){
        ctx.arc(e.x, e.y, e.r*2.2, e.tellA-(e.tellN||.5)/2, e.tellA+(e.tellN||.5)/2);
      } else if (e.tellKind===TK.fan){
        const half=(e.tellN||.5)/2, len=e.r*(3+k*2);
        for (let i=-1;i<=1;i+=2){ const ang=e.tellA+half*i;
          ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+Math.cos(ang)*len, e.y+Math.sin(ang)*len); }
      } else if (e.tellKind===TK.line){
        const len=Math.max(W,H)*1.2;
        ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+Math.cos(e.tellA)*len, e.y+Math.sin(e.tellA)*len);
      } else if (e.tellKind===TK.point){
        const r=e.r*(2.4-k*1.6);
        ctx.moveTo(e.x-r,e.y); ctx.lineTo(e.x+r,e.y);
        ctx.moveTo(e.x,e.y-r); ctx.lineTo(e.x,e.y+r);
      } else if (e.tellKind===TK.crack){
        const r=e.r*.85;
        for (let i=0;i<3;i++){ const ang=e.t*.6+i*TAU/3;
          ctx.moveTo(e.x+Math.cos(ang)*r*.3, e.y+Math.sin(ang)*r*.3);
          ctx.lineTo(e.x+Math.cos(ang+.5)*r, e.y+Math.sin(ang+.5)*r); }
      }
      ctx.stroke();
      if (!lo && qLevel>=2 && k>.6) addGlow(e.x,e.y,e.r*2.2,PAL.elaser,(k-.6)*.9);
    }

    /* priority bracket — corner ticks, the one shape nothing else in the game uses:
       rings are tells, dots are pickups, dashes are warns, arcs are shields. */
    if (e.prio){
      if (!lo) ctx.setLineDash([]);
      ctx.strokeStyle = rgba(PAL.elaser, .5);
      ctx.lineWidth = 2;
      const R = e.r+10, c = Math.cos(e.t*.7), sn = Math.sin(e.t*.7), t = R*.42;
      ctx.beginPath();
      for (let i=0;i<4;i++){
        const dx=(i&1?1:-1), dy=(i&2?1:-1);
        const px=e.x+(dx*R*c - dy*R*sn), py=e.y+(dx*R*sn + dy*R*c);
        ctx.moveTo(px - dx*t*c, py - dx*t*sn); ctx.lineTo(px, py);
        ctx.lineTo(px + dy*t*sn, py - dy*t*c);
      }
      ctx.stroke();
    }
  }
  if (open){ ctx.setLineDash([]); ctx.restore(); }
}
function dwDrifter(e){
  ctx.rotate(Math.sin(e.t*1.2)*.2);
  shellPath(6,15); ctx.fillStyle=rgba(PAL.foeDark,.95); ctx.fill();
  ctx.strokeStyle=foeShade(e)||rgba(PAL.foe,.85); ctx.lineWidth=1.6; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,5,0,TAU); ctx.fillStyle=foeShade(e)||rgba(PAL.foe,.95); ctx.fill();

function dwWeaver(e){

function dwTurret(e){

  ctx.strokeStyle=foeShade(e)||rgba(PAL.foe,.85); ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=rgba(PAL.ebullet,.85);
  for (let i=-1;i<=1;i++) ctx.fillRect(i*8-2,14,4,8);

function dwSentry(e){
  ctx.save(); ctx.rotate(e.ang);

    ctx.beginPath(); ctx.arc(0,0,24,-.4,.4); ctx.lineWidth=4;

  ctx.restore();
  shellPath(5,16); ctx.fillStyle=rgba(PAL.foeDark,.96); ctx.fill();
  ctx.strokeStyle=foeShade(e)||rgba(PAL.foe,.8); ctx.lineWidth=1.8; ctx.stroke();

/* --- boss render --- */
/* pullField was applied silently: three bosses drag the ship and the only feedback was your
   own drift. Draw-only — a slow counter-rotating ring plus spokes streaming inward, so the
   well reads as a place the arena is bending rather than as an input bug. */
/* Reflectable boss fire (#21). The shards hazard already bounces enemy bullets off a mirror
   line, but it mutates them in place — a "reflected" shot would still belong to the boss and
   still hurt you. So the geometry comes from shards and the OWNERSHIP trick comes from
   prismReflect: delete from ebullets, push into pbullets, and the draw pass hands it the cool
   palette for free. A projectile is whichever array it lives in; there is no flag to get wrong. */
function reflectBossFire(x,y,r){
  let n = 0;
  for (let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    if (!b.refl) continue;                       /* only attacks marked reflectable */
    if (dist2(b.x,b.y,x,y) > r*r) continue;
    const sp = Math.hypot(b.vx,b.vy);
    const a = Math.atan2(y-b.y, x-b.x);          /* straight back at what deflected it */
    swapDel(ebullets,i);
    shoot(b.x, b.y, a, Math.min(520, sp*1.15), 4, 0);
    spark(b.x,b.y,PAL.bolt); n++;
  }
  if (n){ Sound.tick(9); haptic(8); }
  return n;
}
/* Must-kill summons: adds tagged by a boss, counted so coreGuard can gate on them. */
function bossAdds(){
  let n = 0;
  for (const e of enemies) if (e.summon) n++;
  return n;
}
function summon(b,type,x,y,opts){
  const e = spawnEnemy(type, x, y, opts||{});
  e.summon = true; e.prio = true;                /* it gets the priority bracket for free */
  return e;
}
function drawArena(){
  if (!arena) return;
  ctx.save();
  ctx.strokeStyle = rgba(PAL.elaser, .30 + Math.sin(elapsed*4)*.06);
  ctx.lineWidth = 3; ctx.setLineDash([14,10]);
  ctx.strokeRect(arena.x0, arena.y0, arena.x1-arena.x0, arena.y1-arena.y0);
  ctx.setLineDash([]);
  ctx.restore();
}
function drawBossDark(){
  if (bossDark <= 0) return;
  const lit = (170 - bossDark*95);
  const g = ctx.createRadialGradient(P.x,P.y,lit*.42,P.x,P.y,lit*2.4);
  g.addColorStop(0,hullFill(0));
  g.addColorStop(.55,'rgba(2,7,14,'+(.70*bossDark).toFixed(3)+')');
  g.addColorStop(1,'rgba(2,7,14,'+(.92*bossDark).toFixed(3)+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawPullField(){
  if (!pullField || !boss || boss.dying) return;
  const t = boss.t, str = clamp(pullField/50, 0, 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<12;i++){
    const a = i/12*TAU - t*.35;
    const r0 = 210 - (t*70 % 70), r1 = r0 - 44;
    ctx.strokeStyle = rgba(PAL.boss, .05 + str*.10);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(boss.x+Math.cos(a)*r0, boss.y+Math.sin(a)*r0);
    ctx.lineTo(boss.x+Math.cos(a)*r1, boss.y+Math.sin(a)*r1);
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(PAL.boss, .07 + str*.10);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(boss.x, boss.y, 118 + Math.sin(t*1.3)*10, 0, TAU); ctx.stroke();
  ctx.restore();
}
function drawBoss(){
  const b = boss, d = b.def;
  /* drawExtra paints in untranslated screen space and toggles its own composite op, so it is
     deliberately outside the dying transform — and suppressed once the hull is coming apart. */
  if (d.drawExtra && !b.dying) d.drawExtra(b);

  const dy = b.dying, k = dy ? clamp(dy.t/dy.dur,0,1) : 0;
  if (dy){
    /* The per-boss draw bodies read b.flash as a boolean, so progressive whitening can't go
       through it without editing 20+ defs. Instead the whole hull gets one transform here and
       a white wash on top, which works for every boss for free. */
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.sin(dy.t*3.1)*.06*k + k*.18);
    const sc = 1 + k*.12;
    ctx.scale(sc, sc*(1-k*.06));
    ctx.translate(-b.x, -b.y);
    ctx.globalAlpha = 1 - k*.35;
  }

  for (const p of b.parts){
    if (!p.alive) continue;
    ctx.save(); ctx.translate(p.x,p.y);
    if (d.drawPart) d.drawPart(b,p);
    ctx.restore();
    if (!dy) addGlow(p.x,p.y,p.r*1.5,PAL.foe,.5);
  }
  ctx.save(); ctx.translate(b.x,b.y);
  d.draw(b);
  if (dy){                                  /* the wash: hull burning out from the inside */
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0,0,0,0,0,b.r*1.35);
    g.addColorStop(0, 'rgba(255,255,255,'+(.25+k*.7).toFixed(3)+')');
    g.addColorStop(1, flashFill(0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,b.r*1.35,0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if (dy) ctx.restore();
  /* going supernova: the cheapest knob is the glow it already has */
  if (b.raged && !dy){                       /* it is visibly running hot */
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle = rgba(PAL.elaser, .28+Math.sin(b.t*9)*.14); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.22+Math.sin(b.t*7)*4,0,TAU); ctx.stroke();
    ctx.restore();
  }
  addGlow(b.x, b.y, b.r*(1.6 + k*2.2), dy?PAL.crystal:(b.raged?PAL.elaser:PAL.boss),
          dy ? Math.min(1,.5+k*.5) : .55+b.flash*.4);
}
/* Warnings read as intent, never as ordnance: dashed, translucent, hot-band, and drawn
   under live fire. The dash tightens and the shape closes as the moment arrives. */
function drawWarns(){
  if (!warns.length) return;
  /* A warning must never be invisible while its shot still fires — so low quality degrades the
     STYLE, not the existence. setLineDash is the expensive part here, which means the cheap
     path is also the more legible one: legibility rises as quality falls. */
  const lo = qLevel < 1;
  ctx.save();
  for (const w of warns){
    const k = clamp(w.t/w.dur,0,1), pulse = .18 + k*.34 + Math.sin(w.t*34)*.08;
    ctx.strokeStyle = rgba(PAL.elaser, lo ? pulse+.15 : pulse);
    ctx.lineWidth = 1.5 + k*1.5;
    if (!lo) ctx.setLineDash([9 - k*5, 8 - k*4]);
    ctx.beginPath();
    if (w.kind==='ring'){
      ctx.arc(w.x, w.y, w.r*(1.55-k*.55), 0, TAU);
    } else if (w.kind==='point'){
      const r = w.r*(1.9-k*1.5);
      ctx.moveTo(w.x-r,w.y); ctx.lineTo(w.x+r,w.y);
      ctx.moveTo(w.x,w.y-r); ctx.lineTo(w.x,w.y+r);
      ctx.arc(w.x, w.y, r*.7, 0, TAU);
    } else if (w.kind==='line'){
      const len = Math.max(W,H)*1.6, c=Math.cos(w.a), s=Math.sin(w.a);
      ctx.moveTo(w.x, w.y); ctx.lineTo(w.x+c*len, w.y+s*len);
    } else if (w.kind==='fan'){
      const half = (w.n||.5)/2, len = w.r*(2+k*1.4);
      for (let i=-1;i<=1;i+=2){
        const a = w.a + half*i;
        ctx.moveTo(w.x, w.y); ctx.lineTo(w.x+Math.cos(a)*len, w.y+Math.sin(a)*len);
      }
    } else if (w.kind==='arc'){
      ctx.arc(w.x, w.y, w.r, w.a-(w.n||.6)/2, w.a+(w.n||.6)/2);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}
function drawLasers(){
  for (const l of lasers){
    const len = Math.max(W,H)*1.6;
    ctx.save(); ctx.translate(l.x,l.y); ctx.rotate(l.a);
    if (l.warn>0){
      ctx.strokeStyle=rgba(PAL.ebullet,.25+Math.sin(l.warn*40)*.2); ctx.lineWidth=2; ctx.setLineDash([12,10]);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,0); ctx.stroke(); ctx.setLineDash([]);
    } else {
      const w = l.w*clamp(l.live/1.5,.15,1);
      const g = ctx.createLinearGradient(0,-w,0,w);
      g.addColorStop(0,rgba(PAL.elaser,0)); g.addColorStop(.5,rgba(PAL.elaser,.95)); g.addColorStop(1,rgba(PAL.elaser,0));
      ctx.fillStyle=g; ctx.fillRect(0,-w,len,w*2);
      ctx.fillStyle=flashFill(.9); ctx.fillRect(0,-w*.18,len,w*.36);
    }
    ctx.restore();
    if (l.warn<=0) addGlow(l.x,l.y,60,PAL.elaser,.6);
  }
}
function drawPlayerBullets(){

      ctx.restore(); addGlow(b.x,b.y,16,PAL.missile,.8);

function drawEnemyBullets(){
  const cb = Settings.colorblind;
  /* contrast guard — a dark rim under every enemy round so the hot band always
     separates from a hot-palette sector (ashfall / ember / marrow). Legibility
     never depends on the background. Drawn in source-over, before the glow. */
  for (const b of ebullets){
    const r = b.r;
    ctx.fillStyle = 'rgba(4,3,8,'+(cb?.9:.66)+')';
    ctx.beginPath(); ctx.arc(b.x,b.y,r*1.05+2.2,0,TAU); ctx.fill();

    ctx.fillStyle=rgba(PAL.ebullet,.95); ctx.beginPath(); ctx.arc(b.x,b.y,r*.85,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,244,250,'+(cb?1:.95)+')'; ctx.beginPath(); ctx.arc(b.x,b.y,r*(cb?.5:.36),0,TAU); ctx.fill();
    addGlow(b.x,b.y,b.big?24:14,PAL.ebullet,.5);

function drawFloats(){

  for (const f of floats){
    const sz = f.size||13, a = clamp(f.life/f.max,0,1);
    /* big ones punch in over the first 90ms, then hold — a reward should arrive, not fade in */

    ctx.font = (sz>20?'700 ':'500 ') + (sz*pop).toFixed(1) + 'px ui-monospace,monospace';

function compositeGlow(ox,oy){
  const gw=glowC.width, gh=glowC.height, sxr=gw/W, syr=gh/H;
  gctx.setTransform(1,0,0,1,0,0);
  gctx.clearRect(0,0,gw,gh);
  gctx.globalCompositeOperation='lighter';
  for (const g of glows){
    const img = blob(g.c), r = g.r*2*sxr;
    gctx.globalAlpha = clamp(g.a,0,1);
    gctx.drawImage(img, g.x*sxr-r/2, g.y*syr-r/2, r, r);
  }
  gctx.globalAlpha = 1;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.9;  ctx.drawImage(glowC,ox,oy,W,H);
  ctx.globalAlpha=.45; ctx.drawImage(glowC,ox-6,oy-6,W+12,H+12);
  ctx.restore();
}
function drawVignette(){
  const key = W+'x'+H;
  if (vigKey!==key){
    vigKey = key;
    vignette = ctx.createRadialGradient(W/2,H*.5,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.78);

  }

}

function screenHelp(){

      <p><b>Chain &amp; cores.</b> Every kill spills crystals. Gather eight in a row before the chain timer lapses and your multiplier steps up, to ×8; let it lapse and it drops to ×1. <b>Cores</b> is your running crystal count for the run.</p>

      <div class="grpLabel" style="margin-top:18px">Aggression — risk pays</div>
      <p><b>Graze.</b> Skim enemy fire without being hit. A cool aura lights around you, your multiplier can climb past ×8 all the way to <em>×16</em>, and sustained grazing <em>morphs your cannon</em> wider and heavier for a moment. The closer you fly, the harder and faster you hit.</p>
      <p><b>Break.</b> Grazing and close-range kills fill the BREAK meter (top-right). When it tops out the ship boils over for a few seconds — fire rate and damage surge and every kill spills extra crystals. Taking a hit empties it: Break rewards staying dangerous.</p>
      <p><b>Focus.</b> Hold Focus to tighten your fire into a concentrated single-target stream and reveal your exact hitbox. Grazing still buffs damage, but Focus keeps the shot narrow instead of widening it — wide clear vs. focused melt. Optionally it also slows the ship for pixel aim (Settings).</p>

      <div class="grpLabel" style="margin-top:18px">Tools</div>

      <p><b>Drone formations.</b> With drones out, cycle <em>FWD</em> (tight forward arrow), <em>SIDE</em> (flank guard, wide coverage) and <em>TRACK</em> (orbit and fire at the nearest threat) — FORM pad, C, or gamepad Y.</p>

      <p><b>Relics.</b> From sector seven on you're offered a permanent relic between sectors and your weapon caps come off — bigger builds than the early game allows.</p>

      <div class="grpLabel" style="margin-top:18px">The ground below</div>
      <p><b>A second plane.</b> Some sectors have targets on the ground beneath the fight. <em>Bunkers</em> fire hot bullets up at you; <em>pylons</em> project a dome that shields the air enemies inside it until you destroy it.</p>
      <p><b>The reticle.</b> Your air cannon can't reach the ground — a cool <em>reticle</em> ahead of the ship auto-strikes it instead. Aim it by moving the ship (more PWR = harder strikes). You're juggling air dodging and ground lining-up at once.</p>
      <p><b>Point of collection.</b> Fly into the top quarter of the screen and every item on screen vacuums to you at once — dangerous ground to hold, but it sweeps the field.</p>

      <div class="grpLabel" style="margin-top:18px">Enemies, bosses &amp; the beat</div>
      <p><b>Pacing.</b> Waves mix slow zone-control patterns with fast, targeted sniper shots — read the room and keep streaming sideways.</p>
      <p><b>Modular bosses.</b> Blow off a module (<em>MODULE DOWN</em>) to strip the attack it fed; clear them all and the core is exposed. Phase changes snap to the music's downbeat, and later phases fire a fast sniper on the beat — watch the rhythm.</p>

/* ============================================================
   15 · input
   ============================================================ */
let dragId = null;
/* focus can be held from touch, keyboard, mouse, or a gamepad at once — combine them */
let focusTouch=false, focusKey=false, focusPad=false, focusMouse=false;
function updateFocus(){ P.focus = focusTouch || focusKey || focusPad || focusMouse; }
function pointFrom(ev){ const r=cv.getBoundingClientRect(); return { x:ev.clientX-r.left, y:ev.clientY-r.top }; }
cv.addEventListener('pointerdown', ev=>{
  if (state!=='playing') return;
  Sound.resume();
  /* desktop: left button = bomb, right button = hold-to-focus. Movement is hover-only. */
  if (ev.pointerType==='mouse'){
    ev.preventDefault();
    if (ev.button===2){ focusMouse=true; updateFocus(); }
    else if (ev.button===0){ useBomb(); }
    return;
  }
  ev.preventDefault();
  if (dragId===null){
    dragId = ev.pointerId;
    const p = pointFrom(ev);
    P.grabX = P.x-p.x; P.grabY = P.y-p.y;
    if (dist2(p.x,p.y,P.x,P.y) > 90*90){ P.grabX=0; P.grabY=-34; }
    P.tx = p.x+P.grabX; P.ty = p.y+P.grabY;
    cv.setPointerCapture(ev.pointerId);
  }
}, { passive:false });
cv.addEventListener('pointermove', ev=>{
  if (ev.pointerId!==dragId || state!=='playing') return;
  ev.preventDefault();
  const p = pointFrom(ev);
  P.tx = p.x+P.grabX; P.ty = p.y+P.grabY;
}, { passive:false });
const endDrag = ev=>{ if (ev.pointerId===dragId) dragId=null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* desktop: the ship tracks the mouse at all times — no need to hold a button */
if (DESKTOP){
  window.addEventListener('pointermove', ev=>{
    if (state!=='playing' || ev.pointerType==='touch') return;
    const r = cv.getBoundingClientRect();
    P.tx = clamp(ev.clientX - r.left, 14, W-14);
    P.ty = clamp(ev.clientY - r.top, 40, H-30);
  }, { passive:true });
  /* release right-button focus wherever the mouse is when it comes up */
  window.addEventListener('pointerup', ev=>{
    if (ev.pointerType==='mouse' && ev.button===2 && focusMouse){ focusMouse=false; updateFocus(); }
  });
  window.addEventListener('blur', ()=>{ if (focusMouse){ focusMouse=false; updateFocus(); } });
  /* right-click is focus during play, so don't pop the browser menu then */
  window.addEventListener('contextmenu', e=>{ if (state==='playing') e.preventDefault(); });
}

function bindPad(el,onDown,onUp){
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('hot');
    Sound.resume(); if (onDown) onDown(); }, {passive:false});
  const up = e=>{ e.preventDefault(); el.classList.remove('hot'); if (onUp) onUp(); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('pointerleave',up);
}
bindPad(elPadBomb, useBomb);
bindPad(elPadForm, cycleForm);
bindPad(elPadFocus, ()=>{ focusTouch=true; updateFocus(); }, ()=>{ focusTouch=false; updateFocus(); });

elSound.addEventListener('click', ()=>{
  Sound.init(); Sound.setMuted(!Sound.muted); Sound.resume();
  elSound.textContent = Sound.muted?'♪̸':'♪';
  elSound.style.color = Sound.muted?'rgba(124,154,151,.4)':'';
  saveSave();
});
elPause.addEventListener('click', togglePause);

const keys = {};
addEventListener('keydown', e=>{
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key===' ' || e.key.toLowerCase()==='z') useBomb();
  if (e.key.toLowerCase()==='c' && !e.repeat) cycleForm();
  if (e.key==='Escape'||e.key==='p') togglePause();
  if (e.key==='Shift' || e.key.toLowerCase()==='x'){ focusKey = true; updateFocus(); }
  Sound.resume();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false;
  if (e.key==='Shift' || e.key.toLowerCase()==='x'){ focusKey=false; updateFocus(); } });
/* --- gamepad: left stick / d-pad to fly, face + shoulder buttons for the rest --- */
const padPrev = {};
function pollGamepad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null; for (const p of pads){ if (p){ gp = p; break; } }
  if (!gp){ if (focusPad){ focusPad=false; updateFocus(); } return; }
  const b = gp.buttons, ax = gp.axes;
  const down = n => !!(b[n] && b[n].pressed);
  const edge = n => { const p = down(n), was = padPrev[n]; padPrev[n] = p; return p && !was; };
  const fp = down(4) || down(6) || down(2);          /* L1 / L2 / X → focus */
  if (fp !== focusPad){ focusPad = fp; updateFocus(); }
  if (edge(0) || edge(5) || edge(7)) useBomb();       /* A / R1 / R2 → bomb */
  if (edge(3)) cycleForm();                            /* Y → cycle drone formation */
  if (edge(9)) togglePause();                          /* Start → pause */
  Sound.resume();
  if (state==='playing'){
    const sp = (fp?3.4:8.4)*SPEEDS[speedIdx].v;
    let dx=0, dy=0;
    const lx=ax[0]||0, ly=ax[1]||0;
    if (Math.abs(lx)>.22) dx=lx; if (Math.abs(ly)>.22) dy=ly;
    if (down(14)) dx=-1; if (down(15)) dx=1; if (down(12)) dy=-1; if (down(13)) dy=1;
    if (dx||dy){ P.tx=clamp(P.tx+dx*sp*3.2,14,W-14); P.ty=clamp(P.ty+dy*sp*3.2,40,H-30); }
  }
}
setInterval(()=>{
  pollGamepad();
  if (state!=='playing') return;
  const sp = (P.focus?3.4:8.4)*SPEEDS[speedIdx].v;
  let dx=0, dy=0;
  if (keys['arrowleft']||keys['a']) dx--;
  if (keys['arrowright']||keys['d']) dx++;
  if (keys['arrowup']||keys['w']) dy--;
  if (keys['arrowdown']||keys['s']) dy++;
  if (dx||dy){ P.tx=clamp(P.tx+dx*sp,14,W-14); P.ty=clamp(P.ty+dy*sp,40,H-30); }
},16);

document.addEventListener('visibilitychange', ()=>{ if (document.hidden && state==='playing') togglePause(); });

/* ============================================================
   16 · boot
   ============================================================ */
const _pref = loadSave();
if (_pref){
  if (_pref.diff && DIFF[_pref.diff]) diff = DIFF[_pref.diff];
  if (typeof _pref.speed==='number' && SPEEDS[_pref.speed]) speedIdx = _pref.speed;
  if (_pref.muted) Sound.setMuted(true);
}
/* unconditional, and outside the _pref guard: a save written before skins existed has no
   skin key, and a first-ever launch has no save at all — both must still get their CSS
   custom properties set, or the chrome renders unstyled */
applySkin((_pref && _pref.skin) || 'space');
resize();
setQualityPref();
spawnDebris();
if (Sound.muted){ elSound.textContent='♪̸'; elSound.style.color='rgba(124,154,151,.4)'; }
if (DESKTOP){ const fl=$('focusLbl'); if (fl) fl.textContent='R-CLICK'; }
screenTitle();
refreshHUD(true);
requestAnimationFrame(frame);

/* --- PWA: it's a single self-contained page, so it installs & runs offline --- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} });
}

})();
</script>
</body>
</html>
