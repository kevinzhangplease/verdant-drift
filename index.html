<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#04070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verdant Drift">
<title>Verdant Drift — Six Sectors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04070f; --ink:#e8f6f2; --dim:#7c9a97;
    --jade:#6ffbc0; --rose:#ff5aa8; --amber:#ffc978;
    --edge:rgba(120,240,210,.22);
    --display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--display)}
  body{position:fixed;inset:0;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #game{display:block;position:absolute;inset:0}

  #hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
       display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .stat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .val{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1;text-shadow:0 0 14px rgba(142,242,255,.4)}
  .val.small{font-size:15px}
  #multWrap{text-align:right}
  #mult{font-size:26px;color:var(--jade);text-shadow:0 0 18px rgba(111,251,192,.6);transition:transform .12s}
  #mult.pop{transform:scale(1.22)}
  #mult.hot{color:var(--amber);text-shadow:0 0 22px rgba(255,201,120,.75)}
  #chainBar{width:104px;height:3px;background:rgba(255,255,255,.12);margin-left:auto;margin-top:5px;border-radius:2px;overflow:hidden}
  #chainFill{height:100%;width:0;background:var(--jade);box-shadow:0 0 10px var(--jade)}
  #breakBar{width:104px;height:4px;background:rgba(255,255,255,.12);margin-left:auto;margin-top:5px;border-radius:2px;overflow:hidden}
  #breakFill{height:100%;width:0;background:linear-gradient(90deg,var(--jade),#a8f6ff);box-shadow:0 0 10px var(--jade);transition:width .08s}
  #breakBar.full{box-shadow:0 0 16px rgba(142,255,232,.85)}
  #breakBar.full #breakFill{background:#eafffb;animation:breakpulse .5s infinite}
  @keyframes breakpulse{0%,100%{opacity:1}50%{opacity:.55}}
  #lifeRow{display:flex;gap:6px;margin-top:4px}
  .pip{width:9px;height:9px;border:1px solid var(--jade);transform:rotate(45deg);opacity:.35}
  .pip.on{background:var(--jade);opacity:1;box-shadow:0 0 10px var(--jade)}
  #mods{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-width:190px}
  .mod{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 7px;border:1px solid var(--edge);
       border-radius:2px;color:var(--jade);background:rgba(111,251,192,.07)}
  #sectorTag{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:9px}

  #bossWrap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 96px);padding:0 18px;opacity:0;
            transition:opacity .35s;pointer-events:none}
  #bossWrap.on{opacity:1}
  #bossName{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);
            margin-bottom:5px;text-align:center}
  #bossBar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
  #bossFill{height:100%;width:100%;background:linear-gradient(90deg,var(--rose),var(--amber));
            box-shadow:0 0 16px rgba(255,90,168,.7);transition:width .12s linear}

  #banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          pointer-events:none;opacity:0;transition:opacity .5s}
  #banner.on{opacity:1}
  #bTitle{font-size:clamp(30px,9vw,56px);font-weight:700;letter-spacing:-.02em;line-height:1;text-align:center;
          text-shadow:0 0 40px rgba(111,251,192,.5)}
  #bSub{font-family:var(--mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--jade);
        margin-top:12px;text-align:center;padding:0 24px}

  /* teaching line — appears once, when a mechanic first matters */
  #teach{position:absolute;left:0;right:0;bottom:150px;text-align:center;pointer-events:none;opacity:0;
         transition:opacity .45s;padding:0 26px}
  #teach.on{opacity:1}
  #teach span{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;line-height:1.7;
              color:var(--ink);background:rgba(4,12,18,.72);border:1px solid var(--edge);border-radius:3px;
              padding:9px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #teach b{color:var(--amber);font-weight:500}

  #pads{position:absolute;left:0;right:0;bottom:0;height:132px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);
        display:flex;align-items:flex-end;justify-content:space-between;opacity:0;transition:opacity .4s;pointer-events:none}
  #pads.on{opacity:1}
  .pad{pointer-events:auto;width:80px;height:80px;border-radius:50%;border:1px solid var(--edge);
       background:rgba(8,22,26,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;
       flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--mono);font-size:9px;
       letter-spacing:.18em;color:var(--dim);transition:transform .08s,background .12s,border-color .12s}
  .pad b{font-size:18px;font-weight:500;color:var(--ink);letter-spacing:0}
  .pad.hot{background:rgba(111,251,192,.16);border-color:var(--jade);color:var(--jade);transform:scale(.94)}
  .pad.empty{opacity:.32}
  .pad.deny{animation:deny .3s}
  @keyframes deny{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #padForm{width:60px;height:60px;display:none}
  #padForm.show{display:flex}
  #padForm b{font-size:12px;letter-spacing:.04em}
  .pad.ready{box-shadow:0 0 0 0 rgba(255,201,120,.55);animation:ready 1.8s infinite}
  @keyframes ready{0%{box-shadow:0 0 0 0 rgba(255,201,120,.45)}70%{box-shadow:0 0 0 14px rgba(255,201,120,0)}100%{box-shadow:0 0 0 0 rgba(255,201,120,0)}}

  #veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:30px 22px calc(env(safe-area-inset-bottom) + 22px);text-align:center;overflow-y:auto;
        background:radial-gradient(ellipse at 50% 40%,rgba(6,24,26,.5),rgba(4,7,15,.93) 70%);
        backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #veil.off{display:none}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--jade);margin-bottom:14px}
  h1{font-size:clamp(38px,13vw,76px);font-weight:700;letter-spacing:-.035em;line-height:.92;margin-bottom:4px}
  h1 em{font-style:normal;display:block;color:var(--jade);text-shadow:0 0 46px rgba(111,251,192,.45)}
  h2{font-size:clamp(26px,8vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.04;margin-bottom:10px}
  .lede{max-width:340px;font-size:13.5px;line-height:1.6;color:var(--dim);margin-bottom:20px}
  .grp{margin-bottom:18px;width:100%;max-width:360px}
  .grpLabel{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .choices{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .choice{padding:10px 13px;border:1px solid var(--edge);border-radius:3px;background:rgba(8,22,26,.5);
          font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
          cursor:pointer;transition:.14s}
  .choice small{display:block;font-family:var(--display);font-size:10px;letter-spacing:0;text-transform:none;
                color:rgba(124,154,151,.7);margin-top:3px}
  .choice[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:rgba(111,251,192,.12);
          box-shadow:0 0 24px rgba(111,251,192,.16)}
  .secGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:360px}
  .sec{padding:9px 6px;border:1px solid var(--edge);border-radius:3px;background:rgba(8,22,26,.5);cursor:pointer;
       transition:.14s;text-align:center}
  .sec i{display:block;font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--dim)}
  .sec span{display:block;font-size:11.5px;margin-top:3px;color:var(--ink);line-height:1.25}
  .sec[aria-pressed="true"]{border-color:var(--jade);background:rgba(111,251,192,.12)}
  .sec[aria-pressed="true"] i{color:var(--jade)}
  .btn{padding:15px 40px;border:1px solid var(--jade);border-radius:3px;background:rgba(111,251,192,.12);
       color:var(--jade);font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
       cursor:pointer;transition:.14s;box-shadow:0 0 30px rgba(111,251,192,.16)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{border-color:var(--edge);color:var(--dim);background:transparent;box-shadow:none}
  .btnRow{display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:4px}
  .tally{display:flex;gap:22px;margin-bottom:20px;font-family:var(--mono);flex-wrap:wrap;justify-content:center}
  .tally div{text-align:center}
  .tally span{display:block;font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
  .tally b{font-size:24px;font-weight:500;color:var(--ink)}
  .hint{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(124,154,151,.65);margin-top:18px;line-height:1.9}
  .helpList{text-align:left;max-width:360px;font-size:13px;line-height:1.65;color:var(--dim)}
  .helpList b{color:var(--ink);font-weight:500}
  .helpList p{margin-bottom:13px}
  .helpList em{font-style:normal;color:var(--amber)}
  #sound,#pause{position:absolute;top:calc(env(safe-area-inset-top) + 10px);width:34px;height:34px;border:1px solid var(--edge);
         border-radius:50%;background:rgba(8,22,26,.5);color:var(--dim);font-size:13px;display:flex;align-items:center;
         justify-content:center;cursor:pointer;z-index:5}
  #sound{right:12px} #pause{right:52px;display:none;font-family:var(--mono);font-size:11px}
  #pause.on{display:flex}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <div>
      <div class="stat">Score</div>
      <div class="val" id="score">0</div>
      <div id="lifeRow"></div>
      <div id="mods"></div>
      <div id="sectorTag"></div>
    </div>
    <div id="multWrap">
      <div class="stat">Chain</div>
      <div class="val" id="mult">×1</div>
      <div id="chainBar"><div id="chainFill"></div></div>
      <div class="stat" style="margin-top:10px">Cores</div>
      <div class="val small" id="cores">0</div>
      <div class="stat" style="margin-top:10px">Break</div>
      <div id="breakBar"><div id="breakFill"></div></div>
    </div>
  </div>
</div>

<div id="bossWrap"><div id="bossName"></div><div id="bossBar"><div id="bossFill"></div></div></div>
<div id="banner"><div id="bTitle"></div><div id="bSub"></div></div>
<div id="teach"><span></span></div>

<div id="pads">
  <div class="pad" id="padBomb"><b>2</b>Bomb</div>
  <div class="pad" id="padForm"><b>FWD</b>Form</div>
  <div class="pad" id="padFocus"><b>◎</b><span id="focusLbl">Focus</span></div>
</div>

<button id="pause" aria-label="Pause">||</button>
<button id="sound" aria-label="Toggle sound">♪</button>
<div id="veil"></div>

<script>
(() => {
'use strict';

/* ============================================================
   0 · helpers
   ============================================================ */
const TAU = Math.PI*2;
const DESKTOP = (()=>{ try { return !!(window.matchMedia && window.matchMedia('(pointer:fine)').matches); } catch(e){ return false; } })();

/* --- seeded RNG: every run is reproducible; the daily run shares a seed --- */
const _origRandom = Math.random;
let _rng = _origRandom;
const rand = () => _rng();
let lastSeed = 0, seededMode = false, dailyRun = false;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedRun(s){ lastSeed = s>>>0; const g = mulberry32(lastSeed); _rng = g; Math.random = g; seededMode = true; }
function dailyKey(){ const d = new Date(); return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate(); }
function dailySeed(){ const s = dailyKey(); let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }

const rnd  = (a,b) => a + rand()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(rand()*a.length)];
const clamp= (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rgba = (c,a) => 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
const dist2= (ax,ay,bx,by) => { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };
const $ = id => document.getElementById(id);

/* --- swap-remove: O(1) deletion for the hot per-frame arrays (order-free) --- */
function swapDel(a,i){ const last=a.length-1; if(i!==last) a[i]=a[last]; a.pop(); }
/* --- particle pool: recycle objects so the GC doesn't stutter on mobile --- */
const partPool = [];
function pPart(o){ const p = partPool.length ? partPool.pop() : {};
  p.x=o.x; p.y=o.y; p.vx=o.vx||0; p.vy=o.vy||0; p.life=o.life; p.max=o.max||o.life;
  p.r=o.r; p.c=o.c; p.g=o.g||0; p.ring=o.ring||false; parts.push(p); return p; }

/* --- player settings + saved progress (localStorage) --- */
const Settings = { shake:1, flash:1, safeFlash:false, colorblind:false, haptics:true, hitbox:true, focusSlow:false, quality:'auto' };
let Best = { hi:0, furthest:1, sectors:{}, daily:{}, launches:0 };
const SAVE_KEY = 'verdantDrift.v1';
function loadSave(){
  try{ const d = JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if (d){ if (d.settings) Object.assign(Settings,d.settings); if (d.best) Object.assign(Best,d.best); return d.pref||null; }
  }catch(e){}
  return null;
}
function saveSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    settings:Settings, best:Best,
    pref:{ diff:diff.key, speed:speedIdx, muted:Sound.muted }
  })); }catch(e){}
}
function recordRun(finalScore, sectorReached){
  Best.hi = Math.max(Best.hi, finalScore);
  Best.furthest = Math.max(Best.furthest, sectorReached);
  const sk = 's'+sectorReached; Best.sectors[sk] = Math.max(Best.sectors[sk]||0, finalScore);
  if (dailyRun){ const dk = dailyKey(); Best.daily[dk] = Math.max(Best.daily[dk]||0, finalScore); }
  saveSave();
}
/* --- haptics: a short buzz on the moments that matter --- */
function haptic(p){ if (Settings.haptics && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

/* ============================================================
   1 · canvas + bloom buffer
   ============================================================ */
const cv = $('game'), ctx = cv.getContext('2d', { alpha:false });
const glowC = document.createElement('canvas'), gctx = glowC.getContext('2d');
const nebC  = document.createElement('canvas'), nctx = nebC.getContext('2d');
let W=0, H=0, DPR=1;
let GLOW_SCALE = 0.28;

/* --- adaptive quality: keep 60fps on low-end phones by shedding detail --- */
let qLevel = 2;                 /* 2 high · 1 medium · 0 low */
let frameEMA = 16, qCooldown = 0;
function qStar(){ return qLevel>=2 ? 1 : qLevel===1 ? .7 : .48; }
function qParts(){ return qLevel>=2 ? 60 : qLevel===1 ? 42 : 26; }
function applyQuality(){
  GLOW_SCALE = qLevel>=2 ? 0.28 : qLevel===1 ? 0.22 : 0.16;
  resizeGlow(); buildStars();
}
function setQualityPref(){
  if (Settings.quality==='high') qLevel = 2;
  else if (Settings.quality==='low') qLevel = 0;
  /* 'auto' leaves qLevel where the monitor put it */
  applyQuality();
}
function resizeGlow(){
  glowC.width  = Math.max(2, Math.round(W*GLOW_SCALE));
  glowC.height = Math.max(2, Math.round(H*GLOW_SCALE));
}
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  resizeGlow();
  vigKey = '';
  buildStars(); buildNebula(); debris.length = 0;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize,150));

const blobCache = new Map();
function blob(col){
  const key = col.join(',');
  let c = blobCache.get(key);
  if (c) return c;
  const s = 96;
  c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0, rgba(col,1)); g.addColorStop(.25, rgba(col,.55));
  g.addColorStop(.6, rgba(col,.14)); g.addColorStop(1, rgba(col,0));
  x.fillStyle = g; x.fillRect(0,0,s,s);
  blobCache.set(key,c); return c;
}

/* ============================================================
   2 · palettes — one identity per sector
   ============================================================ */
const PALETTES = [
  { key:'verdant', neb:[[26,96,88],[14,44,86],[70,32,96]], star:[190,255,244], foe:[110,246,186],
    foeDark:[10,38,44], ebullet:[255,90,168], elaser:[255,140,110], boss:[255,120,180], dust:.85 },
  { key:'ashfall', neb:[[96,46,22],[54,26,30],[28,26,36]], star:[255,214,180], foe:[255,158,96],
    foeDark:[34,18,14], ebullet:[255,86,64], elaser:[255,150,80], boss:[255,186,96], dust:1.05 },
  { key:'ember',   neb:[[132,32,20],[150,78,12],[64,10,52]], star:[255,232,192], foe:[255,132,64],
    foeDark:[42,12,10], ebullet:[255,70,124], elaser:[255,200,90], boss:[255,222,124], dust:1.15 },
  { key:'lattice', neb:[[38,30,96],[18,62,116],[86,20,118]], star:[232,236,255], foe:[168,182,255],
    foeDark:[12,14,40], ebullet:[255,72,152], elaser:[190,140,255], boss:[190,170,255], dust:.6 },
  { key:'shoal',   neb:[[6,42,72],[10,20,62],[32,8,64]], star:[180,232,255], foe:[92,222,255],
    foeDark:[4,16,30], ebullet:[255,112,88], elaser:[255,150,120], boss:[140,255,232], dust:.7 },
  { key:'quiet',   neb:[[96,84,58],[74,62,94],[118,104,78]], star:[255,250,232], foe:[255,232,182],
    foeDark:[28,24,18], ebullet:[255,88,110], elaser:[255,210,140], boss:[255,242,206], dust:.95 }
];
/* player colours never change — you always read your own fire the same way */
const PAL = {
  hull:[168,246,255], bolt:[142,255,232], missile:[255,201,120], drone:[186,255,208],
  crystal:[255,224,150], pickup:[150,255,225],
  neb:[[26,96,88],[14,44,86],[70,32,96]], star:[190,255,244], foe:[110,246,186],
  foeDark:[10,38,44], ebullet:[255,90,168], elaser:[255,140,110], boss:[255,120,180], dust:.85
};
function applyPalette(i){
  const p = PALETTES[i];
  PAL.neb=p.neb; PAL.star=p.star; PAL.foe=p.foe; PAL.foeDark=p.foeDark;
  PAL.ebullet=p.ebullet; PAL.elaser=p.elaser; PAL.boss=p.boss; PAL.dust=p.dust;
  buildNebula(); buildStars();
}

/* ============================================================
   3 · audio — a different mode per sector
   ============================================================ */
const MODES = [
  { roots:[110,87.31,130.81,98],     chords:[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,392]],
    scale:[440,523.25,587.33,659.25,783.99], swing:1,  drums:1 },
  { roots:[73.42,98,87.31,65.41],    chords:[[146.83,174.61,220],[196,246.94,293.66],[174.61,220,261.63],[130.81,164.81,196]],
    scale:[293.66,349.23,392,466.16,523.25], swing:1.2, drums:1.15 },

const Sound = {
  ac:null, master:null, mGain:null, sGain:null, ready:false, muted:false,
  intensity:0, targetIntensity:0, beat:0, next:0, mode:0,
  init(){
    if (this.ready) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = this.muted?0:.9; this.master.connect(this.ac.destination);
    this.mGain = this.ac.createGain(); this.mGain.gain.value = .32; this.mGain.connect(this.master);
    this.sGain = this.ac.createGain(); this.sGain.gain.value = .55; this.sGain.connect(this.master);
    this.ready = true; this.next = this.ac.currentTime + .1;
    setInterval(()=>this.schedule(), 25);
  },
  resume(){ if (this.ac && this.ac.state==='suspended') this.ac.resume(); },
  setMuted(m){ this.muted=m; if (this.master) this.master.gain.value = m?0:.9; },
  setMode(i){ this.mode = i; },
  schedule(){
    if (!this.ready) return;
    const M = MODES[this.mode], spb = 60/96/2*M.swing;
    this.intensity += (this.targetIntensity - this.intensity)*.04;
    while (this.next < this.ac.currentTime + .15){
      const b = this.beat, bar = Math.floor(b/8)%4, t = this.next;
      if (b%8===0) this.pad(M.chords[bar], t, spb*8);
      if (b%2===0) this.bass(M.roots[bar], t);
      if (b%4===0 && M.drums>.6) this.kick(t);
      if (this.intensity>.25 && b%2===1) this.hat(t, .05*this.intensity*M.drums);
      if (this.intensity>.4) this.arp(M.scale[(b*3)%M.scale.length]*(b%16<8?1:1.5), t, .085*this.intensity);
      this.next += spb; this.beat++;
    }
  },
  pad(freqs,t,dur){
    const g=this.ac.createGain(), f=this.ac.createBiquadFilter();
    g.gain.value=0; f.type='lowpass'; f.frequency.value=680+this.intensity*950;
    g.connect(f); f.connect(this.mGain);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.9); g.gain.linearRampToValueAtTime(0,t+dur);
    freqs.forEach((fr,i)=>[-4,4].forEach(d=>{
      const o=this.ac.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.detune.value=d+i*2;
      o.connect(g); o.start(t); o.stop(t+dur+.05);
    }));
  },
  bass(fr,t){ const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='triangle'; o.frequency.value=fr; o.connect(g); g.connect(this.mGain);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.start(t); o.stop(t+.35); },
  arp(fr,t,v){ const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='triangle'; o.frequency.value=fr; o.connect(g); g.connect(this.mGain);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.start(t); o.stop(t+.2); },
  kick(t){ const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(38,t+.11);
    g.gain.setValueAtTime(.48,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(g); g.connect(this.mGain); o.start(t); o.stop(t+.26); },
  hat(t,v){ const s=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    s.buffer=this.noiseBuf(); f.type='highpass'; f.frequency.value=7000;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
    s.connect(f); f.connect(g); g.connect(this.mGain); s.start(t); s.stop(t+.06); },
  _nb:null,
  noiseBuf(){ if (this._nb) return this._nb;
    const len=this.ac.sampleRate, b=this.ac.createBuffer(1,len,this.ac.sampleRate), d=b.getChannelData(0);
    for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this._nb=b; return b; },
  _lastShot:0,
  shot(){ if (!this.ready) return; const t=this.ac.currentTime;
    if (t-this._lastShot<.05) return; this._lastShot=t;
    const o=this.ac.createOscillator(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    o.type='square'; o.frequency.setValueAtTime(1250,t); o.frequency.exponentialRampToValueAtTime(420,t+.07);
    f.type='bandpass'; f.frequency.value=1500; f.Q.value=1.2;
    g.gain.setValueAtTime(.085,t); g.gain.exponentialRampToValueAtTime(.001,t+.08);
    o.connect(f); f.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.09); },
  boom(size){ if (!this.ready) return; const t=this.ac.currentTime;
    const s=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    s.buffer=this.noiseBuf(); f.type='lowpass';
    f.frequency.setValueAtTime(2400*size,t); f.frequency.exponentialRampToValueAtTime(120,t+.4*size);
    g.gain.setValueAtTime(.32*size,t); g.gain.exponentialRampToValueAtTime(.001,t+.5*size);
    s.connect(f); f.connect(g); g.connect(this.sGain); s.start(t); s.stop(t+.55*size); },
  pickup(){ if (!this.ready) return; const t=this.ac.currentTime;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(660,t); o.frequency.exponentialRampToValueAtTime(1320,t+.11);
    g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.18); },
  chime(n){ if (!this.ready) return; const t=this.ac.currentTime;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='triangle'; o.frequency.value=520*Math.pow(1.0595,n*2);
    g.gain.setValueAtTime(.11,t); g.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.26); },
  hurt(){ if (!this.ready) return; const t=this.ac.currentTime;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(60,t+.4);
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.45);
    o.connect(g); g.connect(this.sGain); o.start(t); o.stop(t+.46); },
  bombFx(){ if (!this.ready) return; const t=this.ac.currentTime;
    const s=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    s.buffer=this.noiseBuf(); f.type='lowpass';
    f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(6000,t+.25);
    f.frequency.exponentialRampToValueAtTime(200,t+.9);
    g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.001,t+1);
    s.connect(f); f.connect(g); g.connect(this.sGain); s.start(t); s.stop(t+1.05); },
  alarm(){ if (!this.ready) return; const t=this.ac.currentTime;
    for (let i=0;i<3;i++){ const o=this.ac.createOscillator(),g=this.ac.createGain();
      o.type='square'; o.frequency.value=220; const tt=t+i*.22;
      g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(.1,tt+.02); g.gain.exponentialRampToValueAtTime(.001,tt+.18);
      o.connect(g); g.connect(this.sGain); o.start(tt); o.stop(tt+.2); } }
};

function buildNebula(){

  nctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<46;i++){

function resetRun(startLevel){

  graze=0; grazeStreak=0; grazeMult=0; grazeTimer=0; rank=0;

  MODMAX.power=5; MODMAX.spread=3; MODMAX.rapid=3; MODMAX.homing=2; MODMAX.pierce=2; MODMAX.drones=2;
  if (startLevel >= 6) ascend();
  /* later sectors start you geared up — they're balanced for it */
  const boost = [0,1,2,3,4,5][startLevel];
  for (let i=0;i<boost;i++){ const k = ['power','spread','rapid','power','homing','pierce'][i]; P.mods[k] = Math.min(MODMAX[k], P.mods[k]+1); }

function syncDrones(){
  drones.length = 0;
  const nDr = P.mods.drones + ((P.relics&&P.relics.twin)?2:0);
  for (let i=0;i<nDr;i++) drones.push({ a:i/Math.max(1,nDr)*TAU, fireT:i*.12, ox:0, oy:0, x:P.x, y:P.y, drawA:-Math.PI/2 });
  if (elPadForm){
    elPadForm.classList.toggle('show', drones.length>0);
    elPadForm.querySelector('b').textContent = DRONE_FORMS[P.droneForm||0];
  }
}
function cycleForm(){
  if (!drones.length) return;
  P.droneForm = ((P.droneForm||0)+1)%3;
  if (elPadForm) elPadForm.querySelector('b').textContent = DRONE_FORMS[P.droneForm];
  floatText(P.x,P.y-30, DRONE_FORMS[P.droneForm], PAL.drone); Sound.pickup();
}
function updatePlayer(dt){
  relicTick(dt);
  const prevx = P.x;
  /* gravity wells / boss pull nudge the target; the ship then snaps to it — 1:1, zero smoothing */
  if (pullField && boss){
    const a = Math.atan2(boss.y-P.ty, boss.x-P.tx);
    P.tx += Math.cos(a)*pullField*dt; P.ty += Math.sin(a)*pullField*dt;
  }
  P.tx = clamp(P.tx,14,W-14); P.ty = clamp(P.ty,40,H-30);
  if (Settings.focusSlow && P.focus){         /* opt-in precision (#12): ease toward the cursor while focusing */
    const e = 1-Math.pow(1-.5, dt*60);
    P.x = lerp(P.x, P.tx, e); P.y = lerp(P.y, P.ty, e);
  } else { P.x = P.tx; P.y = P.ty; }          /* otherwise follow exactly — no lag */
  P.tilt = lerp(P.tilt, clamp((P.x-prevx)*.06,-.5,.5), .3);
  P.inv = Math.max(0,P.inv-dt);
  if (P.morphT>0) P.morphT = Math.max(0, P.morphT - dt);
  P.thrust = (P.thrust + dt*22)%100;

  const m = P.mods;
  const mor = clamp(P.morphT||0, 0, 1);              /* proximity morph 0..1 (#11) */
  const rate = (0.135 - m.rapid*0.017)*(P.focus?.92:1);
  P.fireT -= dt;
  if (P.fireT<=0 && P.alive){
    P.fireT = rate;
    const dmg = (1 + m.power*.55)*(1 + mor*.3);       /* grazing morphs the cannon heavier... */
    const morShots = P.focus ? 0 : Math.round(mor*2);  /* ...and wider — but Focus keeps it a tight stream (#12) */
    const n = 1 + m.spread + morShots;
    const arc = (P.focus?.05:.13)*Math.max(0,n-1);
    for (let i=0;i<n;i++){
      const a = -Math.PI/2 + (n===1?0:(-arc/2 + arc*i/(n-1)));
      shoot(P.x,P.y-14,a,760,dmg,m.pierce);
    }
    if (m.power>=3){
      shoot(P.x-11,P.y-6,-Math.PI/2,700,dmg*.6,m.pierce);
      shoot(P.x+11,P.y-6,-Math.PI/2,700,dmg*.6,m.pierce);
    }
    Sound.shot();
  }
  if (m.homing){
    P.missileT -= dt;
    if (P.missileT<=0){
      P.missileT = .78 - m.homing*.16;
      for (let i=0;i<m.homing;i++)
        pbullets.push({ x:P.x+(i?14:-14), y:P.y, vx:(i?110:-110), vy:-160, r:5,
                        dmg:2.4+m.power*.3, pierce:0, homing:true, life:3, trail:0 });
    }
  }
  const nd = drones.length;
  for (let i=0;i<nd;i++){
    const d = drones[i];
    let ox, oy, fireA = -Math.PI/2;
    if (P.droneForm===1){                       /* SIDE — flank guard, wide screen coverage */
      const side = (i%2)?1:-1, rank = Math.floor(i/2);
      ox = side*(34+rank*15); oy = -2 - rank*8;
    } else if (P.droneForm===2){                /* TRACK — orbit and fire at the nearest threat */
      d.a += dt*1.6; ox = Math.cos(d.a)*42; oy = Math.sin(d.a)*42; fireA = null;
    } else {                                     /* FWD — tight forward arrow, concentrated fire */
      const c = (nd-1)/2;
      ox = (i-c)*15; oy = -22 - Math.abs(i-c)*11;
    }
    const k = 1-Math.pow(1-0.25, dt*60);
    d.ox = lerp(d.ox||0, ox, k); d.oy = lerp(d.oy||0, oy, k);
    d.x = P.x + d.ox; d.y = P.y + d.oy;
    let aim = fireA;
    if (aim===null){
      let best=null, bd=1e9;
      for (const e of enemies){ const dd=dist2(d.x,d.y,e.x,e.y); if (dd<bd){ bd=dd; best=e; } }
      if (boss){ const dd=dist2(d.x,d.y,boss.x,boss.y); if (dd<bd){ bd=dd; best=boss; } }
      aim = best ? Math.atan2(best.y-d.y,best.x-d.x) : -Math.PI/2;
    }
    d.drawA = aim;
    d.fireT -= dt;
    if (d.fireT<=0){ d.fireT=.3; shoot(d.x, d.y, aim, 640, 1.1, 0); }
  }

  /* ground-strike sub-weapon (#3/#4) — aimed by ship position, auto-drops on the reticle below */
  if (ground.length && P.alive){
    P.gsT = (P.gsT||0) - dt;
    if (P.gsT<=0){ P.gsT = .5; groundStrike(P.x, clamp(P.y-GS_AHEAD,30,H-40), 5 + P.mods.power); }
  }
}
function shoot(x,y,a,sp,dmg,pierce){ dmg*=dmgMul; pierce+=pierceBonus;
  pbullets.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:4, dmg, pierce, life:2.2, trail:0 });
}
function hurtPlayer(){
  if (P.inv>0 || !P.alive || state!=='playing') return;
  if (P.shield>0){
    P.shield--; P.inv=1.1; shake=Math.max(shake,10); Sound.hurt();
    rank = Math.max(0, rank-0.15);
    burst(P.x,P.y,18,PAL.hull,190); refreshHUD(true); return;
  }
  P.lives--;
  P.inv=2.2; shake=26; flash=.7; Sound.boom(1.3); Sound.hurt();
  burst(P.x,P.y,54,PAL.hull,320);
  chain=0; grazeStreak=0; grazeMult=0; grazeTimer=0; mult=1;
  P.od=0; P.morphT=0; rank=Math.max(0,rank-0.35);   /* Break, morph, and rank all ease on a hit */
  haptic([0,45,25,45]);
  const owned = Object.keys(P.mods).filter(k=>P.mods[k]>0);
  if (owned.length){
    const lost = pick(owned); P.mods[lost]--;
    if (P.lives>0) spawnWreck(P.x, P.y, lost);   /* reclaim it before it drifts away (#19) */
  }
  syncDrones();
  for (let i=ebullets.length-1;i>=0;i--)
    if (dist2(ebullets[i].x,ebullets[i].y,P.x,P.y) < 180*180){ spark(ebullets[i].x,ebullets[i].y,PAL.ebullet); ebullets.splice(i,1); }
  if (P.lives<=0){ P.alive=false; hitstop=.35; setTimeout(gameOver,1000); }
  refreshHUD(true);
}

/* --- the bomb: a visible shockwave that sweeps the screen --- */
function useBomb(){
  if (state!=='playing' || !P.alive) return;
  if (P.bombs<=0){
    elPadBomb.classList.remove('deny'); void elPadBomb.offsetWidth; elPadBomb.classList.add('deny');
    floatText(P.x,P.y-30,'NO BOMBS',PAL.ebullet);
    return;
  }
  P.bombs--; P.inv = Math.max(P.inv,1.8);
  shocks.push({ x:P.x, y:P.y, r:20, max:Math.hypot(W,H)*1.05, hitB:new Set(), hitE:new Set(), hitG:new Set() });
  whiteout=.35; shake=20; Sound.bombFx(); haptic([0,60,40,80]);
  teach('bomb', 'The <b>shockwave</b> sweeps outward — it wipes enemy fire into crystals and damages everything it touches.');
  refreshHUD(true);
}
function updateShocks(dt){
  for (let i=shocks.length-1;i>=0;i--){
    const s = shocks[i];
    const prev = s.r;
    s.r += (900 + s.r*1.6)*dt;
    /* enemy fire caught by the wave becomes chain fuel — the bomb pays you back */
    for (let j=ebullets.length-1;j>=0;j--){
      const b = ebullets[j], d = Math.hypot(b.x-s.x, b.y-s.y);
      if (d <= s.r && d > prev-40){
        if (Math.random()<.5) dropPickup(b.x,b.y,'crystal');
        spark(b.x,b.y,PAL.crystal); ebullets.splice(j,1);
      }
    }
    for (const e of enemies.slice()){
      const d = Math.hypot(e.x-s.x, e.y-s.y);
      if (d <= s.r && !s.hitE.has(e)){ s.hitE.add(e); damageEnemy(e, 16, true); }
    }
    if (boss){
      const d = Math.hypot(boss.x-s.x, boss.y-s.y);
      if (d <= s.r && !s.hitB.has(boss)){
        s.hitB.add(boss);
        for (const p of boss.parts) if (p.alive) damageBoss(9, p);
        damageBoss(16);
      }
    }
    for (let gi=ground.length-1;gi>=0;gi--){ const gg=ground[gi];
      if (Math.hypot(gg.x-s.x,gg.y-s.y) <= s.r && !s.hitG.has(gg)){ s.hitG.add(gg); damageGround(gg,12); } }
    if (s.r > s.max) shocks.splice(i,1);
  }
}
function drawShocks(){
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shocks){
    const f = clamp(1 - s.r/s.max, 0, 1);
    ctx.strokeStyle = rgba(PAL.bolt, .55*f + .15);
    ctx.lineWidth = 3 + 16*f;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.stroke();
    ctx.strokeStyle = rgba(PAL.crystal, .5*f);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*.86,0,TAU); ctx.stroke();
    ctx.fillStyle = rgba(PAL.hull, .05*f);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   7 · enemies — a distinct roster per sector
   ============================================================ */
const TYPES = {
  /* sector 1 */
  drifter:{ hp:3,  r:15, score:100, speed:105, draw:dwDrifter },
  weaver: { hp:4,  r:15, score:150, speed:80,  draw:dwWeaver  },
  lancer: { hp:3,  r:13, score:180, speed:70,  draw:dwLancer  },
  turret: { hp:9,  r:20, score:260, speed:60,  draw:dwTurret  },
  sentry: { hp:16, r:23, score:420, speed:44,  draw:dwSentry  },
  /* sector 2 — the boneyard runs on salvage */
  hauler: { hp:26, r:30, score:600, speed:34,  draw:dwHauler  },
  scavver:{ hp:5,  r:14, score:220, speed:0,   draw:dwScavver },
  /* sector 3 — everything here divides or burns */
  cinder: { hp:6,  r:18, score:240, speed:70,  draw:dwCinder  },
  ember:  { hp:2,  r:10, score:90,  speed:120, draw:dwEmber   },
  /* sector 4 — geometry that refuses to be hit honestly */
  blinker:{ hp:6,  r:15, score:280, speed:0,   draw:dwBlinker },
  prism:  { hp:12, r:20, score:380, speed:52,  draw:dwPrism   },
  /* sector 5 — things that move together, and things that wait */
  shoal:  { hp:1,  r:9,  score:60,  speed:0,   draw:dwShoal   },
  angler: { hp:14, r:22, score:520, speed:40,  draw:dwAngler  }
};

function spawnEnemy(type,x,y,opts){
  const t = TYPES[type];
  const e = Object.assign({
    type, x, y, r:t.r, hp:t.hp*diff.hp, maxhp:t.hp*diff.hp, t:0, fireT:rnd(.6,1.6),
    vx:0, vy:t.speed, ang:0, flash:0, phase:rnd(0,TAU), drop:null, state:'in', holdY:H*.2
  }, opts||{});
  enemies.push(e);
  return e;
}

function updateEnemy(e,dt){
  e.t += dt; e.flash = Math.max(0,e.flash-dt*5);
  switch (e.type){
    case 'wisp':
      e.y += e.vy*dt*.7; e.x += Math.sin(e.t*.9+e.phase)*90*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){ e.fireT=rnd(2.2,3.2); fireAt(e.x,e.y,P.x,P.y,105*BV,{hom:.8,r:7}); }
      break;

    case 'polyp':
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.4+e.phase)*30*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(2.4,3.4);
        if (enemies.length < 26){ const m=spawnEnemy('mote', e.x, e.y+18, {}); m.vy=rnd(120,180); }
        else ring(e.x,e.y,8,150*BV,rnd(0,TAU));
      }
      break;

    case 'chorister':
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.7+e.phase)*52*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(2.6,3.6);
        const off = rnd(0,TAU);
        ring(e.x,e.y,12,120*BV,off);
        ring(e.x,e.y,12,180*BV,off+Math.PI/12);
      }
      break;

    case 'warp':
      e.bt -= dt;
      if (e.bt<=0){
        e.bt = 1.4;
        burst(e.x,e.y,8,PAL.foe,140);
        /* it reappears on your flank, not on top of you */
        e.x = clamp(P.x + (Math.random()<.5?-1:1)*rnd(W*.18,W*.34), 30, W-30);
        e.y = clamp(rnd(H*.08,H*.44), 40, H*.52);
        fireAt(e.x,e.y,P.x,P.y,290*BV,{r:5});
      }
      break;

    case 'pulsar': {
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.5+e.phase)*40*dt;
      const beat = Math.sin(e.t*2.2);
      if (beat > .985 && e.y>0 && (e.beatT||0)<=0){ e.beatT=.5; ring(e.x,e.y,14,165*BV,rnd(0,TAU)); }
      e.beatT = (e.beatT||0) - dt;
      break;
    }

    case 'mote': {
      const a = Math.atan2(P.y-e.y,P.x-e.x);
      e.vx = lerp(e.vx, Math.cos(a)*190, .015); e.vy = lerp(e.vy, Math.sin(a)*190, .015);
      e.x += e.vx*dt; e.y += e.vy*dt;
      if (Math.random()<dt*18) parts.push({x:e.x,y:e.y,vx:0,vy:-20,life:.3,max:.3,r:2,c:PAL.foe,g:0});
      break;
    }

    case 'drifter':
      e.y += e.vy*dt; e.x += Math.sin(e.t*1.3+e.phase)*26*dt; break;

    case 'weaver':
      e.y += e.vy*dt*.8; e.x += Math.cos(e.t*2+e.phase)*130*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){ e.fireT=rnd(1.4,2.3); fireAt(e.x,e.y,P.x,P.y,190*BV); }
      break;

    case 'lancer':
      if (e.state==='in'){ e.y += 130*dt; if (e.y>e.holdY){ e.state='aim'; e.aimT=.55; } }
      else if (e.state==='aim'){
        e.aimT -= dt; e.x += Math.sin(e.t*6)*30*dt;
        if (e.aimT<=0){ const a=Math.atan2(P.y-e.y,P.x-e.x);
          e.vx=Math.cos(a)*430*BV; e.vy=Math.sin(a)*430*BV; e.state='dive'; }
      } else {
        e.x += e.vx*dt; e.y += e.vy*dt;
        if (Math.random()<dt*30) parts.push({x:e.x,y:e.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.3,max:.3,r:2.5,c:PAL.foe,g:0});
      }
      break;

    case 'turret':
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.8+e.phase)*40*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(1.5,2.2);
        const base = Math.atan2(P.y-e.y,P.x-e.x);
        for (let i=-1;i<=1;i++) fireAng(e.x,e.y,base+i*.26,200*BV);
      }
      break;

    case 'sentry':
      if (e.y<e.holdY) e.y += e.vy*dt;
      e.ang += dt*1.1; e.x += Math.sin(e.t*.6+e.phase)*55*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){ e.fireT=rnd(2,2.8); ring(e.x,e.y,10,150*BV,rnd(0,TAU)); }
      break;

    case 'hauler': {
      if (e.y<e.holdY) e.y += e.vy*dt; else e.x += Math.sin(e.t*.5+e.phase)*46*dt;
      e.ang += dt*.4;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(2.2,3.0);
        /* coughs up a cloud of scrap rather than aimed fire */
        for (let i=0;i<9;i++) fireAng(e.x,e.y, rnd(0,TAU), rnd(70,180)*BV, { r:5, life:5 });
      }
      break; }

    case 'scavver': {
      /* comes in from a side, dashes across, snipes on the way */
      e.x += e.dir*260*dt*(1+Math.sin(e.t*3)*.35);
      e.y += Math.sin(e.t*2.6+e.phase)*70*dt;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.x>0 && e.x<W){ e.fireT=rnd(1,1.7); fireAt(e.x,e.y,P.x,P.y,255*BV,{r:5}); }
      if ((e.dir>0 && e.x>W+50)||(e.dir<0 && e.x<-50)) return false;
      return true; }

    case 'cinder':
      e.y += e.vy*dt; e.x += Math.sin(e.t*1.1+e.phase)*44*dt; e.ang += dt*1.6;
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){ e.fireT=rnd(2,3); ring(e.x,e.y,6,130*BV,e.t); }
      break;

    case 'ember': {
      /* drawn to you, slowly — a heat-seeking nuisance */
      const a = Math.atan2(P.y-e.y,P.x-e.x);
      e.vx = lerp(e.vx, Math.cos(a)*130*BV, .02);
      e.vy = lerp(e.vy, Math.sin(a)*130*BV, .02);
      e.x += e.vx*dt; e.y += e.vy*dt;
      if (Math.random()<dt*24) parts.push({x:e.x,y:e.y,vx:rnd(-14,14),vy:rnd(-30,-8),life:.4,max:.4,r:2.2,c:PAL.foe,g:0});
      break; }

    case 'blinker':
      if (e.y<e.holdY){ e.y += 150*dt; break; }
      e.blinkT = (e.blinkT===undefined? rnd(.8,1.6) : e.blinkT) - dt;
      e.fade = clamp((e.blinkT<.25? e.blinkT/.25 : 1),0,1);
      if (e.blinkT<=0){
        e.blinkT = rnd(1.3,2.0);
        e.x = rnd(W*.12,W*.88); e.y = rnd(H*.08,H*.42);
        spark(e.x,e.y,PAL.foe);
        for (let i=-1;i<=1;i+=2) fireAt(e.x,e.y,P.x,P.y,235*BV,{r:5});
      }
      break;

    case 'prism':
      if (e.y<e.holdY) e.y += e.vy*dt;
      e.x += Math.sin(e.t*.7+e.phase)*60*dt;
      /* the shield faces where it last looked — flank it */
      /* the shield sweeps on its own — wait for it to turn away, then shoot */
      e.sa = (e.sa===undefined? Math.atan2(P.y-e.y,P.x-e.x) : e.sa + dt*1.15);
      e.fireT -= dt*RATE;
      if (e.fireT<=0 && e.y>0){
        e.fireT = rnd(1.8,2.6);
        for (let i=-2;i<=2;i++) fireAng(e.x,e.y, e.sa + i*.16, 190*BV);
      }
      break;

    case 'shoal': {
      const g = e.grp;
      e.x = g.x + e.ox + Math.sin(e.t*3+e.phase)*7;
      e.y = g.y + e.oy + Math.cos(e.t*2.4+e.phase)*7;
      if (e.y>H+40) return false;
      return true; }

    case 'angler': {
      if (e.y<e.holdY) e.y += e.vy*dt;
      e.x += Math.sin(e.t*.4+e.phase)*40*dt;
      e.lure = .5 + Math.sin(e.t*2)*.5;
      const near = dist2(e.x,e.y,P.x,P.y) < 240*240;
      e.woke = e.woke || near;
      if (e.woke){
        e.fireT -= dt*RATE;
        if (e.fireT<=0){
          e.fireT = rnd(2.4,3.2);
          const base = Math.atan2(P.y-e.y,P.x-e.x);
          for (let i=-2;i<=2;i++) fireAng(e.x,e.y, base+i*.2, 175*BV, { r:7 });
        }
      }
      break; }
  }
  e.x = clamp(e.x,18,W-18);
  if (e.y>H+80 || e.y<-300) return false;
  return true;
}

/* --- bullet emitters shared by enemies and bosses --- */
function fireAng(x,y,a,sp,o){
  if (ebullets.length>720) ebullets.shift();
  ebullets.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:(o&&o.r)||6, life:(o&&o.life)||8,
                  t:0, big:(o&&o.big)||false });
}
function fireAt(x,y,tx,ty,sp,o){ fireAng(x,y,Math.atan2(ty-y,tx-x),sp,o); }
/* #7: harder = denser geometry, not more HP. Void adds a tier; sustained high rank adds another.
   Layers are deterministic (fixed offsets), preserving any safe lane a pattern leaves. */
function geoTier(){ return (diff.key==='void'?1:0) + (rank>0.6?1:0); }
function ring(x,y,n,sp,off,o){
  const g = geoTier();
  for (let i=0;i<n;i++) fireAng(x,y,off+i/n*TAU,sp,o);
  if (g>=1) for (let i=0;i<n;i++) fireAng(x,y, off+(i+.5)/n*TAU, sp*1.28, o);   /* faster interleaved curtain */
  if (g>=2) for (let i=0;i<n;i++) fireAng(x,y, off+i/n*TAU, sp*.74, o);          /* slower trailing curtain */
}
function gapRing(x,y,n,sp,off,gapAt,gapW,o){
  const g = geoTier();
  const emit = (a,s)=>{ const d=Math.abs(((a-gapAt+Math.PI*3)%TAU)-Math.PI); if (d<gapW) return; fireAng(x,y,a,s,o); };
  for (let i=0;i<n;i++) emit(off+i/n*TAU, sp);
  if (g>=1) for (let i=0;i<n;i++) emit(off+(i+.5)/n*TAU, sp*1.28);   /* denser, but the gap stays open */
}
function shotgun(x,y,tx,ty,n,spread,sp1,sp2,o){
  const base = Math.atan2(ty-y,tx-x);
  const N = n + geoTier()*2;
  for (let i=0;i<N;i++) fireAng(x,y, base+rnd(-spread,spread), rnd(sp1,sp2), o);
}
function lance(x,y,a,warn,live){ lasers.push({ x,y,a, warn, live, w:0 }); Sound.alarm(); }

function damageEnemy(e,dmg,silent){
  if (e.type==='prism'){
    /* front arc deflects — the whole point of the thing */
    const a = Math.atan2(P.y-e.y,P.x-e.x);
    let d = Math.abs(((a-e.sa+Math.PI*3)%TAU)-Math.PI);
    if (d < .7 && !silent){ e.flash=.4; return false; }
  }
  if (ground.length && !silent && enemyShielded(e)){   /* a ground pylon is protecting it (#3) */
    dmg *= .2;
    if (rand()<.05) floatText(e.x,e.y-e.r,'SHIELDED',PAL.boss);
  }
  e.hp -= dmg; e.flash = 1;
  if (e.hp<=0){ killEnemy(e,silent); return true; }
  return false;
}
function killEnemy(e,silent){
  const i = enemies.indexOf(e);
  if (i>=0) enemies.splice(i,1);
  const T = TYPES[e.type];
  burst(e.x,e.y, 22+T.r, PAL.foe, 200+T.r*4);
  if (!silent) Sound.boom(.55+T.r/60);
  addScore(T.score,e.x,e.y);
  if (e.type==='cinder'){                 /* splits — killing it isn't the end of it */
    for (let k=0;k<2;k++){
      const f = spawnEnemy('ember', e.x+(k?16:-16), e.y, {});
      f.vx = (k?1:-1)*90; f.vy = 40;
    }
  }
  /* Break (#9): a close kill charges the meter; while in Break, kills spill extra gold */
  if (P.alive && P.odT<=0 && dist2(e.x,e.y,P.x,P.y) < 150*150) P.od = Math.min(1,(P.od||0)+.05);
  let n = e.type==='shoal' ? 1 : rint(2,4);
  if (P.odT>0) n += 2;
  for (let k=0;k<n;k++) dropPickup(e.x+rnd(-14,14), e.y+rnd(-10,10), 'crystal');
  if (e.drop) dropPickup(e.x,e.y,e.drop);
  else if (Math.random() < (T.r>18?.16:.06)) dropPickup(e.x,e.y,rollMod());
  shake = Math.max(shake, 4+T.r*.14);
}
function rollMod(){ return pick(['power','power','spread','rapid','homing','pierce','drones','shield','bomb']); }

/* ============================================================
   7b · the ground plane (#3) — a second targetable layer below the air fight.
   Air fire can't touch it; only the ground-strike reticle (#4) can. Ground fire is
   still hot; the reticle and its impacts are player-cool. Legibility rule holds.
   ============================================================ */
const GROUND = {
  bunker: { hp:14, r:22, score:400 },
  pylon:  { hp:22, r:24, score:640, shieldR:150 }   /* shields air enemies within range */
};
const GSCROLL = 72, GS_AHEAD = 120;
function spawnGround(type,x,opts){
  const t = GROUND[type];
  const g = Object.assign({ type, x:clamp(x,30,W-30), y:-50, r:t.r, hp:t.hp*diff.hp, maxhp:t.hp*diff.hp,
                            fireT:rnd(1.2,2.8), t:0, flash:0 }, opts||{});
  ground.push(g);
  teach('ground','Targets on the <b>ground below</b> — your cool <b>strike reticle</b> auto-hits them. Line it up by moving.');
  return g;
}
function groundLine(type,n){ for (let i=0;i<n;i++) spawnGround(type, W*(i+1)/(n+1) + rnd(-24,24)); }
function updateGround(dt){
  for (let i=ground.length-1;i>=0;i--){
    const g = ground[i]; g.t += dt; g.y += GSCROLL*dt; g.flash = Math.max(0,g.flash-dt*5);
    if (g.y > H+70){ swapDel(ground,i); continue; }
    if (g.type==='bunker' && g.y>16 && g.y<H-30){
      g.fireT -= dt*RATE;
      if (g.fireT<=0){ g.fireT = rnd(1.9,3.0); fireAt(g.x,g.y,P.x,P.y,175*BV,{r:6}); }
    }
  }
}
function enemyShielded(e){
  for (const g of ground) if (g.type==='pylon' && dist2(g.x,g.y,e.x,e.y) < GROUND.pylon.shieldR*GROUND.pylon.shieldR) return true;
  return false;
}
function damageGround(g,dmg){
  g.hp -= dmg; g.flash = 1;
  if (g.hp>0) return;
  const i = ground.indexOf(g); if (i>=0) swapDel(ground,i);
  const T = GROUND[g.type];
  burst(g.x,g.y,26,PAL.foe,240); Sound.boom(.8); shake = Math.max(shake,8);
  addScore(T.score,g.x,g.y);
  for (let k=0;k<rint(2,4);k++) dropPickup(g.x+rnd(-14,14),g.y,'crystal');
  if (rand()<.4) dropPickup(g.x,g.y,rollMod());
  if (g.type==='pylon') floatText(g.x,g.y-20,'SHIELD DOWN',PAL.bolt);
}
function groundStrike(x,y,dmg){
  let hit = false;
  for (let i=ground.length-1;i>=0;i--){ const g=ground[i];
    if (dist2(g.x,g.y,x,y) < (44+g.r)*(44+g.r)){ damageGround(g,dmg); hit = true; } }
  groundFx.push({ x, y, t:0, hit });
  for (let k=0;k<(hit?7:3);k++){ const a=rnd(0,TAU), s=rnd(40,150);
    pPart({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(.15,.35), r:rnd(1,2.4), c:PAL.bolt, g:0 }); }

function drawReticle(){
  if (!ground.length || !P.alive) return;

  ctx.save(); ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=rgba(PAL.bolt,.7); ctx.lineWidth=1.6;

    ctx.moveTo(rx+c[0]*s, ry+c[1]*s - c[1]*o); ctx.lineTo(rx+c[0]*s, ry+c[1]*s); ctx.lineTo(rx+c[0]*s - c[0]*o, ry+c[1]*s);
    ctx.stroke();
  }

function drawGroundFx(dt){
  ctx.globalCompositeOperation='lighter';
  for (let i=groundFx.length-1;i>=0;i--){
    const f = groundFx[i]; f.t += dt;

/* ============================================================
   8 · boss framework
   ============================================================ */
function spawnBoss(def){
  const parts = (def.parts ? def.parts() : []).map((p,i) =>
    Object.assign({ id:i, alive:true, r:24, x:W/2, y:-100, fireT:rnd(.5,2) }, p,
                  { hp:p.hp*diff.hp, max:p.hp*diff.hp }));
  boss = {
    def, x:W/2, y:-170, tx:W/2, ty:(def.y||.2)*H, r:def.r, t:0, flash:0, phase:1,
    hp:def.hp*diff.hp, max:def.hp*diff.hp, spin:0, timers:{}, vars:{}, parts
  };
  if (def.init) def.init(boss);
  bossMaxHP = boss.max + parts.reduce((s,p)=>s+p.max,0);
  showBoss(true, def.label);
  Sound.alarm(); Sound.targetIntensity = 1;
}
function partPos(b,p){
  if (p.rad !== undefined){ const a = p.a + (p.fixed?0:b.spin); p.x = b.x+Math.cos(a)*p.rad; p.y = b.y+Math.sin(a)*p.rad; }
  else { p.x = b.x+(p.ox||0); p.y = b.y+(p.oy||0); }
}
function bossTotalHP(){
  if (!boss) return 0;
  let h = Math.max(0,boss.hp);
  for (const p of boss.parts) if (p.alive) h += Math.max(0,p.hp);
  return h;
}
function updateBoss(dt){
  const b = boss, d = b.def;
  b.t += dt; b.flash = Math.max(0,b.flash-dt*5);
  b.spin += dt*(d.spin||0);
  if (d.move) d.move(b,dt);
  b.x = lerp(b.x,b.tx,1-Math.pow(.94,dt*60));
  b.y = lerp(b.y,b.ty,1-Math.pow(.96,dt*60));
  if (d.layout) d.layout(b,dt); else for (const p of b.parts) partPos(b,p);

  /* phase gates — the flip snaps to the next musical beat (#10) so transitions land on the downbeat */
  if (d.phaseAt){
    const fr = b.hp/b.max;
    let ph = 1;
    for (let i=0;i<d.phaseAt.length;i++) if (fr <= d.phaseAt[i]) ph = i+2;
    if (ph !== b.phase && beatTick){ b.phase = ph; flash=.35; Sound.alarm(); if (d.onPhase) d.onPhase(b,ph); }
  }
  /* beat-locked sniper accent (#8/#10) — a fast aimed shot on the bar cuts through slow curtains */
  if (beatTick && beatCount%4===0 && b.phase>=2 && P.alive)
    fireAt(b.x,b.y,P.x,P.y, 430*BV, {r:5});
  /* attacks */
  for (const at of d.attacks){
    if (at.phase && at.phase.indexOf(b.phase)<0) continue;
    if (at.needParts === 0 && b.parts.some(p=>p.alive)) continue;
    if (at.needParts === 1 && !b.parts.some(p=>p.alive)) continue;
    const k = at.k;
    if (b.timers[k] === undefined) b.timers[k] = at.first!==undefined ? at.first : at.every;
    b.timers[k] -= dt*RATE;
    if (b.timers[k] <= 0){
      b.timers[k] = typeof at.every==='function' ? at.every(b) : at.every;
      at.fn(b);
    }
  }
  if (d.tick) d.tick(b,dt);
}
function damageBoss(dmg,part){
  const b = boss; if (!b) return;
  if (part && part.alive){
    part.hp -= dmg; b.flash = .6;
    if (part.hp<=0){
      part.alive = false;
      burst(part.x,part.y,34,PAL.boss,300); Sound.boom(1); shake=16; hitstop=.09;
      addScore(600,part.x,part.y);
      for (let k=0;k<4;k++) dropPickup(part.x+rnd(-16,16),part.y,'crystal');
      dropPickup(part.x,part.y,rollMod());
      /* #15: make the modular design readable — the vector this part fed is now gone */
      floatText(part.x,part.y-10,'MODULE DOWN',PAL.crystal);
      if (!b.parts.some(p=>p.alive)){
        if (b.def.coreGuard) floatText(b.x,b.y-46,'CORE EXPOSED',PAL.bolt);
        teach('subsys','Blow off a boss’s <b>modules</b> to strip its attacks — and expose the core.');
      }
      if (b.def.onPartDeath) b.def.onPartDeath(b,part);
    }
  } else {
    const guard = b.def.coreGuard ? b.def.coreGuard(b) : 0;
    if (guard >= 1){ b.flash=.3; if (Math.random()<.3) floatText(b.x,b.y-40,'SHIELDED',PAL.ebullet); updateBossBar(); return; }
    b.hp -= dmg*(1-guard); b.flash = 1;
  }
  updateBossBar();
  if (b.hp<=0) killBoss();
}
function killBoss(){
  const b = boss, big = !!b.def.final;
  addScore(b.def.reward||4000, b.x, b.y);
  for (let i=0;i<(big?14:9);i++)
    setTimeout(()=>{ burst(b.x+rnd(-80,80), b.y+rnd(-60,60), 30, i%2?PAL.boss:PAL.crystal, 340);
                     Sound.boom(1.2); shake=20; }, i*110);
  for (let k=0;k<16;k++) dropPickup(b.x+rnd(-70,70), b.y+rnd(-30,30), 'crystal');
  dropPickup(b.x-34,b.y,rollMod()); dropPickup(b.x+34,b.y,rollMod()); dropPickup(b.x,b.y+26,'shield');
  if (big) dropPickup(b.x,b.y-20,'bomb');
  ebullets.length = 0; lasers.length = 0;
  curveField = 0; pullField = 0;
  boss = null; showBoss(false);
  Sound.targetIntensity = .55; whiteout = .3;
}

function relicTick(dt){
  const R = P.relics||{};
  /* Quickening — extra cannon cycling rather than a rewritten fire rate */
  if (R.tempo) P.fireT -= dt*.22;
  /* Bulwark — slow shield regrowth */
  if (R.bulwark){
    P.bulwarkT = (P.bulwarkT||0) + dt;
    if (P.bulwarkT >= 20){ P.bulwarkT = 0;
      if (P.shield < P.shieldMax){ P.shield++; floatText(P.x,P.y-26,'BULWARK',PAL.hull); refreshHUD(true); } }
  }
  /* Break (#9) — graze and close kills charge the meter; when full, the ship boils over
     into a screen-melting overdrive. Charging happens in onGraze / killEnemy. */
  if (P.odT > 0){
    P.odT -= dt;
    P.fireT -= dt*1.6;                                 /* far faster fire while broken */
    if (Math.random() < dt*95)
      pPart({ x:P.x+rnd(-18,18), y:P.y+rnd(-16,16), vx:rnd(-50,50), vy:rnd(70,200),
              life:.45, r:rnd(1.6,4.2), c:PAL.bolt, g:0 });
    if (P.odT <= 0) floatText(P.x,P.y-30,'BREAK OUT',PAL.hull);
  } else if (P.od >= 1){
    P.od = 0; P.odT = R.surge?8:6;
    whiteout = Math.max(whiteout,.2); shake = Math.max(shake,12);
    floatText(P.x,P.y-34,'BREAK',PAL.bolt); Sound.alarm(); haptic([0,45,30,70]);
  } else P.od = Math.max(0,(P.od||0) - dt*.05);         /* slow bleed if you stop pressing the aggression */

  dmgMul = 1 + (P.odT>0?.8:0) + (R.lens && P.focus ? .4 : 0) + (R.bore?.15:0);
  pierceBonus = (R.bore?1:0) + (P.odT>0?1:0);

  if (elBreakFill){
    elBreakFill.style.width = (P.odT>0 ? 100 : (P.od||0)*100) + '%';
    elBreakBar.classList.toggle('full', P.odT>0);
  }
}

          const x0 = sp.side? W : 0, hit = sp.side ? P.x > W-sp.len : P.x < sp.len;
          if (hit && Math.abs(P.y-sp.y) < 16) hurtPlayer();
        }
      }
    },
    drawBack(){
      for (const sp of this.spurs){
        const x0 = sp.side? W : 0, dir = sp.side? -1 : 1;
        ctx.save(); ctx.translate(x0,sp.y);
        ctx.beginPath(); ctx.moveTo(0,-13);
        ctx.quadraticCurveTo(dir*sp.len*.6,-9, dir*sp.len,0);
        ctx.quadraticCurveTo(dir*sp.len*.6,9, 0,13); ctx.closePath();
        ctx.fillStyle='rgba(30,8,28,.95)'; ctx.fill();
        ctx.strokeStyle=rgba(PAL.foe,.8); ctx.lineWidth=2; ctx.stroke();
        ctx.restore();
        addGlow(x0+dir*sp.len,sp.y,26,PAL.foe,.5);
      }
    },
    drawFront(){}
  }),
  /* 9 — standing waves of sound roll down the sector */
  resonance:()=>({
    t:2, waves:[],
    update(dt){
      this.t -= dt;
      if (this.t<=0){ this.t = rnd(3.4,4.6); this.waves.push({ y:-40, v:rnd(120,170), gap:rnd(W*.18,W*.82), gw:W*.14 }); }
      for (let i=this.waves.length-1;i>=0;i--){
        const w=this.waves[i]; w.y += w.v*dt;
        if (P.alive && P.inv<=0 && Math.abs(P.y-w.y)<12 && Math.abs(P.x-w.gap)>w.gw) hurtPlayer();
        if (w.y>H+40) this.waves.splice(i,1);
      }
    },
    drawBack(){},
    drawFront(){
      ctx.globalCompositeOperation='lighter';
      for (const w of this.waves){
        ctx.strokeStyle=rgba(PAL.elaser,.75); ctx.lineWidth=5;
        ctx.beginPath(); ctx.moveTo(0,w.y); ctx.lineTo(w.gap-w.gw,w.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w.gap+w.gw,w.y); ctx.lineTo(W,w.y); ctx.stroke();
        addGlow(w.gap-w.gw,w.y,30,PAL.elaser,.5); addGlow(w.gap+w.gw,w.y,30,PAL.elaser,.5);
      }
      ctx.globalCompositeOperation='source-over';
    }
  }),
  /* 10 — wells that drag the weave, and you, out of true */
  wells:()=>({
    items:[{x:W*.28,y:H*.3,r:120,s:1,p:0},{x:W*.72,y:H*.55,r:120,s:-1,p:2}],
    update(dt){
      for (const w of this.items){
        w.p += dt*.5;
        w.x = clamp(W*.5 + Math.cos(w.p*w.s)*W*.3, 40, W-40);
        w.y = clamp(H*.4 + Math.sin(w.p*.7)*H*.22, 60, H*.8);
        if (P.alive){
          const dx=w.x-P.x, dy=w.y-P.y, d=Math.hypot(dx,dy)||1;
          if (d < w.r){ const f=(1-d/w.r)*130*dt; P.x+=dx/d*f; P.y+=dy/d*f; P.tx+=dx/d*f; P.ty+=dy/d*f; }
        }
        for (const b of ebullets){
          const dx=w.x-b.x, dy=w.y-b.y, d=Math.hypot(dx,dy)||1;
          if (d < w.r){ const f=(1-d/w.r)*90*dt; b.vx+=dx/d*f*6; b.vy+=dy/d*f*6; }
        }
      }
    },
    drawBack(){
      ctx.globalCompositeOperation='lighter';
      for (const w of this.items){
        for (let i=1;i<=4;i++){
          ctx.strokeStyle=rgba(PAL.boss,.07*i);
          ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.arc(w.x,w.y,w.r*i/4 + Math.sin(w.p*3+i)*4,0,TAU); ctx.stroke();
        }
        addGlow(w.x,w.y,50,PAL.boss,.3);
      }
      ctx.globalCompositeOperation='source-over';
    },
    drawFront(){}
  }),
  /* 11 — the sector has a pulse, and it squeezes */
  systole:()=>({
    t:0,
    update(dt){
      this.t += dt;
      const beat = (this.t % 4.2);
      this.squeeze = beat > 3.2 ? Math.sin((beat-3.2)/1*Math.PI) : 0;
      const band = this.squeeze * W*.3;
      if (this.squeeze>.1 && P.alive && P.inv<=0 && (P.x < band || P.x > W-band)) hurtPlayer();
    },
    drawBack(){},
    drawFront(){
      const band = (this.squeeze||0) * W*.3;
      if (band<1) return;
      const g1=ctx.createLinearGradient(0,0,band,0);
      g1.addColorStop(0,rgba(PAL.ebullet,.5)); g1.addColorStop(1,rgba(PAL.ebullet,0));
      ctx.fillStyle=g1; ctx.fillRect(0,0,band,H);
      const g2=ctx.createLinearGradient(W,0,W-band,0);
      g2.addColorStop(0,rgba(PAL.ebullet,.5)); g2.addColorStop(1,rgba(PAL.ebullet,0));
      ctx.fillStyle=g2; ctx.fillRect(W-band,0,band,H);
    }
  }),
  /* 12 — mirror shards that bounce whatever hits them */
  shards:()=>({
    items:(()=>{const a=[];for(let i=0;i<5;i++)a.push({x:rnd(60,W-60),y:rnd(-H,H*.6),a:rnd(0,TAU),spin:rnd(-.4,.4),len:rnd(50,96),v:rnd(20,44)});return a;})(),
    update(dt){
      for (const k of this.items){

        if (k.y > H+60){ k.y=-60; k.x=rnd(60,W-60); }
        for (const b of ebullets){
          const dx=b.x-k.x, dy=b.y-k.y;
          const proj = dx*Math.cos(k.a)+dy*Math.sin(k.a);
          if (Math.abs(proj) > k.len*.5) continue;
          const perp = -dx*Math.sin(k.a)+dy*Math.cos(k.a);
          if (Math.abs(perp) < 7 && !b.bounced){
            b.bounced = 1;
            const na = 2*k.a - Math.atan2(b.vy,b.vx) + Math.PI;
            const sp = Math.hypot(b.vx,b.vy);
            b.vx = Math.cos(na)*sp; b.vy = Math.sin(na)*sp;
            spark(b.x,b.y,PAL.star);
          }
        }
      }
    },
    drawBack(){
      for (const k of this.items){
        ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.a);
        const g=ctx.createLinearGradient(-k.len/2,0,k.len/2,0);
        g.addColorStop(0,rgba(PAL.star,.15)); g.addColorStop(.5,rgba(PAL.star,.85)); g.addColorStop(1,rgba(PAL.star,.15));
        ctx.strokeStyle=g; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(-k.len/2,0); ctx.lineTo(k.len/2,0); ctx.stroke();
        ctx.restore();
        addGlow(k.x,k.y,30,PAL.star,.35);
      }
    },
    drawFront(){}
  })
});

/* --- relics are offered on the way into each of the last six sectors --- */
function offerRelic(proceed){
  const owned = P.relics||{};
  const pool = RELICS.filter(r=>!owned[r.k]);
  if (!pool.length){ proceed(); return; }
  const pickThree = [];
  while (pickThree.length<Math.min(3,pool.length)){
    const r = pick(pool);
    if (pickThree.indexOf(r)<0) pickThree.push(r);
  }
  elVeil.classList.remove('off');
  elVeil.innerHTML = '<div class="eyebrow">Salvage from the wreck</div><h2>Take one</h2>'+
    '<p class="lede">Relics are permanent for the rest of the run, and the caps on your weapon have come off.</p>'+
    '<div id="relicBox" style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px"></div>';
  const box = $('relicBox');
  pickThree.forEach(r=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.style.textAlign = 'left'; b.style.padding = '13px 15px';
    b.innerHTML = r.n + '<small>' + r.d + '</small>';
    b.onclick = ()=>{
      P.relics[r.k] = 1;
      if (r.k==='twin') syncDrones();
      Sound.pickup();
      proceed();
    };
    box.appendChild(b);
  });
}

let step=0, waitTime=0, waitClear=false;
function runLevelScript(dt){
  const SCRIPT = LEVELS[levelIdx].script;
  if (waitTime>0){ waitTime -= dt; return; }
  if (waitClear){ if (enemies.length || boss) return; waitClear = false; }
  while (step < SCRIPT.length){
    const s = SCRIPT[step++];
    if (s.wait !== undefined){ waitTime = s.wait; return; }
    if (s.clear){ waitClear = true; return; }
    if (s.banner){ showBanner(s.banner.t, s.banner.s); continue; }
    if (s.spawn){ s.spawn(); continue; }
    if (s.checkpoint){ saveCheckpoint(); continue; }
    if (s.end){ levelClear(); return; }
  }
}
function saveCheckpoint(){
  checkpoint = { level:levelIdx, step, score, cores, lives:P.lives, bombs:P.bombs, shield:P.shield,
                 mods:Object.assign({},P.mods) };
  showBanner('Checkpoint','Progress secured');
}
function loadCheckpoint(){
  const c = checkpoint;
  levelIdx = c.level;
  clearField(); showBoss(false);
  applyPalette(levelIdx); Sound.setMode(levelIdx);
  hazard = LEVELS[levelIdx].hazard ? HAZARDS[LEVELS[levelIdx].hazard]() : null;
  step = c.step; waitTime = 1.2; waitClear = false;
  score = c.score; cores = c.cores;
  P.lives = Math.max(1,c.lives); P.bombs = Math.max(1,c.bombs); P.shield = c.shield;
  P.mods = Object.assign({},c.mods); P.alive = true; P.inv = 2.4;
  P.x=W/2; P.y=H*.78; P.tx=P.x; P.ty=P.y;
  chain=0; mult=1; grazeStreak=0; grazeMult=0; grazeTimer=0; rank=0;
  lastBeat=-1; beatCount=0;
  syncDrones(); refreshHUD(true);
}

/* ============================================================
   11 · pickups, particles, scoring
   ============================================================ */
function dropPickup(x,y,kind){
  pickups.push({ x, y, vx:rnd(-40,40), vy:rnd(-70,-20), kind, t:0, r:kind==='crystal'?9:15, mag:false });
}
function spawnWreck(x,y,mod){
  pickups.push({ x, y, vx:rnd(-30,30), vy:rnd(-40,-10), kind:'wreck', mod, t:0, r:16, mag:false });
}
function collectPickup(p){
  if (p.kind==='crystal'){
    chain++; chainTimer = 2.6;
    recalcMult();
    cores++; addScore(25,p.x,p.y,true);
    Sound.chime(clamp(chain%12,0,11)); popMult();
  } else if (p.kind==='shield'){
    P.shield = Math.min(P.shieldMax,P.shield+1);
    floatText(p.x,p.y,'SHIELD',PAL.hull); Sound.pickup();
  } else if (p.kind==='bomb'){
    P.bombs = Math.min(5,P.bombs+1);
    floatText(p.x,p.y,'BOMB',PAL.missile); Sound.pickup();
    teach('bomb','You have bombs. Tap <b>BOMB</b> for a shockwave that wipes enemy fire into crystals.');
  } else if (p.kind==='wreck'){
    /* reclaim the upgrade you shed when you were hit (#19), plus a little Break back */
    if (p.mod && P.mods[p.mod] < MODMAX[p.mod]){ P.mods[p.mod]++; if (p.mod==='drones') syncDrones(); }
    P.od = Math.min(1,(P.od||0)+.3);
    floatText(p.x,p.y,'RECLAIMED',PAL.missile); Sound.pickup(); haptic(20); refreshHUD(true);
  } else {
    const m = P.mods;
    if (m[p.kind] < MODMAX[p.kind]){
      m[p.kind]++;
      floatText(p.x,p.y, MODNAME[p.kind]+' '+m[p.kind], PAL.pickup);
      if (p.kind==='drones'){ syncDrones();
        teach('form', DESKTOP?'Drones online — press <b>C</b> to change their formation.'
                             :'Drones online — tap <b>FORM</b> to change their formation.'); }
    } else { addScore(500,p.x,p.y); floatText(p.x,p.y,'+500',PAL.crystal); }
    Sound.pickup();
  }
  spark(p.x,p.y,PAL.crystal);
  refreshHUD();
}
function recalcMult(){ mult = Math.min(16, clamp(1+Math.floor(chain/8),1,8) + grazeMult); }
function onGraze(b){
  graze++; grazeStreak++; grazeTimer = 1.5;
  grazeMult = clamp(Math.floor(grazeStreak/10), 0, 8);
  recalcMult();
  score += 2*mult;
  /* proximity aura (#11): active grazing morphs the cannon wider & heavier */
  P.morphT = Math.min(1.2, (P.morphT||0) + .5);
  /* Break (#9): graze charges the meter (Overcharge relic fills faster) */
  if (P.odT<=0) P.od = Math.min(1, (P.od||0) + ((P.relics&&P.relics.surge)?.03:.015));

    floatText(P.x,P.y-30,'GRAZE ×'+grazeMult,PAL.crystal); popMult(); haptic(8); refreshHUD(); }
}
function addScore(v,x,y,quiet){

  refreshHUD();
}
function floatText(x,y,txt,col){ floats.push({ x,y,txt,col,life:.9,max:.9 }); }
function burst(x,y,n,col,sp){

    pPart({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(.25,.8), max:.8, r:rnd(1.4,4.4), c:col, g:60 }); }

}
function spark(x,y,col){

    pPart({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(.12,.3), max:.3, r:rnd(1,2.4), c:col, g:0 }); }

/* ============================================================
   12 · loop
   ============================================================ */
let last = 0, acc = 0;
const FIXED = 1/120;   /* the sim always advances in fixed steps → patterns are frame-rate independent */
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let real = clamp((ts-last)/1000, 0, 0.1);
  last = ts;

  /* adaptive quality — if the frame time creeps up, shed detail to hold the rate */
  frameEMA += ((real*1000) - frameEMA) * 0.05;
  if (qCooldown>0) qCooldown -= real;
  if (Settings.quality==='auto' && qCooldown<=0 && qLevel>0 && frameEMA>26){
    qLevel--; applyQuality(); frameEMA = 16; qCooldown = 3;
  }

  const sv = SPEEDS[speedIdx].v;
  if (state==='playing'){
    acc += real*sv;
    let steps = 0;
    while (acc >= FIXED && steps < 8){
      let dt = FIXED;
      if (hitstop>0){ hitstop -= dt; dt *= .12; }
      elapsed += dt; update(dt);
      acc -= FIXED; steps++;
    }
    if (steps>=8) acc = 0;   /* fell behind — drop the backlog rather than spiral */
    render(real*sv);
  } else {
    acc = 0;
    updateAmbient(real*sv);
    render(real*sv);
  }
}
function updateAmbient(dt){
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.g||0)*dt;
    if (p.life<=0){ partPool.push(p); swapDel(parts,i); }
  }
  shake *= Math.pow(.02,dt); flash *= Math.pow(.02,dt); whiteout *= Math.pow(.01,dt);
}

function update(dt){
  /* ---- Director: rank, effective velocity/cadence, beat clock (all deterministic) ---- */
  if (P.alive) rank = clamp(rank + dt*(0.008 + clamp(mult/16,0,1)*0.02), 0, 1);
  BV = diff.bv * (1 + rank*RANK_BV);
  RATE = diff.rate * (1 + rank*RANK_RATE);
  { const nb = Math.floor(elapsed/BEAT_SEC); beatTick = (nb !== lastBeat); if (beatTick){ lastBeat = nb; beatCount++; } }

  runLevelScript(dt);
  updatePlayer(dt);
  updateShocks(dt);
  updateGroups(dt);
  updateGround(dt);
  if (hazard) hazard.update(dt);

  if (chain>0){ chainTimer -= dt; if (chainTimer<=0){ chain=0; recalcMult(); refreshHUD(); } }

  for (let i=enemies.length-1;i>=0;i--) if (!updateEnemy(enemies[i],dt)) enemies.splice(i,1);
  if (boss) updateBoss(dt);

  /* player bullets */
  for (let i=pbullets.length-1;i>=0;i--){
    const b = pbullets[i];
    b.life -= dt;
    if (b.homing){
      let best=null, bd=1e9;
      for (const e of enemies){ const d=dist2(b.x,b.y,e.x,e.y); if (d<bd){ bd=d; best=e; } }
      if (boss){ const d=dist2(b.x,b.y,boss.x,boss.y)*.6; if (d<bd){ bd=d; best=boss; } }
      if (best){
        const want=Math.atan2(best.y-b.y,best.x-b.x), cur=Math.atan2(b.vy,b.vx);
        let da=((want-cur+Math.PI*3)%TAU)-Math.PI;
        const na=cur+clamp(da,-4*dt,4*dt), sp=Math.min(560,Math.hypot(b.vx,b.vy)+520*dt);
        b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
      }
      b.trail -= dt;
      if (b.trail<=0){ b.trail=.02; parts.push({x:b.x,y:b.y,vx:0,vy:40,life:.28,max:.28,r:2.6,c:PAL.missile,g:0}); }
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.y<-30||b.y>H+30||b.x<-30||b.x>W+30||b.life<=0){ swapDel(pbullets,i); continue; }

    let gone = false;
    for (let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if (dist2(b.x,b.y,e.x,e.y) < (e.r+b.r)*(e.r+b.r)){
        spark(b.x,b.y,PAL.bolt);
        damageEnemy(e, b.dmg*diff.dmg);
        if (b.pierce>0) b.pierce--; else gone = true;
        break;
      }
    }
    if (gone){ swapDel(pbullets,i); continue; }

    if (boss){
      let hitPart = null, hit = false;
      for (const p of boss.parts){
        if (!p.alive) continue;
        if (dist2(b.x,b.y,p.x,p.y) < p.r*p.r){ hitPart = p; hit = true; break; }
      }
      if (!hit && dist2(b.x,b.y,boss.x,boss.y) < boss.r*boss.r) hit = true;
      if (hit){
        spark(b.x,b.y,PAL.crystal);
        damageBoss(b.dmg*diff.dmg, hitPart);
        if (b.pierce>0) b.pierce--; else swapDel(pbullets,i);
      }
    }
  }

  /* enemy bullets */
  for (let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    b.t += dt; b.life -= dt;
    if (curveField){
      const a = Math.atan2(b.vy,b.vx) + curveField*dt, sp = Math.hypot(b.vx,b.vy);
      b.vx = Math.cos(a)*sp; b.vy = Math.sin(a)*sp;
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.x<-50||b.x>W+50||b.y<-50||b.y>H+60||b.life<=0){ swapDel(ebullets,i); continue; }
    if (P.alive && P.inv<=0){
      const d2 = dist2(b.x,b.y,P.x,P.y), hitR = b.r*.7+P.r;
      if (d2 < hitR*hitR){ swapDel(ebullets,i); hurtPlayer(); continue; }
      const gr = b.r+P.r+GRAZE_R;
      if (!b.grazed && d2 < gr*gr){ b.grazed = true; onGraze(b); }
    }
  }
  if (grazeTimer>0){ grazeTimer -= dt; if (grazeTimer<=0){ grazeStreak=0; grazeMult=0; recalcMult(); } }

  /* lances */
  for (let i=lasers.length-1;i>=0;i--){
    const l = lasers[i];
    if (l.warn>0){ l.warn -= dt; l.a += dt*.25; if (l.warn<=0) Sound.boom(.9); }
    else {
      l.live -= dt; l.a += dt*.55; l.w = Math.min(16,l.w+dt*70);
      if (P.alive && P.inv<=0){
        const dx=P.x-l.x, dy=P.y-l.y, proj=dx*Math.cos(l.a)+dy*Math.sin(l.a);
        if (proj>0 && Math.abs(-dx*Math.sin(l.a)+dy*Math.cos(l.a)) < l.w*.6+P.r) hurtPlayer();
      }
      if (l.live<=0) lasers.splice(i,1);
    }
  }

  /* bodies */
  if (P.alive && P.inv<=0){
    for (const e of enemies)
      if (dist2(e.x,e.y,P.x,P.y) < (e.r*.8+P.r)*(e.r*.8+P.r)){ damageEnemy(e,3); hurtPlayer(); break; }
    if (boss){
      if (dist2(boss.x,boss.y,P.x,P.y) < (boss.r*.85+P.r)*(boss.r*.85+P.r)) hurtPlayer();
      else for (const p of boss.parts)
        if (p.alive && dist2(p.x,p.y,P.x,P.y) < (p.r*.8+P.r)*(p.r*.8+P.r)){ hurtPlayer(); break; }
    }
  }

  /* pickups */
  const poc = P.alive && P.y < H*0.25;          /* point-of-collection (#18): the top vacuums everything */
  if (poc) teach('poc','The <b>top of the screen</b> vacuums every crystal — dive up to sweep them in.');
  const magnetR = (P.relics&&P.relics.well) ? Math.hypot(W,H) : 120 + chain*2;
  for (let i=pickups.length-1;i>=0;i--){
    const p = pickups[i]; p.t += dt;
    if (P.alive && (poc || dist2(p.x,p.y,P.x,P.y) < magnetR*magnetR)) p.mag = true;
    if (p.mag && P.alive){
      const a=Math.atan2(P.y-p.y,P.x-p.x), sp=260+p.t*160;
      p.vx=lerp(p.vx,Math.cos(a)*sp,.3); p.vy=lerp(p.vy,Math.sin(a)*sp,.3);
    } else { p.vy += 90*dt; p.vy = Math.min(p.vy,130); p.vx *= .98; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.y>H+40){ pickups.splice(i,1); continue; }
    if (P.alive && dist2(p.x,p.y,P.x,P.y) < (p.r+P.r+10)*(p.r+P.r+10)){ collectPickup(p); pickups.splice(i,1); }
  }

  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .985; p.vy = p.vy*.985 + (p.g||0)*dt;
    if (p.life<=0){ partPool.push(p); swapDel(parts,i); }
  }
  for (let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life -= dt; f.y -= dt*38; if (f.life<=0) swapDel(floats,i); }

  shake *= Math.pow(.02,dt); flash *= Math.pow(.02,dt); whiteout *= Math.pow(.005,dt);

  if (P.alive && Math.random()<dt*90)
    parts.push({ x:P.x+rnd(-4,4), y:P.y+13, vx:rnd(-16,16), vy:rnd(120,220), life:.3, max:.3, r:rnd(1.6,3.4), c:PAL.bolt, g:0 });

  Sound.targetIntensity = boss ? 1 : clamp(.2+enemies.length*.09+chain*.01,.15,.9);
}

/* ============================================================
   13 · render
   ============================================================ */
let glows = [], scrollY = 0, vigKey = '', vignette = null;
function addGlow(x,y,r,c,a){ glows.push({x,y,r,c,a:a===undefined?1:a}); }

function render(dt){
  glows.length = 0;
  scrollY += dt*(state==='playing'?46:16);
  const shk = shake * Settings.shake;
  const sx = shk>.2 ? rnd(-shk,shk)*.5 : 0;
  const sy = shk>.2 ? rnd(-shk,shk)*.5 : 0;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#04070f'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(sx,sy);

  drawNebula(); drawStars(dt); drawDebrisLayer(dt);
  if (hazard && state!=='title') hazard.drawBack();

  if (state !== 'title'){
    drawGround();
    drawPickups(); drawParticles(); drawEnemies();
    if (boss) drawBoss();
    drawLasers(); drawShocks(); drawPlayerBullets(); drawEnemyBullets();
    if (P.alive) drawShip();
    drawGroundFx(dt); drawReticle();
    drawFloats();
    if (hazard) hazard.drawFront();
  } else { drawParticles(); drawTitleShip(); }

  ctx.restore();
  compositeGlow(sx,sy);

  if (flash>.01){ const fa=flash*.34*Settings.flash*(Settings.safeFlash?.4:1); ctx.fillStyle='rgba(255,80,140,'+fa+')'; ctx.fillRect(0,0,W,H); }
  if (whiteout>.01){ const wa=whiteout*.8*Settings.flash*(Settings.safeFlash?.3:1); ctx.fillStyle='rgba(220,255,245,'+wa+')'; ctx.fillRect(0,0,W,H); }
  if (state==='playing' && P.alive && P.y < H*0.25){   /* point-of-collection cue (#18) */
    const g = ctx.createLinearGradient(0,0,0,H*0.25);
    g.addColorStop(0,rgba(PAL.bolt,.12)); g.addColorStop(1,rgba(PAL.bolt,0));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.25);
  }
  drawVignette();
}

function drawNebula(){
  const s=420, scale=Math.max(W,H)/s*1.5, w=s*scale, h=s*scale;
  ctx.globalAlpha = .85;
  const off = (scrollY*.06)%h;
  ctx.drawImage(nebC,(W-w)/2,off-h,w,h); ctx.drawImage(nebC,(W-w)/2,off,w,h);
  if (qLevel>0){
    ctx.globalAlpha = .5;
    const w2=w*.65, h2=h*.65, off2=(scrollY*.14)%h2, dx=Math.sin(scrollY*.001)*30;
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(nebC,(W-w2)/2+dx,off2-h2,w2,h2); ctx.drawImage(nebC,(W-w2)/2+dx,off2,w2,h2);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha = 1;
}
function drawStars(dt){
  ctx.globalCompositeOperation='lighter';
  for (let l=0;l<3;l++) for (const st of stars[l]){
    st.y += st.s*dt*(state==='playing'?1:.35);
    if (st.y>H+2){ st.y=-2; st.x=rnd(0,W); }
    st.tw += dt*3;
    ctx.fillStyle = rgba(PAL.star, .35+Math.sin(st.tw)*.25+l*.12);

}
function drawDebrisLayer(dt){

    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot);
    ctx.beginPath(); ctx.moveTo(d.pts[0][0],d.pts[0][1]);
    for (let i=1;i<d.pts.length;i++) ctx.lineTo(d.pts[i][0],d.pts[i][1]);
    ctx.closePath();
    ctx.fillStyle='rgba(6,16,26,.86)'; ctx.fill();

function shellPath(n,r){

function foeShade(e){ return e.flash>0 ? 'rgba(255,255,255,'+(.35+e.flash*.5)+')' : null; }

/* --- boss render --- */
function drawBoss(){
  const b = boss, d = b.def;
  if (d.drawExtra) d.drawExtra(b);
  for (const p of b.parts){
    if (!p.alive) continue;
    ctx.save(); ctx.translate(p.x,p.y);
    if (d.drawPart) d.drawPart(b,p);
    ctx.restore();
    addGlow(p.x,p.y,p.r*1.5,PAL.foe,.5);
  }
  ctx.save(); ctx.translate(b.x,b.y);
  d.draw(b);
  ctx.restore();
  addGlow(b.x,b.y,b.r*1.6,PAL.boss,.55+b.flash*.4);
}
function drawLasers(){
  for (const l of lasers){
    const len = Math.max(W,H)*1.6;
    ctx.save(); ctx.translate(l.x,l.y); ctx.rotate(l.a);
    if (l.warn>0){
      ctx.strokeStyle=rgba(PAL.ebullet,.25+Math.sin(l.warn*40)*.2); ctx.lineWidth=2; ctx.setLineDash([12,10]);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,0); ctx.stroke(); ctx.setLineDash([]);
    } else {
      const w = l.w*clamp(l.live/1.5,.15,1);
      const g = ctx.createLinearGradient(0,-w,0,w);
      g.addColorStop(0,rgba(PAL.elaser,0)); g.addColorStop(.5,rgba(PAL.elaser,.95)); g.addColorStop(1,rgba(PAL.elaser,0));
      ctx.fillStyle=g; ctx.fillRect(0,-w,len,w*2);
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fillRect(0,-w*.18,len,w*.36);
    }
    ctx.restore();
    if (l.warn<=0) addGlow(l.x,l.y,60,PAL.elaser,.6);
  }
}
function drawPlayerBullets(){
  ctx.globalCompositeOperation='lighter';
  for (const b of pbullets){
    if (b.homing){
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx));
      ctx.fillStyle=rgba(PAL.missile,.95);
      ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-5,3.4); ctx.lineTo(-5,-3.4); ctx.closePath(); ctx.fill();
      ctx.restore(); addGlow(b.x,b.y,16,PAL.missile,.8);
    } else {
      ctx.fillStyle=rgba(PAL.bolt,.95); ctx.fillRect(b.x-1.6,b.y-9,3.2,16);
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fillRect(b.x-.8,b.y-6,1.6,10);
      addGlow(b.x,b.y,13,PAL.bolt,.75);
    }
  }
  ctx.globalCompositeOperation='source-over';
}
function drawEnemyBullets(){
  const cb = Settings.colorblind;
  /* contrast guard — a dark rim under every enemy round so the hot band always
     separates from a hot-palette sector (ashfall / ember / marrow). Legibility
     never depends on the background. Drawn in source-over, before the glow. */
  for (const b of ebullets){
    const r = b.r;
    ctx.fillStyle = 'rgba(4,3,8,'+(cb?.9:.66)+')';
    ctx.beginPath(); ctx.arc(b.x,b.y,r*1.05+2.2,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation='lighter';
  for (const b of ebullets){
    const r = b.r;
    ctx.fillStyle=rgba(PAL.ebullet,.28); ctx.beginPath(); ctx.arc(b.x,b.y,r*1.6,0,TAU); ctx.fill();
    ctx.fillStyle=rgba(PAL.ebullet,.95); ctx.beginPath(); ctx.arc(b.x,b.y,r*.85,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,244,250,'+(cb?1:.95)+')'; ctx.beginPath(); ctx.arc(b.x,b.y,r*(cb?.5:.36),0,TAU); ctx.fill();
    addGlow(b.x,b.y,b.big?24:14,PAL.ebullet,.5);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawPickups(){

      for (let i=0;i<6;i++){ const a=i/6*TAU, x=Math.cos(a)*13, y=Math.sin(a)*13; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
